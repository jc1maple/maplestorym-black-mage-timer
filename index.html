          await beginEditorYoutubeCapture(token);
          await waitForEditorYoutubeDuration(token);
          await primeEditorYoutubeForScan(token);
        }
        const result = activeBossProfile().detector === "seren"
          ? await scanEditorSerenAnchors(token)
          : await scanEditorPhaseAnchors(token);
        if (token !== editorState.detectionToken) return;
        const count = applyEditorPhaseAnchors(
          result.anchors,
          result.methods,
          scanUsesYoutube ? "YouTube 自動校正完成" : "畫面偵測完成",
        );
        if (count !== PHASE_ORDER.length) {
          els.editorPhaseStatus.textContent = `畫面偵測 ${count}/${PHASE_ORDER.length}，可手動修正時間`;
        }
      } catch (error) {
        if (token === editorState.detectionToken) {
          els.editorPhaseStatus.textContent = `偵測失敗：${error.message}`;
        }
      } finally {
        if (token === editorState.detectionToken) {
          editorPause();
          editorSetPlaybackRate(restoreRate);
          if (scanUsesYoutube) {
            seekEditorVideo(restoreTime);
            await delay(250);
          } else {
            await seekEditorDetectionFrame(restoreTime, token);
          }
          editorSetMuted(restoreMuted);
        }
        if (scanUsesYoutube) endEditorYoutubeCapture();
        if (token === editorState.detectionToken) {
          editorState.detecting = false;
          els.editorDetectPhasesBtn.disabled = false;
          resetEditorVoicePlayback({ stopAudio: true, clearPlayed: true });
          if (resume) editorPlay().catch(() => {});
        }
      }
    }

    function handleEditorVideoLoaded() {
      resetEditorVoicePlayback({ stopAudio: true, clearPlayed: true });
      autoDetectEditorPhases().catch((error) => {
        els.editorPhaseStatus.textContent = `偵測失敗：${error.message}`;
      });
    }

    function seekEditorVideo(targetS) {
      if (!Number.isFinite(targetS)) return;
      editorState.voiceArmedKey = "";
      editorState.voiceArmedAtS = Number.NaN;
      const duration = editorDuration();
      const max = duration > 0 ? Math.max(0, duration - 0.01) : Math.max(0, targetS);
      const target = Math.max(0, Math.min(targetS, max));
      if (editorUsesYoutube()) {
        if (!editorState.youtubeReady) return;
        if (!editorState.detecting) handleEditorVoiceSeeking();
        try { editorState.youtubePlayer.seekTo(target, true); } catch (_) { return; }
        if (!editorState.detecting) {
          window.setTimeout(() => {
            if (!editorUsesYoutube() || editorState.detecting) return;
            editorState.voiceSeeking = false;
            resetEditorVoicePlayback();
          }, 350);
        }
        return;
      }
      els.editorVideo.currentTime = target;
    }

    function editorSeekBy(deltaS) {
      seekEditorVideo(editorCurrentTime() + Number(deltaS || 0));
    }

    function editorHudTime() {
      return Number(editorState.hudTimes[editorState.phase] || 0);
    }

    function setEditorStatus(text, kind = "") {
      els.editorStatus.textContent = text;
      els.editorStatus.className = `editorStatus ${kind}`.trim();
    }

    function updateEditorSaveStatus() {
      const count = editorState.dirtyKeys.size;
      els.editorSaveBtn.disabled = count === 0;
      setEditorStatus(count ? `${count} 則尚未儲存` : "沒有未儲存變更", count ? "dirty" : "");
      updateFeedbackButton();
    }

    function markEditorDirty(cue, refresh = true) {
      const key = editorCueKey(cue);
      const original = editorState.originalByKey.get(key);
      const changed = !original
        || String(cue.text || "") !== original.text
        || Math.abs(Number(cue.start_s || 0) - original.start_s) > 0.0005
        || Math.abs(Number(cue.lead_s || 0) - original.lead_s) > 0.0005
        || Boolean(cue.enabled) !== original.enabled
        || Boolean(cue.deleted) !== original.deleted;
      if (changed) editorState.dirtyKeys.add(key);
      else editorState.dirtyKeys.delete(key);
      cue.scheduled_s = editorScheduledS(cue);
      editorState.voicePlayedKeys.delete(editorCueKey(cue));
      if (refresh) updateEditorSaveStatus();
    }

    function shiftEditorCueGroup(cues, requestedDeltaS) {
      if (!cues.length) return 0;
      const minStartS = Math.min(...cues.map((cue) => Number(cue.start_s || 0)));
      const deltaS = Math.max(-minStartS, Number(requestedDeltaS || 0));
      for (const cue of cues) {
        const oldStartS = Number(cue.start_s || 0);
        const durationS = Math.max(0, Number(cue.end_s ?? oldStartS) - oldStartS);
        cue.start_s = Math.max(0, Math.round((oldStartS + deltaS) * 1000) / 1000);
        cue.end_s = cue.start_s + durationS;
        markEditorDirty(cue, false);
      }
      updateEditorSaveStatus();
      return deltaS;
    }

    function renderEditorSelected() {
      normalizeEditorSelection();
      const cue = editorCueByKey(editorState.selectedKey);
      const selectedCount = editorState.selectedKeys.size;
      const controls = [els.editorTextInput, els.editorStartInput, els.editorLeadInput, els.editorPromptInput, els.editorEnabledInput, els.editorSetCueBtn, els.editorJumpCueBtn, els.editorPreviewCueBtn, els.editorDeleteCueBtn];
      const nudgeButtons = [...document.querySelectorAll("[data-editor-nudge]")];
      if (!cue) {
        els.editorSelectedName.textContent = "尚未選取招式";
        for (const control of [...controls, ...nudgeButtons]) control.disabled = true;
        els.editorStartInput.value = "";
        els.editorLeadInput.value = "";
        els.editorPromptInput.value = "";
        els.editorTextInput.value = "";
        return;
      }
      const cueLabel = phaseDisplayLabel(cue.phase, cueTimelineVariant(cue));
      els.editorSelectedName.textContent = selectedCount > 1
        ? `已選 ${selectedCount} 招 · ${cueLabel}#${cue.cue_index} ${cue.text}`
        : `${cueLabel}#${cue.cue_index} ${cue.text}`;
      els.editorTextInput.value = String(cue.text || "");
      els.editorStartInput.value = Number(cue.start_s || 0).toFixed(3);
      els.editorLeadInput.value = Number(cue.lead_s || 0).toFixed(3);
      els.editorPromptInput.value = editorScheduledS(cue).toFixed(3);
      els.editorEnabledInput.checked = Boolean(cue.enabled);
      for (const control of [...controls, ...nudgeButtons]) control.disabled = false;
    }

    function saveCustomSkillLibrary() {
      localStorage.setItem(CUSTOM_SKILLS_KEY, JSON.stringify([...editorState.customSkillTexts]));
    }

    function renderEditorSkillLibrary() {
      const baseTexts = new Set(state.baseTimeline
        .filter((cue) => cueBossId(cue) === editorState.bossId)
        .map((cue) => String(cue.text || "").trim())
        .filter(Boolean));
      const entries = [...new Set([...baseTexts, ...editorState.customSkillTexts])]
        .sort((a, b) => a.localeCompare(b, "zh-TW"));
      els.editorSkillLibrary.innerHTML = entries.map((text) => {
        const encoded = encodeURIComponent(text);
        const custom = editorState.customSkillTexts.has(text) && !baseTexts.has(text);
        return `<span class="skillChip ${custom ? "customSkill" : ""}">
          <button class="skillUse" data-editor-skill="${encoded}" title="${escapeHtml(text)}">${escapeHtml(text)}</button>
          ${custom ? `<button class="skillRemove" data-editor-skill-remove="${encoded}" title="從快速新增移除" aria-label="移除 ${escapeHtml(text)}">×</button>` : ""}
        </span>`;
      }).join("");
    }

    function renderEditorTable() {
      normalizeEditorSelection();
      const query = String(els.editorFilter.value || "").trim().toLocaleLowerCase("zh-TW");
      const rows = editorPhaseCues().filter((cue) => !query || String(cue.text || "").toLocaleLowerCase("zh-TW").includes(query));
      els.editorTable.innerHTML = rows.map((cue) => {
        const key = editorCueKey(cue);
        const selected = editorState.selectedKeys.has(key) ? "selected" : "";
        const primary = key === editorState.selectedKey ? "primarySelection" : "";
        const playing = key === editorState.playbackCueKey ? "playing" : "";
        const dirty = editorState.dirtyKeys.has(key) ? "dirty" : "";
        const enabled = cue.enabled ? "" : "disabledCue";
        return `<button class="editorCueRow ${selected} ${primary} ${playing} ${dirty}" data-editor-key="${escapeHtml(key)}" aria-current="${playing ? "true" : "false"}" aria-pressed="${selected ? "true" : "false"}">
          <span>${phaseDisplayLabel(cue.phase, cueTimelineVariant(cue))}#${cue.cue_index}</span>
          <span>${fmt(Number(cue.start_s || 0))}</span>
          <span class="promptCol">${fmt(editorScheduledS(cue))}</span>
          <span>${escapeHtml(cue.text || "")}</span>
          <span class="${enabled}">${cue.enabled ? "開" : "關"}</span>
        </button>`;
      }).join("");
    }

    function renderEditorRail() {
      normalizeEditorSelection();
      const cues = editorPhaseCues();
      const duration = Math.max(90, ...cues.map((cue) => editorScheduledS(cue) + 12));
      editorState.railWidth = Math.max(900, Math.ceil(duration * EDITOR_RAIL_PX_PER_SECOND));
      const ticks = [];
      for (let second = 0; second <= duration; second += 10) {
        ticks.push(`<span class="railTick" style="left:${second * EDITOR_RAIL_PX_PER_SECOND}px">${Math.floor(second / 60)}:${String(second % 60).padStart(2, "0")}</span>`);
      }
      const markers = cues.map((cue) => {
        const key = editorCueKey(cue);
        const selected = editorState.selectedKeys.has(key) ? "selected" : "";
        const primary = key === editorState.selectedKey ? "primarySelection" : "";
        const playing = key === editorState.playbackCueKey ? "playing" : "";
        const scheduledS = editorScheduledS(cue);
        return `<button class="railCue ${selected} ${primary} ${playing}" data-editor-key="${escapeHtml(key)}" style="left:${scheduledS * EDITOR_RAIL_PX_PER_SECOND}px" title="${escapeHtml(`拖曳調整 · 提示 ${fmt(scheduledS)} · 招式 ${fmt(Number(cue.start_s || 0))} · ${cue.text}`)}" aria-label="拖曳調整 ${escapeHtml(cue.text || "")}" aria-pressed="${selected ? "true" : "false"}"></button>`;
      });
      els.editorRail.style.width = `${editorState.railWidth}px`;
      els.editorRail.innerHTML = `${ticks.join("")}${markers.join("")}<span id="editorRailPlayhead" class="railPlayhead" title="目前時間 00:00.000 · 拖曳可調整" aria-label="拖曳目前時間 00:00.000"><span class="railPlayheadTime" aria-hidden="true">00:00.000</span></span>`;
    }

    function beginEditorRailDrag(event) {
      if (event.button !== 0) return;
      const marker = event.target.closest(".railCue[data-editor-key]");
      if (!marker) return;
      if (multiSelectModifier(event)) return;
      const cue = editorCueByKey(marker.dataset.editorKey);
      if (!cue) return;
      editorPause();
      editorState.phase = cue.phase;
      const key = editorCueKey(cue);
      if (!editorState.selectedKeys.has(key)) replaceEditorSelection(key);
      else editorState.selectedKey = key;
      const cues = selectedEditorCues();
      const items = cues.map((itemCue) => {
        const itemKey = editorCueKey(itemCue);
        const itemMarker = els.editorRail.querySelector(`[data-editor-key="${CSS.escape(itemKey)}"]`);
        const originalStartS = Number(itemCue.start_s || 0);
        return {
          cue: itemCue,
          marker: itemMarker,
          originalStartS,
          durationS: Math.max(0, Number(itemCue.end_s ?? originalStartS) - originalStartS),
        };
      });
      editorState.railDrag = {
        cue,
        marker,
        items,
        pointerId: event.pointerId,
        startClientX: event.clientX,
        minOriginalStartS: Math.min(...items.map((item) => item.originalStartS)),
        moved: false,
      };
      marker.setPointerCapture?.(event.pointerId);
      for (const itemMarker of els.editorRail.querySelectorAll(".railCue[data-editor-key]")) {
        const selected = editorState.selectedKeys.has(itemMarker.dataset.editorKey);
        itemMarker.classList.toggle("selected", selected);
        itemMarker.classList.toggle("primarySelection", itemMarker.dataset.editorKey === key);
        itemMarker.setAttribute("aria-pressed", String(selected));
      }
      renderEditorSelected();
      renderEditorTable();
      event.preventDefault();
    }

    function moveEditorRailDrag(event) {
      const drag = editorState.railDrag;
      if (!drag || drag.pointerId !== event.pointerId) return;
      const deltaPx = event.clientX - drag.startClientX;
      if (!drag.moved && Math.abs(deltaPx) < 3) return;
      drag.moved = true;
      els.editorRailViewport.classList.add("dragging");
      const requestedDeltaS = Math.round((deltaPx / EDITOR_RAIL_PX_PER_SECOND) * 10) / 10;
      const deltaS = Math.max(-drag.minOriginalStartS, requestedDeltaS);
      for (const item of drag.items) {
        const nextStartS = Math.max(0, Math.round((item.originalStartS + deltaS) * 1000) / 1000);
        item.cue.start_s = nextStartS;
        item.cue.end_s = nextStartS + item.durationS;
        markEditorDirty(item.cue, false);
        if (item.marker) {
          const scheduledS = editorScheduledS(item.cue);
          item.marker.classList.add("dragging");
          item.marker.style.left = `${scheduledS * EDITOR_RAIL_PX_PER_SECOND}px`;
          item.marker.title = `拖曳調整 · 提示 ${fmt(scheduledS)} · 招式 ${fmt(nextStartS)} · ${item.cue.text}`;
        }
      }
      updateEditorSaveStatus();
      renderEditorSelected();
      const primaryStartS = Number(drag.cue.start_s || 0);
      setEditorStatus(
        drag.items.length > 1
          ? `${drag.items.length} 招一起調整 ${deltaS >= 0 ? "+" : ""}${deltaS.toFixed(1)} 秒`
          : `${drag.cue.phase}#${drag.cue.cue_index} 調整到 ${fmt(primaryStartS)}`,
        "dirty",
      );
      event.preventDefault();
    }

    function endEditorRailDrag(event) {
      const drag = editorState.railDrag;
      if (!drag || drag.pointerId !== event.pointerId) return;
      editorState.railDrag = null;
      drag.marker.releasePointerCapture?.(event.pointerId);
      els.editorRailViewport.classList.remove("dragging");
      if (!drag.moved) return;
      const canceled = event.type === "pointercancel";
      if (canceled) {
        for (const item of drag.items) {
          item.cue.start_s = item.originalStartS;
          item.cue.end_s = item.originalStartS + item.durationS;
          markEditorDirty(item.cue, false);
        }
        updateEditorSaveStatus();
      }
      editorState.suppressRailClick = true;
      renderEditorRail();
      renderEditorTable();
      renderEditorSelected();
      if (!canceled) playEditorCueFromPrompt(drag.cue);
      window.setTimeout(() => { editorState.suppressRailClick = false; }, 0);
      event.preventDefault();
    }

    function updateEditorRailPlayhead(playhead, railX, phaseS, visible = true) {
      if (!playhead) return;
      const clampedX = Math.max(0, Math.min(editorState.railWidth, railX));
      const label = fmt(Math.max(0, Number(phaseS) || 0));
      playhead.style.left = `${clampedX}px`;
      playhead.style.display = visible ? "block" : "none";
      playhead.title = `目前時間 ${label} · 拖曳可調整`;
      playhead.setAttribute("aria-label", `拖曳目前時間 ${label}`);
      const timeLabel = playhead.querySelector(".railPlayheadTime");
      if (timeLabel) timeLabel.textContent = label;

      const viewportStart = els.editorRailViewport.scrollLeft;
      const viewportEnd = viewportStart + els.editorRailViewport.clientWidth;
      const nearStart = clampedX - viewportStart < 72;
      const nearEnd = viewportEnd - clampedX < 72;
      playhead.classList.toggle("tooltipStart", nearStart && !nearEnd);
      playhead.classList.toggle("tooltipEnd", nearEnd && !nearStart);
    }

    function seekEditorRailAt(clientX, seekVideo = true) {
      const rect = els.editorRail.getBoundingClientRect();
      const railX = Math.max(0, Math.min(editorState.railWidth, clientX - rect.left));
      const phaseS = railX / EDITOR_RAIL_PX_PER_SECOND;
      const targetS = editorHudTime() + phaseS;
      if (seekVideo) seekEditorVideo(targetS);
      const playhead = document.getElementById("editorRailPlayhead");
      updateEditorRailPlayhead(playhead, railX, phaseS);
      els.editorVideoTime.textContent = fmt(targetS);
      updateEditorPlaybackHighlight(targetS);
    }

    function beginEditorRailSeek(event) {
      const playhead = event.target.closest(".railPlayhead");
      if (event.button !== 0 || !playhead) return;
      editorState.railSeekDrag = {
        playhead,
        pointerId: event.pointerId,
        startClientX: event.clientX,
        lastClientX: event.clientX,
        lastSeekAt: 0,
        moved: false,
        resumeAfter: !editorPaused(),
      };
      playhead.setPointerCapture?.(event.pointerId);
      event.preventDefault();
    }

    function moveEditorRailSeek(event) {
      const drag = editorState.railSeekDrag;
      if (!drag || drag.pointerId !== event.pointerId) return;
      drag.lastClientX = event.clientX;
      if (!drag.moved && Math.abs(event.clientX - drag.startClientX) < 3) return;
      if (!drag.moved && drag.resumeAfter) editorPause();
      drag.moved = true;
      els.editorRailViewport.classList.add("seeking");
      const now = performance.now();
      const seekVideo = now - drag.lastSeekAt >= 100;
      seekEditorRailAt(event.clientX, seekVideo);
      if (seekVideo) drag.lastSeekAt = now;
      event.preventDefault();
    }

    function endEditorRailSeek(event) {
      const drag = editorState.railSeekDrag;
      if (!drag || drag.pointerId !== event.pointerId) return;
      editorState.railSeekDrag = null;
      drag.playhead.releasePointerCapture?.(event.pointerId);
      els.editorRailViewport.classList.remove("seeking");
      if (!drag.moved) return;
      seekEditorRailAt(drag.lastClientX);
      if (drag.resumeAfter) editorPlay().catch(() => {});
      editorState.suppressRailClick = true;
      window.setTimeout(() => { editorState.suppressRailClick = false; }, 0);
      event.preventDefault();
    }

    function renderEditor() {
      els.editorP1VariantRow.hidden = !activeBossProfile().p1Variant || editorState.phase !== "P1";
      els.editorP1ShiaInput.checked = editorState.p1HasShia;
      for (const button of document.querySelectorAll("[data-editor-phase]")) {
        const phase = button.dataset.editorPhase;
        const anchor = editorState.hudTimes[phase];
        const phaseLabel = phaseDisplayLabel(phase, editorTimelineVariant(phase));
        button.classList.toggle("active", phase === editorState.phase);
        button.textContent = Number.isFinite(anchor) ? `${phaseLabel} ${fmt(anchor)}` : `${phaseLabel} --:--`;
        button.title = Number.isFinite(anchor)
          ? `${phaseLabel} 起算 ${fmt(anchor)} · ${editorState.phaseMethods[phase] || "手動"}`
          : `${phaseLabel} 尚未偵測`;
      }
      const selectedHud = editorState.hudTimes[editorState.phase];
      els.editorHudInput.value = Number.isFinite(selectedHud) ? selectedHud.toFixed(3) : "";
      renderEditorSelected();
      renderEditorRail();
      renderEditorTable();
      renderEditorSkillLibrary();
      updateEditorSaveStatus();
    }

    function scrollEditorCueIntoView(key, includeTable = true) {
      requestAnimationFrame(() => {
        const selector = `[data-editor-key="${CSS.escape(key)}"]`;
        const marker = els.editorRail.querySelector(selector);
        marker?.scrollIntoView({ block: "nearest", inline: "center" });
        if (includeTable) {
          const row = els.editorTable.querySelector(selector);
          row?.scrollIntoView({ block: "nearest", inline: "nearest" });
        }
      });
    }

    function playEditorCueFromPrompt(cue) {
      const targetS = editorAbsolutePromptS(cue);
      if (!Number.isFinite(targetS)) {
        setEditorStatus(`${phaseDisplayLabel(cue.phase)} 尚未校正起算時間`, "dirty");
        return;
      }
      const key = editorCueKey(cue);
      primeAudioFromGesture();
      editorPause();
      seekEditorVideo(targetS);
      editorState.voiceArmedKey = key;
      editorState.voiceArmedAtS = targetS;
      editorState.voicePlayedKeys.delete(key);
      editorState.playbackCueKey = key;
      editorState.playbackPhase = cue.phase;
      editorPlay().catch((error) => setEditorStatus(`無法播放：${error.message}`, "dirty"));
    }

    function selectEditorCue(key, seek = true, additive = false) {
      const cue = editorCueByKey(key);
      if (!cue) return;
      editorState.phase = cue.phase;
      if (additive) {
        toggleEditorCueSelection(key);
        seek = false;
      } else {
        replaceEditorSelection(key);
      }
      if (seek) {
        editorState.playbackCueKey = key;
        editorState.playbackPhase = cue.phase;
      }
      renderEditor();
      if (seek) playEditorCueFromPrompt(cue);
      if (editorState.selectedKeys.has(key)) scrollEditorCueIntoView(key);
    }

    function selectEditorPhase(phase) {
      if (!PHASE_ORDER.includes(phase)) return;
      const anchorS = Number(editorState.hudTimes[phase]);
      editorPause();
      editorState.phase = phase;
      const current = editorCueByKey(editorState.selectedKey);
      if (!current
          || current.phase !== phase
          || cueTimelineVariant(current) !== editorTimelineVariant(phase)) {
        const first = editorPhaseCues()[0];
        replaceEditorSelection(first ? editorCueKey(first) : "");
      }
      editorState.playbackCueKey = "";
      editorState.playbackPhase = phase;
      resetEditorVoicePlayback({ stopAudio: true, clearPlayed: true });
      if (Number.isFinite(anchorS)) {
        seekEditorVideo(anchorS);
        els.editorPhaseStatus.textContent = `${phaseDisplayLabel(phase)} 已跳到起算點 ${fmt(anchorS)}`;
      } else {
        els.editorPhaseStatus.textContent = `${phaseDisplayLabel(phase)} 尚未校正起算時間`;
      }
      renderEditor();
      if (editorState.selectedKey) scrollEditorCueIntoView(editorState.selectedKey);
    }

    function updateSelectedEditorCue({ text, startS, leadS, enabled } = {}) {
      const cue = editorCueByKey(editorState.selectedKey);
      if (!cue) return;
      const oldStart = Number(cue.start_s || 0);
      if (typeof text === "string") {
        const value = text.slice(0, 60);
        if (value.trim()) {
          cue.text = value;
          applyCueVoice(cue);
        }
      }
      if (Number.isFinite(startS)) {
        const duration = Math.max(0, Number(cue.end_s || oldStart) - oldStart);
        cue.start_s = Math.max(0, startS);
        cue.end_s = Number(cue.start_s) + duration;
      }
      if (Number.isFinite(leadS)) cue.lead_s = leadS;
      if (typeof enabled === "boolean") cue.enabled = enabled;
      markEditorDirty(cue);
      renderEditorSelected();
      renderEditorRail();
      renderEditorTable();
      renderEditorSkillLibrary();
    }

    function nextCustomCueIndex(phase) {
      return nextAvailableCustomCueIndex(phase, editorTimelineVariant(phase), editorState.cues);
    }

    function addEditorCue(text) {
      const normalized = String(text || "").trim();
      if (!normalized) {
        setEditorStatus("請輸入招式名稱", "dirty");
        return;
      }
      const hudS = Number(editorState.hudTimes[editorState.phase]);
      if (!Number.isFinite(hudS)) {
        setEditorStatus(`請先設定 ${phaseDisplayLabel(editorState.phase)} 起算時間`, "dirty");
        return;
      }
      const startS = editorCurrentTime() - hudS;
      if (startS < 0) {
        setEditorStatus("影片時間早於本階段 HUD", "dirty");
        return;
      }
      const cue = {
        boss_id: editorState.bossId,
        phase: editorState.phase,
        timeline_variant: editorTimelineVariant(),
        cue_index: nextCustomCueIndex(editorState.phase),
        text: normalized,
        start_s: startS,
        end_s: startS,
        lead_s: 2,
        offset_s: 0,
        scheduled_s: Math.max(0, startS - 2),
        enabled: true,
        deleted: false,
        custom: true,
        clip_url: "",
        clip_path: "",
        duration_s: Math.max(0.8, normalized.length * 0.22),
      };
      applyCueVoice(cue);
      editorState.cues.push(cue);
      editorState.customSkillTexts.add(normalized);
      saveCustomSkillLibrary();
      replaceEditorSelection(editorCueKey(cue));
      markEditorDirty(cue);
      els.editorNewSkillInput.value = "";
      renderEditor();
    }

    function deleteSelectedEditorCue() {
      const cue = editorCueByKey(editorState.selectedKey);
      if (!cue) return;
      cue.deleted = true;
      cue.enabled = false;
      markEditorDirty(cue);
      editorState.selectedKeys.delete(editorCueKey(cue));
      normalizeEditorSelection();
      if (!editorState.selectedKey) {
        const next = editorPhaseCues()[0];
        replaceEditorSelection(next ? editorCueKey(next) : "");
      }
      resetEditorVoicePlayback({ stopAudio: true, clearPlayed: true });
      renderEditor();
    }

    function setSelectedCueFromVideo() {
      const relative = editorCurrentTime() - editorHudTime();
      if (relative < 0) {
        setEditorStatus("影片時間早於本階段 HUD", "dirty");
        return;
      }
      updateSelectedEditorCue({ startS: relative });
    }

    function nudgeSelectedEditorCue(deltaS) {
      const cues = selectedEditorCues();
      const cue = editorCueByKey(editorState.selectedKey) || cues[0];
      if (!cue || !cues.length) return;
      const appliedDeltaS = shiftEditorCueGroup(cues, Number(deltaS || 0));
      renderEditorSelected();
      renderEditorRail();
      renderEditorTable();
      setEditorStatus(
        cues.length > 1
          ? `${cues.length} 招一起調整 ${appliedDeltaS >= 0 ? "+" : ""}${appliedDeltaS.toFixed(1)} 秒`
          : `${cue.phase}#${cue.cue_index} 調整到 ${fmt(Number(cue.start_s || 0))}`,
        "dirty",
      );
      seekEditorVideo(editorHudTime() + Number(cue.start_s || 0));
    }

    function jumpToSelectedEditorCue() {
      const cue = editorCueByKey(editorState.selectedKey);
      if (!cue) return;
      playEditorCueFromPrompt(cue);
    }

    async function previewSelectedEditorCue() {
      const cue = editorCueByKey(editorState.selectedKey);
      if (!cue) return;
      stopAllAudio();
      const played = await playCueAudio(cue, { ignoreMuted: true });
      if (played) log(`試聽 ${cue.phase}#${cue.cue_index} ${cue.text}`, "ok");
    }

    function resetEditorVoicePlayback({ stopAudio = false, includeCurrent = false, clearPlayed = false } = {}) {
      editorState.voiceGeneration += 1;
      editorState.voiceLastVideoS = editorCurrentTime() - (includeCurrent ? 0.06 : 0);
      if (clearPlayed) editorState.voicePlayedKeys.clear();
      if (stopAudio) stopAllAudio();
    }

    function handleEditorVoicePlay() {
      editorState.voiceSeeking = false;
      resetEditorVoicePlayback({ includeCurrent: true });
      if (editorState.voiceEnabled) startAudioLoading();
    }

    function handleEditorVoicePause() {
      resetEditorVoicePlayback({ stopAudio: true });
    }

    function handleEditorVoiceSeeking() {
      editorState.voiceSeeking = true;
      resetEditorVoicePlayback({ stopAudio: true, clearPlayed: true });
    }

    function handleEditorVoiceSeeked() {
      editorState.voiceSeeking = false;
      resetEditorVoicePlayback();
    }

    function handleEditorVoiceEnded() {
      resetEditorVoicePlayback({ stopAudio: true, clearPlayed: true });
    }

    function editorAbsolutePromptS(cue) {
      const hudS = Number(editorState.hudTimes[cue.phase]);
      return Number.isFinite(hudS) ? hudS + editorScheduledS(cue) : Number.NaN;
    }

    function editorCueIsInsidePhaseWindow(cue, absoluteS) {
      const phaseIndex = PHASE_ORDER.indexOf(cue.phase);
      const phaseStartS = Number(editorState.hudTimes[cue.phase]);
      if (phaseIndex < 0 || !Number.isFinite(phaseStartS) || absoluteS < phaseStartS - 0.001) return false;
      for (let index = phaseIndex + 1; index < PHASE_ORDER.length; index += 1) {
        const nextPhaseStartS = Number(editorState.hudTimes[PHASE_ORDER[index]]);
        if (Number.isFinite(nextPhaseStartS)) return absoluteS < nextPhaseStartS - 0.001;
      }
      return true;
    }

    async function playEditorVoiceCue(cue, absoluteS, videoS, generation) {
      const played = await playCueAudio(cue, {
        ignoreMuted: true,
        shouldStart: () => generation === editorState.voiceGeneration
          && editorState.voiceEnabled
          && !editorState.voiceSeeking
          && !editorPaused()
          && document.body.classList.contains("editor-mode"),
      });
      if (played) {
        log(`編輯預覽 ${cue.phase}#${cue.cue_index} ${cue.text} late=${(videoS - absoluteS).toFixed(3)}s`, "ok");
      }
    }

    function updateEditorVoicePlayback() {
      const currentS = editorCurrentTime();
      if (!document.body.classList.contains("editor-mode")
          || !editorState.voiceEnabled
          || editorState.voiceSeeking
          || editorState.detecting
          || editorPaused()) {
        editorState.voiceLastVideoS = currentS;
        return;
      }
      const previousS = Number(editorState.voiceLastVideoS);
      editorState.voiceLastVideoS = currentS;
      const armedKey = editorState.voiceArmedKey;
      const armedAtS = Number(editorState.voiceArmedAtS);
      if (armedKey && Number.isFinite(armedAtS) && currentS >= armedAtS - 0.08 && currentS - armedAtS <= 1.25) {
        const armedCue = editorCueByKey(armedKey);
        editorState.voiceArmedKey = "";
        editorState.voiceArmedAtS = Number.NaN;
        if (armedCue) {
          editorState.voicePlayedKeys.add(armedKey);
          playEditorVoiceCue(armedCue, armedAtS, currentS, editorState.voiceGeneration);
        }
      } else if (armedKey && Number.isFinite(armedAtS) && currentS - armedAtS > 1.25) {
        editorState.voiceArmedKey = "";
        editorState.voiceArmedAtS = Number.NaN;
      }
      if (!Number.isFinite(previousS)) return;
      const advancedS = currentS - previousS;
      if (advancedS <= 0 || advancedS > 1.25) return;

      const generation = editorState.voiceGeneration;
      const due = editorState.cues
        .filter((cue) => cue.enabled
          && !cue.deleted
          && cueMatchesEditorVariant(cue)
          && !editorState.voicePlayedKeys.has(editorCueKey(cue)))
        .map((cue) => ({ cue, absoluteS: editorAbsolutePromptS(cue) }))
        .filter(({ absoluteS }) => Number.isFinite(absoluteS)
          && absoluteS >= previousS - 0.001
          && absoluteS <= currentS + 0.025
          && currentS - absoluteS <= 0.6)
        .filter(({ cue, absoluteS }) => editorCueIsInsidePhaseWindow(cue, absoluteS))
        .sort((a, b) => a.absoluteS - b.absoluteS || Number(a.cue.cue_index || 0) - Number(b.cue.cue_index || 0));
      for (const item of due) {
        const key = editorCueKey(item.cue);
        editorState.voicePlayedKeys.add(key);
        if (editorState.voiceArmedKey === key) {
          editorState.voiceArmedKey = "";
          editorState.voiceArmedAtS = Number.NaN;
        }
        playEditorVoiceCue(item.cue, item.absoluteS, currentS, generation);
      }
    }

    function editorPlaybackPosition(currentS) {
      const phases = PHASE_ORDER
        .map((phase) => ({ phase, hudS: Number(editorState.hudTimes[phase]) }))
        .filter((item) => Number.isFinite(item.hudS))
        .sort((a, b) => a.hudS - b.hudS);
      let currentPhase = "";
      for (const item of phases) {
        if (item.hudS <= currentS + 0.04) currentPhase = item.phase;
        else break;
      }
      if (!currentPhase) return { phase: "", key: "" };

      let currentKey = "";
      const cues = editorState.cues
        .filter((cue) => cue.phase === currentPhase
          && cue.enabled
          && !cue.deleted
          && cueMatchesEditorVariant(cue))
        .map((cue) => ({ cue, absoluteS: editorAbsolutePromptS(cue) }))
        .filter((item) => Number.isFinite(item.absoluteS))
        .sort((a, b) => a.absoluteS - b.absoluteS || Number(a.cue.cue_index || 0) - Number(b.cue.cue_index || 0));
      for (const item of cues) {
        if (item.absoluteS <= currentS + 0.04) currentKey = editorCueKey(item.cue);
        else break;
      }
      return { phase: currentPhase, key: currentKey };
    }

    function updateEditorPlaybackHighlight(currentS) {
      if (!document.body.classList.contains("editor-mode") || editorState.detecting) return;
      const position = editorPlaybackPosition(currentS);
      const followPhase = !editorPaused() && position.phase && position.phase !== editorState.phase;
      const changed = position.key !== editorState.playbackCueKey
        || position.phase !== editorState.playbackPhase;
      if (!changed && !followPhase) return;

      editorState.playbackCueKey = position.key;
      editorState.playbackPhase = position.phase;
      if (followPhase) {
        editorState.phase = position.phase;
        if (position.key) replaceEditorSelection(position.key);
        else {
          const first = editorPhaseCues()[0];
          replaceEditorSelection(first ? editorCueKey(first) : "");
        }
        renderEditor();
      } else {
        for (const element of [...els.editorTable.querySelectorAll("[data-editor-key]"), ...els.editorRail.querySelectorAll("[data-editor-key]")]) {
          const playing = Boolean(position.key) && element.dataset.editorKey === position.key;
          element.classList.toggle("playing", playing);
          if (element.classList.contains("editorCueRow")) element.setAttribute("aria-current", String(playing));
        }
      }
      if (position.key && position.phase === editorState.phase && !editorPaused()) {
        scrollEditorCueIntoView(position.key);
      }
    }

    function updateEditorPlayback() {
      if (editorState.railSeekDrag?.moved) {
        els.editorPlayBtn.textContent = editorPaused() ? "播放" : "暫停";
        return;
      }
      const currentS = editorCurrentTime();
      els.editorVideoTime.textContent = fmt(currentS);
      els.editorPlayBtn.textContent = editorPaused() ? "播放" : "暫停";
      updateEditorVoicePlayback();
      updateEditorPlaybackHighlight(currentS);
      const playhead = document.getElementById("editorRailPlayhead");
      if (!playhead) return;
      const relative = currentS - editorHudTime();
      updateEditorRailPlayhead(
        playhead,
        relative * EDITOR_RAIL_PX_PER_SECOND,
        relative,
        relative >= 0,
      );
    }

    async function refreshTimelineFromServer(preserveAlignment = true) {
      let data;
      if (STATIC_DEPLOYMENT) {
        data = state.assets;
      } else {
        const response = await fetch("/web-live-assets.json", { cache: "no-store" });
        data = await response.json();
        if (!response.ok || data.ok === false) throw new Error(data.error || response.statusText);
        expandTimelineVariants(data);
      }
      state.assets = data;
      rebuildTimelineByPhase();
      initializeEditorData(data, preserveAlignment);
      els.topStatus.textContent = `${activeBossProfile().name} · 模板 ${data.template_count}，語音 ${selectedTimelineCueCount()} 句`;
    }

    async function saveEditorChanges() {
      if (!editorState.dirtyKeys.size) return;
      for (const cue of editorState.cues) cue.text = String(cue.text || "").trim();
      const changes = [...editorState.dirtyKeys].map((key) => {
        const cue = editorCueByKey(key);
        return {
          boss_id: cueBossId(cue),
          phase: cue.phase,
          timeline_variant: cueTimelineVariant(cue),
          cue_index: cue.cue_index,
          text: cue.text,
          start_s: Number(cue.start_s || 0),
          lead_s: Number(cue.lead_s || 0),
          enabled: Boolean(cue.enabled),
          deleted: Boolean(cue.deleted),
          custom: Boolean(cue.custom),
        };
      });
      els.editorSaveBtn.disabled = true;
      setEditorStatus("儲存中", "dirty");
      try {
        if (STATIC_DEPLOYMENT) {
          let stored = {};
          try {
            stored = JSON.parse(localStorage.getItem(STATIC_TIMELINE_KEY) || "{}") || {};
          } catch (_) {}
          for (const change of changes) {
            if (!change.custom) {
              stored[`${change.phase}:${change.timeline_variant}:${change.cue_index}`] = change;
            }
          }
          localStorage.setItem(STATIC_TIMELINE_KEY, JSON.stringify(stored));
          const customCues = editorState.cues
            .filter((cue) => cue.custom && !cue.deleted)
            .map((cue) => ({ ...cue, scheduled_s: editorScheduledS(cue) }));
          for (const cue of editorState.cues.filter((item) => !item.deleted)) {
            if (cue.custom || !voiceCueForText(cue.text)) editorState.customSkillTexts.add(String(cue.text || "").trim());
          }
          saveCustomSkillLibrary();
          localStorage.setItem(CUSTOM_CUES_KEY, JSON.stringify(customCues));
          state.assets.timeline = editorState.cues
            .filter((cue) => !cue.custom || !cue.deleted)
            .map((cue) => ({ ...cue, scheduled_s: editorScheduledS(cue) }));
          state.assets.timeline_enabled_count = state.assets.timeline.filter((cue) => cue.enabled && !cue.deleted).length;
          await refreshTimelineFromServer(true);
          setEditorStatus(`已儲存在此瀏覽器 ${changes.length} 則`, "saved");
          log(`時間軸已儲存在此瀏覽器 ${changes.length} 則`, "ok");
          return;
        }
        const response = await fetch("/api/save-web-timeline", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ changes }),
        });
        const result = await response.json();
        if (!response.ok || result.ok === false) throw new Error(result.error || response.statusText);
        await refreshTimelineFromServer(true);
        setEditorStatus(`已儲存 ${result.changed} 則`, "saved");
        log(`時間軸已儲存 ${result.changed} 則，備份 ${result.backup_dir}`, "ok");
      } catch (error) {
        setEditorStatus(`儲存失敗：${error.message}`, "dirty");
        els.editorSaveBtn.disabled = false;
      }
    }

    function collectFeedbackChanges() {
      const baseByKey = new Map(state.baseTimeline
        .filter((cue) => cueBossId(cue) === editorState.bossId)
        .map((cue) => [editorCueKey(cue), cue]));
      const currentByKey = new Map(editorState.cues
        .filter((cue) => cueBossId(cue) === editorState.bossId)
        .map((cue) => [editorCueKey(cue), cue]));
      const changes = [];
      for (const [key, base] of baseByKey) {
        const cue = currentByKey.get(key) || base;
        const startS = Number(cue.start_s ?? base.start_s ?? 0);
        const leadS = Number(cue.lead_s ?? base.lead_s ?? 0);
        const enabled = Boolean(cue.enabled) && !cue.deleted;
        const text = String(cue.text ?? base.text ?? "");
        const originalStartS = Number(base.start_s || 0);
        const originalLeadS = Number(base.lead_s || 0);
        const originalEnabled = Boolean(base.enabled);
        const changed = Math.abs(startS - originalStartS) > 0.0005
          || Math.abs(leadS - originalLeadS) > 0.0005
          || enabled !== originalEnabled
          || text !== String(base.text || "")
          || Boolean(cue.deleted);
        if (!changed) continue;
        changes.push({
          operation: cue.deleted ? "delete" : "update",
          boss_id: editorState.bossId,
          phase: base.phase,
          timeline_variant: cueTimelineVariant(base),
          cue_index: Number(base.cue_index),
          original_text: String(base.text || ""),
          text,
          original_start_s: originalStartS,
          start_s: startS,
          original_lead_s: originalLeadS,
          lead_s: leadS,
          original_enabled: originalEnabled,
          enabled,
        });
      }
      for (const cue of editorState.cues.filter((item) =>
        cueBossId(item) === editorState.bossId && item.custom && !item.deleted)) {
        changes.push({
          operation: "add",
          boss_id: editorState.bossId,
          phase: cue.phase,
          timeline_variant: cueTimelineVariant(cue),
          cue_index: Number(cue.cue_index),
          original_text: "",
          text: String(cue.text || ""),
          original_start_s: 0,
          start_s: Number(cue.start_s || 0),
          original_lead_s: 0,
          lead_s: Number(cue.lead_s || 0),
          original_enabled: false,
          enabled: Boolean(cue.enabled),
        });
      }
      return changes.sort((a, b) => PHASE_ORDER.indexOf(a.phase) - PHASE_ORDER.indexOf(b.phase)
        || String(a.timeline_variant).localeCompare(String(b.timeline_variant))
        || a.cue_index - b.cue_index);
    }

    function updateFeedbackButton() {
      if (!els.editorSubmitBtn) return;
      const count = collectFeedbackChanges().length;
      els.editorSubmitBtn.disabled = count === 0 || editorState.feedbackSubmitting;
      els.editorSubmitBtn.textContent = count ? `回傳建議 ${count}` : "回傳建議";
    }

    async function openFeedbackDialog() {
      if (editorState.dirtyKeys.size) await saveEditorChanges();
      const changes = collectFeedbackChanges();
      if (!changes.length) {
        setEditorStatus("目前沒有可回傳的調整", "dirty");
        return;
      }
      els.feedbackReporter.value = localStorage.getItem(FEEDBACK_REPORTER_KEY) || "";
      els.feedbackNote.value = "";
      const p1Variants = [...new Set(changes
        .filter((change) => change.phase === "P1")
        .map((change) => timelineVariantLabel(change.timeline_variant)))];
      const variantSummary = p1Variants.length ? ` · P1 ${p1Variants.join("、")}` : "";
      els.feedbackSummary.textContent = `${activeBossProfile().name} · ${changes.length} 則招式調整${variantSummary}`;
      els.feedbackStatus.textContent = "";
      els.feedbackDialog.showModal();
    }

    async function submitFeedback(event) {
      event.preventDefault();
      const changes = collectFeedbackChanges();
      if (!changes.length || editorState.feedbackSubmitting) return;
      editorState.feedbackSubmitting = true;
      updateFeedbackButton();
      els.feedbackSendBtn.disabled = true;
      els.feedbackStatus.textContent = "正在回傳";
      const reporterName = String(els.feedbackReporter.value || "").trim();
      const phaseAnchors = Object.fromEntries(PHASE_ORDER
        .filter((phase) => Number.isFinite(Number(editorState.hudTimes[phase])))
        .map((phase) => [phase, Number(editorState.hudTimes[phase])]));
      try {
        const response = await fetch(FEEDBACK_API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            boss_id: editorState.bossId,
            reporter_name: reporterName,
            note: String(els.feedbackNote.value || "").trim(),
            video_name: editorState.sourceName,
            video_duration_s: editorDuration(),
            p1_variant: editorState.bossId === "black_mage"
              ? editorTimelineVariant("P1")
              : P1_VARIANT_SHIA,
            phase_anchors: phaseAnchors,
            changes,
          }),
        });
        const result = await response.json();
        if (!response.ok || result.ok === false) throw new Error(result.error || response.statusText);
        localStorage.setItem(FEEDBACK_REPORTER_KEY, reporterName);
        els.feedbackDialog.close();
        setEditorStatus(`已回傳建議 #${result.id}，共 ${result.changed} 則`, "saved");
        log(`時間軸建議已回傳 #${result.id}`, "ok");
      } catch (error) {
        els.feedbackStatus.textContent = `回傳失敗：${error.message}`;
      } finally {
        editorState.feedbackSubmitting = false;
        els.feedbackSendBtn.disabled = false;
        updateFeedbackButton();
      }
    }

    function syncActiveP1Timeline() {
      if (state.activePhase !== "P1") return;
      const elapsed = Math.max(0, (performance.now() - state.phaseStartMs) / 1000);
      for (const key of [...state.playedKeys]) {
        if (key.startsWith("P1:")) state.playedKeys.delete(key);
      }
      state.activeCues = [...(state.timelineByPhase.P1 || [])]
        .sort((a, b) => effectiveScheduledS(a) - effectiveScheduledS(b) || Number(a.cue_index || 0) - Number(b.cue_index || 0));
      state.cueIndex = 0;
      while (state.cueIndex < state.activeCues.length
          && effectiveScheduledS(state.activeCues[state.cueIndex]) <= elapsed + 0.03) {
        state.playedKeys.add(cueKey(state.activeCues[state.cueIndex]));
        state.cueIndex += 1;
      }
      state.currentCue = null;
      state.currentCueUntilMs = 0;
      const label = phaseDisplayLabel("P1");
      setText("phase", label, "ok");
      setText("status", `${label} 計時中`, "ok");
      updateNextCallout(performance.now());
      renderTimeline();
    }

    function setP1Variant(hasShia) {
      const nextValue = Boolean(hasShia);
      const changed = state.p1HasShia !== nextValue || editorState.p1HasShia !== nextValue;
      const previousCue = editorCueByKey(editorState.selectedKey);
      state.p1HasShia = nextValue;
      editorState.p1HasShia = nextValue;
      els.p1ShiaInput.checked = nextValue;
      els.editorP1ShiaInput.checked = nextValue;
      localStorage.setItem(P1_VARIANT_KEY, String(nextValue));
      rebuildTimelineByPhase();
      if (changed) {
        syncActiveP1Timeline();
        if (!state.activePhase && expectedPhase() === "P1") {
          setText("status", `等待 ${phaseDisplayLabel("P1")} 過場`, "ok");
        }
        if (editorState.phase === "P1") {
          const desiredKey = previousCue?.phase === "P1"
            ? `P1:${editorTimelineVariant("P1")}:${previousCue.cue_index}`
            : "";
          const desiredCue = desiredKey ? editorCueByKey(desiredKey) : null;
          const firstCue = editorPhaseCues()[0];
          replaceEditorSelection(desiredCue ? desiredKey : firstCue ? editorCueKey(firstCue) : "");
          editorState.playbackCueKey = "";
          editorState.playbackPhase = "P1";
          resetEditorVoicePlayback({ stopAudio: true, clearPlayed: true });
        }
      }
      renderPhaseCards();
      renderTimeline();
      renderEditor();
      updatePrompter(performance.now());
    }

    function applySettings() {
      const wasMuted = state.audioMuted;
      state.extraLeadS = Number(els.leadInput.value || 0);
      state.threshold = Number(els.thresholdInput.value || 0.84);
      state.volume = Number(els.volumeInput.value || 100) / 100;
      state.audioMuted = Boolean(els.muteInput.checked);
      if (state.audioMuted && !wasMuted) stopAllAudio();
      if (state.audioGain) state.audioGain.gain.value = state.audioMuted ? 0 : state.volume;
      els.volumeText.textContent = `${Math.round(state.volume * 100)}%`;
      localStorage.setItem("blackMageWeb2ExtraLeadS", state.extraLeadS.toFixed(1));
      localStorage.setItem("blackMageWeb2Threshold", state.threshold.toFixed(2));
      localStorage.setItem("blackMageWeb2Volume", state.volume.toFixed(2));
      localStorage.setItem("blackMageWeb2Muted", String(state.audioMuted));
      rebuildTimelineByPhase();
      if (state.activePhase) {
        state.activeCues = [...(state.timelineByPhase[state.activePhase] || [])]
          .sort((a, b) => effectiveScheduledS(a) - effectiveScheduledS(b) || Number(a.cue_index || 0) - Number(b.cue_index || 0));
      }
      renderTimeline();
      updateAudioStatus();
    }

    function bindEvents() {
      document.addEventListener("pointerdown", primeAudioFromGesture, { capture: true });
      document.addEventListener("keydown", primeAudioFromGesture, { capture: true });
      els.bossMenuBtn.addEventListener("click", () => setBossSidebarOpen(true));
      els.bossMenuCloseBtn.addEventListener("click", () => setBossSidebarOpen(false));
      els.bossBackdrop.addEventListener("click", () => setBossSidebarOpen(false));
      els.bossChoices.addEventListener("click", (event) => {
        const button = event.target.closest("[data-boss-id]");
        if (!button) return;
        selectBoss(button.dataset.bossId).catch((error) => {
          setEditorStatus(`切換失敗：${error.message}`, "dirty");
        });
      });
      els.liveModeBtn.addEventListener("click", () => setAppMode("live"));
      els.editorModeBtn.addEventListener("click", () => setAppMode("editor"));
      els.prompterFocusBtn.addEventListener("click", togglePrompterFocus);
      els.shareBtn.addEventListener("click", startShare);
      els.baselineBtn.addEventListener("click", startBaseline);
      els.selfTestBtn.addEventListener("click", runSelfTest);
      els.testVoiceBtn.addEventListener("click", () => testVoice().catch((error) => log(`測試語音失敗：${error.message}`, "badText")));
      els.resetBtn.addEventListener("click", resetRun);
      els.stopBtn.addEventListener("click", stopSource);
      els.leadInput.addEventListener("change", applySettings);
      els.thresholdInput.addEventListener("change", applySettings);
      els.volumeInput.addEventListener("input", applySettings);
      els.muteInput.addEventListener("change", applySettings);
      els.p1ShiaInput.addEventListener("change", () => setP1Variant(els.p1ShiaInput.checked));
      els.editorP1ShiaInput.addEventListener("change", () => setP1Variant(els.editorP1ShiaInput.checked));
      els.editorBaselineBtn.addEventListener("click", loadEditorBaseline);
      els.editorYoutubeBtn.addEventListener("click", () => {
        loadEditorYoutubeFromUserAction(els.editorYoutubeInput.value).catch((error) => {
          els.editorPhaseStatus.textContent = `YouTube 載入失敗：${error.message}`;
        });
      });
      els.editorYoutubeInput.addEventListener("paste", (event) => {
        const pasted = String(event.clipboardData?.getData("text/plain") || "").trim();
        if (!parseYoutubeVideoId(pasted)) return;
        event.preventDefault();
        els.editorYoutubeInput.value = pasted;
        loadEditorYoutubeFromUserAction(pasted).catch((error) => {
          els.editorPhaseStatus.textContent = `YouTube 載入失敗：${error.message}`;
        });
      });
      els.editorYoutubeInput.addEventListener("change", () => {
        loadEditorYoutubeFromUserAction(els.editorYoutubeInput.value).catch((error) => {
          els.editorPhaseStatus.textContent = `YouTube 載入失敗：${error.message}`;
        });
      });
      els.editorYoutubeInput.addEventListener("keydown", (event) => {
        if (event.key !== "Enter") return;
        event.preventDefault();
        loadEditorYoutubeFromUserAction(els.editorYoutubeInput.value).catch((error) => {
          els.editorPhaseStatus.textContent = `YouTube 載入失敗：${error.message}`;
        });
      });
      els.editorDetectPhasesBtn.addEventListener("click", () => autoDetectEditorPhases());
      els.editorVideo.addEventListener("loadeddata", handleEditorVideoLoaded);
      els.editorVideo.addEventListener("play", handleEditorVoicePlay);
      els.editorVideo.addEventListener("pause", handleEditorVoicePause);
      els.editorVideo.addEventListener("seeking", handleEditorVoiceSeeking);
      els.editorVideo.addEventListener("seeked", handleEditorVoiceSeeked);
      els.editorVideo.addEventListener("ended", handleEditorVoiceEnded);
      els.editorPlayBtn.addEventListener("click", () => {
        if (editorPaused()) editorPlay().catch((error) => setEditorStatus(error.message, "dirty"));
        else editorPause();
      });
      els.editorVoiceInput.addEventListener("change", () => {
        editorState.voiceEnabled = els.editorVoiceInput.checked;
        localStorage.setItem("blackMageEditorVoiceEnabled", String(editorState.voiceEnabled));
        resetEditorVoicePlayback({ stopAudio: !editorState.voiceEnabled, includeCurrent: editorState.voiceEnabled });
        if (editorState.voiceEnabled && !editorPaused()) startAudioLoading();
      });
      for (const button of document.querySelectorAll("[data-editor-seek]")) {
        button.addEventListener("click", () => editorSeekBy(Number(button.dataset.editorSeek || 0)));
      }
      els.editorPhaseTabs.addEventListener("click", (event) => {
        const button = event.target.closest("[data-editor-phase]");
        if (button) selectEditorPhase(button.dataset.editorPhase);
      });
      els.editorSetHudBtn.addEventListener("click", () => {
        editorState.hudTimes[editorState.phase] = editorCurrentTime();
        editorState.phaseMethods[editorState.phase] = "manual";
        els.editorPhaseStatus.textContent = `${phaseDisplayLabel(editorState.phase)} 已手動修正`;
        resetEditorVoicePlayback({ stopAudio: true, clearPlayed: true });
        renderEditor();
      });
      els.editorJumpHudBtn.addEventListener("click", () => seekEditorVideo(editorHudTime()));
      els.editorHudInput.addEventListener("change", () => {
        const value = Number(els.editorHudInput.value || 0);
        if (Number.isFinite(value) && value >= 0) {
          editorState.hudTimes[editorState.phase] = value;
          editorState.phaseMethods[editorState.phase] = "manual";
          els.editorPhaseStatus.textContent = `${phaseDisplayLabel(editorState.phase)} 已手動修正`;
          resetEditorVoicePlayback({ stopAudio: true, clearPlayed: true });
        }
        renderEditor();
      });
      els.editorTable.addEventListener("click", (event) => {
        const row = event.target.closest("[data-editor-key]");
        if (row) {
          const additive = multiSelectModifier(event);
          selectEditorCue(row.dataset.editorKey, !additive, additive);
        }
      });
      els.editorRail.addEventListener("pointerdown", beginEditorRailDrag);
      els.editorRail.addEventListener("pointerdown", beginEditorRailSeek);
      window.addEventListener("pointermove", moveEditorRailDrag);
      window.addEventListener("pointermove", moveEditorRailSeek);
      window.addEventListener("pointerup", endEditorRailDrag);
      window.addEventListener("pointerup", endEditorRailSeek);
      window.addEventListener("pointercancel", endEditorRailDrag);
      window.addEventListener("pointercancel", endEditorRailSeek);
      els.editorRail.addEventListener("click", (event) => {
        if (editorState.suppressRailClick) {
          event.preventDefault();
          return;
        }
        if (event.target.closest(".railPlayhead")) return;
        const marker = event.target.closest("[data-editor-key]");
        if (marker) {
          const additive = multiSelectModifier(event);
          selectEditorCue(marker.dataset.editorKey, !additive, additive);
          return;
        }
        seekEditorRailAt(event.clientX);
      });
      els.editorFilter.addEventListener("input", renderEditorTable);
      els.editorTextInput.addEventListener("input", () => updateSelectedEditorCue({ text: els.editorTextInput.value }));
      els.editorStartInput.addEventListener("change", () => updateSelectedEditorCue({ startS: Number(els.editorStartInput.value) }));
      els.editorLeadInput.addEventListener("change", () => updateSelectedEditorCue({ leadS: Number(els.editorLeadInput.value) }));
      els.editorEnabledInput.addEventListener("change", () => updateSelectedEditorCue({ enabled: els.editorEnabledInput.checked }));
      els.editorSetCueBtn.addEventListener("click", setSelectedCueFromVideo);
      els.editorJumpCueBtn.addEventListener("click", jumpToSelectedEditorCue);
      els.editorPreviewCueBtn.addEventListener("click", () => previewSelectedEditorCue().catch((error) => setEditorStatus(`試聽失敗：${error.message}`, "dirty")));
      els.editorDeleteCueBtn.addEventListener("click", deleteSelectedEditorCue);
      els.editorAddSkillBtn.addEventListener("click", () => addEditorCue(els.editorNewSkillInput.value));
      els.editorNewSkillInput.addEventListener("keydown", (event) => {
        if (event.key !== "Enter") return;
        event.preventDefault();
        addEditorCue(els.editorNewSkillInput.value);
      });
      els.editorSkillLibrary.addEventListener("click", (event) => {
        const remove = event.target.closest("[data-editor-skill-remove]");
        if (remove) {
          editorState.customSkillTexts.delete(decodeURIComponent(remove.dataset.editorSkillRemove));
          saveCustomSkillLibrary();
          renderEditorSkillLibrary();
          return;
        }
        const use = event.target.closest("[data-editor-skill]");
        if (use) addEditorCue(decodeURIComponent(use.dataset.editorSkill));
      });
      for (const button of document.querySelectorAll("[data-editor-nudge]")) {
        button.addEventListener("click", () => nudgeSelectedEditorCue(Number(button.dataset.editorNudge || 0)));
      }
      els.editorSaveBtn.addEventListener("click", saveEditorChanges);
      els.editorSubmitBtn.addEventListener("click", openFeedbackDialog);
      els.feedbackForm.addEventListener("submit", submitFeedback);
      els.feedbackCancelBtn.addEventListener("click", () => els.feedbackDialog.close());
      els.editorReloadBtn.addEventListener("click", () => {
        refreshTimelineFromServer(true).catch((error) => setEditorStatus(`重新載入失敗：${error.message}`, "dirty"));
      });
      els.manualPhaseButtons.addEventListener("click", (event) => {
        const button = event.target.closest("[data-manual-phase]");
        if (button) manualStart(button.dataset.manualPhase);
      });
      document.addEventListener("keydown", (event) => {
        if (event.key === "F8") {
          event.preventDefault();
          if (state.running) stopSource();
          else startShare();
        } else if (event.key === "F11") {
          event.preventDefault();
          resetRun();
        } else if (event.key === "F9" && !document.body.classList.contains("editor-mode")) {
          event.preventDefault();
          togglePrompterFocus();
        }
      });
      window.addEventListener("beforeunload", (event) => {
        if (!editorState.dirtyKeys.size) return;
        event.preventDefault();
        event.returnValue = "";
      });
    }

    async function init() {
      bindEvents();
      try {
        await loadAssets();
      } catch (error) {
        setText("status", "載入失敗", "badText");
        els.topStatus.textContent = error.message;
        log(`載入失敗：${error.message}`, "badText");
      }
    }

    init();
  </script>
</body>
</html>
