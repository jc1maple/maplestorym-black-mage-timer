<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>黑魔法師招式提示機</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0e1013;
      --panel: #171a1f;
      --panel2: #111419;
      --line: #303741;
      --text: #eef2f6;
      --muted: #a9b3bf;
      --ok: #75d48b;
      --warn: #ffd166;
      --bad: #ff8d8d;
      --accent: #7fb2ff;
      font-family: "Segoe UI", "Microsoft JhengHei", Arial, sans-serif;
    }
    * { box-sizing: border-box; letter-spacing: 0; }
    body { margin: 0; background: var(--bg); color: var(--text); }
    button, input, select {
      font: inherit;
      color: var(--text);
      background: #202630;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 8px 10px;
    }
    button { cursor: pointer; }
    button:hover { border-color: #6f8198; }
    button.primary { background: #1f5134; border-color: #48a66b; }
    button.warn { background: #4c3c1f; border-color: #8a6f35; }
    button.bad { background: #572426; border-color: #a2474b; }
    button:disabled { opacity: .48; cursor: not-allowed; }
    input[type="range"] { width: 130px; padding: 0; }
    input[type="number"] { width: 78px; }
    header {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      padding: 12px;
      border-bottom: 1px solid var(--line);
      background: #101318;
      position: sticky;
      top: 0;
      z-index: 2;
      transition: margin-left .18s ease;
    }
    h1 { font-size: 20px; margin: 0 12px 0 0; }
    main {
      display: grid;
      grid-template-columns: minmax(480px, 1.15fr) minmax(360px, .85fr);
      gap: 12px;
      padding: 12px;
      transition: margin-left .18s ease;
    }
    .iconButton {
      width: 38px;
      height: 38px;
      padding: 0;
      display: inline-grid;
      place-items: center;
      font-size: 23px;
      line-height: 1;
    }
    .bossSidebar {
      position: fixed;
      inset: 0 auto 0 0;
      z-index: 12;
      width: 224px;
      padding: 14px 12px;
      border-right: 1px solid var(--line);
      background: #0b0e12;
      transform: translateX(-100%);
      transition: transform .18s ease;
      overflow-y: auto;
    }
    body.boss-sidebar-open .bossSidebar { transform: translateX(0); }
    body.boss-sidebar-open > header,
    body.boss-sidebar-open > main { margin-left: 224px; }
    .bossSidebarHeader {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 18px;
    }
    .bossSidebarHeader strong { font-size: 18px; }
    .bossChoices { display: grid; gap: 7px; }
    .bossChoice {
      width: 100%;
      min-height: 48px;
      text-align: left;
      font-weight: 800;
      background: #171c23;
    }
    .bossChoice.active {
      color: #07130b;
      background: var(--ok);
      border-color: #bdf4ca;
    }
    .bossBackdrop {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 11;
      border: 0;
      border-radius: 0;
      padding: 0;
      background: rgba(0, 0, 0, .62);
    }
    section {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
      min-width: 0;
    }
    .metrics {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
      margin-bottom: 10px;
    }
    .metric {
      background: var(--panel2);
      border: 1px solid #252b34;
      border-radius: 6px;
      padding: 8px;
      min-height: 58px;
    }
    .label { color: var(--muted); font-size: 12px; }
    .value {
      margin-top: 4px;
      font-weight: 750;
      font-size: 18px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .ok { color: var(--ok); }
    .warnText { color: var(--warn); }
    .badText { color: var(--bad); }
    .videoBox {
      aspect-ratio: 16 / 9;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #050608;
      border: 1px solid #252b34;
      border-radius: 6px;
      overflow: hidden;
      position: relative;
    }
    video { width: 100%; height: 100%; object-fit: contain; background: #050608; }
    .placeholder {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      pointer-events: none;
    }
    .currentCallout {
      font-size: 28px;
      font-weight: 850;
      line-height: 1.25;
      margin-bottom: 8px;
    }
    .nextCallout {
      color: var(--muted);
      font-size: 16px;
      min-height: 26px;
      margin-bottom: 12px;
    }
    .phaseGrid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 8px;
      margin: 8px 0 12px;
    }
    .phaseCard {
      border: 1px solid #2b333e;
      background: #101419;
      border-radius: 6px;
      padding: 8px;
    }
    .phaseCard strong { display: block; font-size: 18px; }
    .phaseCard span { display: block; color: var(--muted); font-size: 12px; margin-top: 3px; }
    .phaseCard.active { border-color: #48a66b; }
    .phaseCard.detected { border-color: #8a6f35; }
    .settings {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      color: var(--muted);
      margin-top: 10px;
    }
    .manual {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin: 8px 0;
    }
    .log {
      height: 260px;
      overflow: auto;
      white-space: pre-wrap;
      font: 12px/1.45 Consolas, "Microsoft JhengHei", monospace;
      color: #d7dde6;
      background: #0b0d10;
      border: 1px solid #252b34;
      border-radius: 6px;
      padding: 8px;
    }
    .timeline {
      height: 330px;
      overflow: auto;
      border: 1px solid #252b34;
      border-radius: 6px;
      background: #0b0d10;
    }
    .cueRow {
      display: grid;
      grid-template-columns: 86px 64px 1fr;
      gap: 8px;
      padding: 6px 8px;
      border-bottom: 1px solid #222832;
      font-size: 13px;
    }
    .cueRow.played { color: var(--ok); }
    .cueRow.next { color: var(--warn); background: #211b0e; }
    .modeSwitch {
      display: inline-flex;
      padding: 3px;
      gap: 3px;
      background: #080a0d;
      border: 1px solid var(--line);
      border-radius: 7px;
    }
    .modeSwitch button { border: 0; background: transparent; padding: 6px 10px; }
    .modeSwitch button.active { background: #2b3440; color: #fff; }
    .headerSpacer { flex: 1; }
    .prompterPanel {
      --signal: #79d7ff;
      background: #020304;
      border: 5px solid var(--signal);
      border-radius: 8px;
      min-height: 390px;
      padding: 16px 18px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: inset 0 0 0 2px #000;
      overflow: hidden;
    }
    .prompterPanel[data-urgency="soon"] { --signal: #ffd166; }
    .prompterPanel[data-urgency="critical"] {
      --signal: #ff4545;
      background: #220507;
      animation: criticalPulse .7s ease-in-out infinite;
    }
    .prompterPanel[data-urgency="now"] {
      --signal: #fff;
      color: #fff;
      background: #a60016;
    }
    @keyframes criticalPulse {
      50% { box-shadow: inset 0 0 0 5px rgba(255,255,255,.4); }
    }
    .prompterHeader {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      color: var(--signal);
      font-size: 18px;
      font-weight: 800;
    }
    .prompterMain {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 190px;
      align-items: center;
      gap: 18px;
      min-height: 220px;
    }
    .prompterLabel { color: var(--signal); font-size: 18px; font-weight: 850; }
    .prompterMove {
      font-size: 72px;
      line-height: 1.05;
      font-weight: 950;
      word-break: break-word;
      text-wrap: balance;
      margin-top: 8px;
    }
    .prompterCountdown {
      color: var(--signal);
      text-align: center;
      font-variant-numeric: tabular-nums;
      min-width: 0;
    }
    .prompterSeconds { display: block; font-size: 112px; line-height: .9; font-weight: 950; }
    .prompterPanel[data-urgency="now"] .prompterSeconds { font-size: 72px; }
    .prompterUnit { display: block; margin-top: 10px; font-size: 22px; font-weight: 850; }
    .prompterFollowing {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      border-top: 1px solid #343a42;
      padding-top: 10px;
      min-height: 58px;
    }
    .followingCue {
      display: grid;
      grid-template-columns: 62px minmax(0, 1fr);
      gap: 8px;
      align-items: center;
      color: #dce3ea;
      font-size: 16px;
      font-weight: 700;
      min-width: 0;
    }
    .followingCue strong { color: var(--warn); font-size: 20px; font-variant-numeric: tabular-nums; }
    .followingCue span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .currentCallout, .nextCallout { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
    #logSection { grid-column: 1 / -1; }
    body.focus-prompter main { display: block; padding: 8px; }
    body.focus-prompter #captureSection,
    body.focus-prompter #logSection,
    body.focus-prompter #phaseCards,
    body.focus-prompter #timeline { display: none; }
    body.focus-prompter #calloutSection { border: 0; padding: 0; background: #000; }
    body.focus-prompter .prompterPanel { min-height: calc(100vh - 84px); border-width: 8px; }
    body.focus-prompter .prompterMove { font-size: 92px; }
    body.focus-prompter .prompterSeconds { font-size: 144px; }
    body.editor-mode #liveView,
    body:not(.editor-mode) #editorView,
    body.editor-mode .liveControl,
    body.editor-mode #prompterFocusBtn { display: none; }
    .editorView {
      grid-template-columns: minmax(520px, 1.05fr) minmax(480px, .95fr);
      align-items: start;
    }
    .editorToolbar, .editorTransport, .editorPhaseTabs, .editorActions, .editorFields {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .editorToolbar { margin-bottom: 10px; }
    .youtubeUrlInput { flex: 1 1 330px; min-width: 260px; }
    .editorVideoBox {
      aspect-ratio: 16 / 9;
      background: #050608;
      border: 1px solid #303741;
      border-radius: 6px;
      overflow: hidden;
      position: relative;
    }
    .editorVideoBox video { display: block; }
    .editorVideoBox > [hidden] { display: none !important; }
    .editorYoutubeWrap, .editorYoutubeWrap iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
    }
    .editorCaptureVideo {
      position: fixed;
      right: 0;
      bottom: 0;
      width: 1px !important;
      height: 1px !important;
      opacity: 0;
      pointer-events: none;
      z-index: -1;
    }
    body.youtube-scan-active { overflow: hidden; background: #000; }
    body.youtube-scan-active > header,
    body.youtube-scan-active > main:not(#editorView),
    body.youtube-scan-active #editorView > section:nth-child(2),
    body.youtube-scan-active #editorView > section:first-child > :not(.editorVideoBox) { display: none !important; }
    body.youtube-scan-active #editorView {
      display: block;
      width: 100vw;
      height: 100vh;
      padding: 0;
    }
    body.youtube-scan-active #editorView > section:first-child {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      border: 0;
      border-radius: 0;
      background: #000;
    }
    body.youtube-scan-active .editorVideoBox {
      position: fixed;
      inset: 0;
      z-index: 10000;
      width: 100vw;
      height: 100vh;
      aspect-ratio: auto;
      border: 0;
      border-radius: 0;
    }
    .editorTransport { margin-top: 10px; }
    .editorVoiceToggle { display: inline-flex; gap: 6px; align-items: center; color: var(--text); font-weight: 750; }
    .editorClock { font-size: 24px; font-weight: 850; font-variant-numeric: tabular-nums; min-width: 132px; }
    .editorPhaseTabs { margin-top: 14px; }
    .editorPhaseTabs button { flex: 1 1 130px; min-width: 120px; font-variant-numeric: tabular-nums; }
    .editorPhaseTabs button.active { background: #1f5134; border-color: #48a66b; }
    .p1VariantToggle {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      min-height: 34px;
      padding: 0 10px;
      border: 1px solid #3c4653;
      border-radius: 6px;
      background: #11161d;
      color: var(--text);
      font-weight: 800;
    }
    .p1VariantToggle input { width: 18px; height: 18px; accent-color: #48a66b; }
    .editorP1VariantRow { display: flex; margin-top: 10px; }
    .editorP1VariantRow[hidden] { display: none; }
    .phaseAlignment {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
      align-items: end;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid #303741;
    }
    .phaseAlignment input, .editorFields input[type="number"] { width: 112px; }
    .skillCreator { margin-top: 12px; padding-top: 12px; border-top: 1px solid #303741; }
    .skillCreator h2 { margin: 0 0 9px; font-size: 15px; }
    .editorNewSkillInput { flex: 1 1 220px; min-width: 0; }
    .editorSkillLibrary { display: flex; flex-wrap: wrap; gap: 6px; max-height: 142px; overflow: auto; }
    .skillChip { display: inline-flex; min-width: 0; }
    .skillChip .skillUse { border-radius: 5px 0 0 5px; max-width: 210px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .skillChip:not(.customSkill) .skillUse { border-radius: 5px; }
    .skillChip .skillRemove { width: 30px; padding: 0; border-left: 0; border-radius: 0 5px 5px 0; color: #ff9b9b; font-size: 17px; }
    .editorActions { justify-content: space-between; margin-bottom: 10px; }
    .editorStatus { color: var(--muted); font-weight: 700; }
    .editorStatus.dirty { color: var(--warn); }
    .editorStatus.saved { color: var(--ok); }
    #editorSubmitBtn { min-width: 104px; }
    .feedbackDialog {
      width: min(460px, calc(100vw - 28px));
      padding: 0;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--text);
      background: #151a22;
      box-shadow: 0 20px 60px rgba(0, 0, 0, .55);
    }
    .feedbackDialog::backdrop { background: rgba(0, 0, 0, .72); }
    .feedbackForm { display: grid; gap: 14px; padding: 18px; }
    .feedbackForm h2 { margin: 0; font-size: 19px; }
    .feedbackForm label { display: grid; gap: 6px; color: var(--muted); font-size: 13px; font-weight: 700; }
    .feedbackForm input, .feedbackForm textarea {
      width: 100%;
      box-sizing: border-box;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 10px;
      color: var(--text);
      background: var(--panel2);
      font: inherit;
    }
    .feedbackForm textarea { min-height: 88px; resize: vertical; }
    .feedbackSummary { color: var(--cyan); font-weight: 800; }
    .feedbackStatus { min-height: 20px; color: var(--muted); }
    .feedbackDialogActions { display: flex; justify-content: flex-end; gap: 8px; }
    .selectedCue {
      border-top: 1px solid #303741;
      border-bottom: 1px solid #303741;
      padding: 12px 0;
      margin-bottom: 10px;
    }
    .selectedCueName { font-size: 26px; line-height: 1.2; font-weight: 900; margin-bottom: 10px; word-break: break-word; }
    .editorFields label { color: var(--muted); font-size: 13px; }
    .editorFields .textField { flex: 1 1 240px; }
    .editorFields .textField input { width: 100%; }
    .editorFields label > span { display: block; margin-bottom: 4px; }
    .editorFields .checkField { display: flex; gap: 6px; align-items: center; padding-top: 18px; }
    .editorRailViewport {
      overflow-x: auto;
      overflow-y: hidden;
      background: #090b0e;
      border: 1px solid #303741;
      border-radius: 6px;
      height: 106px;
      margin-bottom: 10px;
    }
    .editorRail { position: relative; height: 104px; min-width: 100%; cursor: pointer; }
    .railTick { position: absolute; top: 0; bottom: 0; border-left: 1px solid #303741; color: #929dab; font-size: 11px; padding-left: 4px; }
    .railCue {
      position: absolute;
      top: 42px;
      width: 11px;
      height: 44px;
      padding: 0;
      border-radius: 2px;
      border: 1px solid #9eafc2;
      background: #49637e;
      transform: translateX(-5px);
      cursor: ew-resize;
      touch-action: none;
    }
    .railCue.selected {
      width: 15px;
      transform: translateX(-7px);
      background: #2795b8;
      border-color: #b8efff;
      box-shadow: 0 0 0 2px #155b73;
      z-index: 2;
    }
    .railCue.selected.primarySelection { background: #ffd166; border-color: #fff; box-shadow: 0 0 0 2px #8d6a00; z-index: 3; }
    .railCue.dragging {
      width: 17px;
      transform: translateX(-8px);
      background: #6dd5ff;
      border-color: #fff;
      box-shadow: 0 0 0 2px #216b87, 0 0 12px rgba(109, 213, 255, 0.75);
      z-index: 4;
    }
    .editorRailViewport.dragging { user-select: none; cursor: ew-resize; }
    .editorRailViewport.seeking { user-select: none; cursor: ew-resize; }
    .editorRailViewport.seeking .editorRail { cursor: ew-resize; }
    .railCue.playing {
      width: 15px;
      transform: translateX(-7px);
      background: #56e98b;
      border-color: #fff;
      box-shadow: 0 0 0 2px #14773a, 0 0 14px rgba(86, 233, 139, 0.85);
      z-index: 3;
    }
    .railCue.playing.selected { box-shadow: 0 0 0 2px #6dd5ff, 0 0 14px rgba(86, 233, 139, 0.85); }
    .railCue.playing.selected.primarySelection { box-shadow: 0 0 0 2px #ffd166, 0 0 14px rgba(86, 233, 139, 0.85); }
    .railPlayhead {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 14px;
      transform: translateX(-7px);
      cursor: ew-resize;
      pointer-events: auto;
      touch-action: none;
      z-index: 5;
    }
    .railPlayhead::before {
      content: "";
      position: absolute;
      top: 0;
      left: 2px;
      width: 10px;
      height: 8px;
      border-radius: 1px;
      background: #ff5252;
    }
    .railPlayhead::after {
      content: "";
      position: absolute;
      top: 0;
      bottom: 0;
      left: 6px;
      width: 2px;
      background: #ff5252;
    }
    .railPlayhead:hover::after,
    .editorRailViewport.seeking .railPlayhead::after { left: 5px; width: 4px; }
    .railPlayheadTime {
      position: absolute;
      top: 11px;
      left: 50%;
      transform: translateX(-50%);
      padding: 5px 7px;
      border: 1px solid #ff7a7a;
      border-radius: 4px;
      background: #15191f;
      color: #fff;
      box-shadow: 0 3px 10px rgba(0, 0, 0, .55);
      font-size: 12px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      line-height: 1;
      white-space: nowrap;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity .1s ease;
      z-index: 2;
    }
    .railPlayhead:hover .railPlayheadTime,
    .editorRailViewport.seeking .railPlayheadTime {
      opacity: 1;
      visibility: visible;
    }
    .railPlayhead.tooltipStart .railPlayheadTime {
      left: 7px;
      transform: none;
    }
    .railPlayhead.tooltipEnd .railPlayheadTime {
      right: 7px;
      left: auto;
      transform: none;
    }
    .editorFilter { width: 100%; margin-bottom: 8px; }
    .editorTableWrap { height: 430px; overflow: auto; border: 1px solid #303741; border-radius: 6px; background: #090b0e; }
    .editorCueRow {
      width: 100%;
      display: grid;
      grid-template-columns: 96px 84px 84px minmax(0, 1fr) 36px;
      gap: 7px;
      align-items: center;
      text-align: left;
      padding: 7px 8px;
      border: 0;
      border-radius: 0;
      border-bottom: 1px solid #252b34;
      background: transparent;
      min-height: 42px;
    }
    .editorCueRow:hover { background: #171c23; }
    .editorCueRow.selected { color: #eefbff; background: #214d62; box-shadow: inset 5px 0 #6dd5ff; }
    .editorCueRow.selected.primarySelection { color: #111; background: #ffd166; box-shadow: inset 5px 0 #fff; }
    .editorCueRow.playing {
      color: #061109;
      background: #56e98b;
      box-shadow: inset 6px 0 #fff;
      font-weight: 800;
    }
    .editorCueRow.playing:hover { background: #6df09b; }
    .editorCueRow.playing.selected { outline: 2px solid #6dd5ff; outline-offset: -2px; }
    .editorCueRow.playing.selected.primarySelection { outline-color: #ffd166; }
    .editorCueRow.dirty:not(.selected):not(.playing) { border-left: 4px solid #ffd166; }
    .editorCueRow span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .editorCueRow .disabledCue { color: var(--bad); }
    .muted { color: var(--muted); }
    canvas { display: none; }
    @media (max-width: 980px) {
      main { grid-template-columns: 1fr; }
      .metrics { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .phaseGrid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      #calloutSection { order: -1; }
      .prompterMove { font-size: 56px; }
      .prompterSeconds { font-size: 92px; }
      .editorView { grid-template-columns: 1fr; }
      .editorTableWrap { height: 360px; }
      body.focus-prompter .prompterMove { font-size: 72px; }
      body.focus-prompter .prompterSeconds { font-size: 112px; }
      body.boss-sidebar-open > header,
      body.boss-sidebar-open > main { margin-left: 0; }
      body.boss-sidebar-open .bossBackdrop { display: block; }
    }
    @media (max-width: 600px) {
      .prompterPanel { min-height: 340px; padding: 12px; }
      .prompterMain { grid-template-columns: minmax(0, 1fr) 126px; gap: 8px; }
      .prompterMove { font-size: 44px; }
      .prompterSeconds { font-size: 72px; }
      .prompterFollowing { grid-template-columns: 1fr; }
      .followingCue:nth-child(n+2) { display: none; }
      .phaseAlignment { grid-template-columns: 1fr; }
      .editorCueRow { grid-template-columns: 42px 76px minmax(0, 1fr) 30px; }
      .editorCueRow .promptCol { display: none; }
    }
  </style>
</head>

  <canvas id="matchCanvas"></canvas>

  <script>
    const BOSS_PROFILES = {
      black_mage: {
        id: "black_mage",
        name: "黑魔法師",
        detector: "black_mage",
        phases: ["P1", "P2", "P3", "P4"],
        phaseLabels: { P1: "P1", P2: "P2", P3: "P3", P4: "P4" },
        defaultEditorYoutubeUrl: "https://youtu.be/UxH_aFs8aa0",
        p1Variant: true,
      },
      seren: {
        id: "seren",
        name: "賽蓮",
        detector: "seren",
        phases: ["S_P1", "S_NOON", "S_SUNSET", "S_MIDNIGHT", "S_DAWN"],
        phaseLabels: {
          S_P1: "P1",
          S_NOON: "P2 正午",
          S_SUNSET: "P2 黃昏",
          S_MIDNIGHT: "P2 午夜",
          S_DAWN: "P2 黎明",
        },
        defaultEditorYoutubeUrl: "https://youtu.be/0gGq4G2oG7A",
        p1Variant: false,
        baselineReplay: {
          name: "0gGq4G2oG7A - 韓服楓之谷m-賽蓮",
          video_duration_s: 515.2,
          phase_hints: {
            S_P1: { gate_start_s: 6.967, template: "HUD 出現" },
            S_NOON: { gate_start_s: 131.833, template: "正午轉輪啟動" },
            S_SUNSET: { gate_start_s: 198.933, template: "全白轉場" },
            S_MIDNIGHT: { gate_start_s: 273.333, template: "全白轉場" },
            S_DAWN: { gate_start_s: 297.667, template: "全白轉場" },
          },
        },
      },
    };
    const BOSS_STORAGE_KEY = "mapleBossTimerSelectedBoss";
    const initialBossId = BOSS_PROFILES[localStorage.getItem(BOSS_STORAGE_KEY)]
      ? localStorage.getItem(BOSS_STORAGE_KEY)
      : "black_mage";
    let PHASE_ORDER = [...BOSS_PROFILES[initialBossId].phases];
    const ALL_PHASES = new Set(Object.values(BOSS_PROFILES).flatMap((profile) => profile.phases));
    const STATIC_DEPLOYMENT = true;
    const STATIC_ASSET_BASE_URL = new URL("./", window.location.href);
    const FEEDBACK_API_URL = "https://maplestorym-black-mage-timer.jrychang0621.chatgpt.site/api/timeline-feedback";
    const PUBLISHED_TIMELINE_API_URL = "https://maplestorym-black-mage-timer.jrychang0621.chatgpt.site/api/published-timeline";
    const IS_GITHUB_PAGES = window.location.hostname.endsWith(".github.io");
    const EDITOR_RAIL_PX_PER_SECOND = 10;
    const STATIC_TIMELINE_KEY = "blackMageWeb2TimelineChanges";
    const P4_TIMELINE_REVISION_KEY = "blackMageP4TimelineRevision";
    const CUSTOM_CUES_KEY = "blackMageEditorCustomCues";
    const CUSTOM_SKILLS_KEY = "blackMageEditorCustomSkills";
    const P1_VARIANT_KEY = "blackMageP1HasShia";
    const P1_VARIANT_SHIA = "shia";
    const P1_VARIANT_NO_SHIA = "no_shia";
    const DEFAULT_TIMELINE_VARIANT = "default";
    const FEEDBACK_REPORTER_KEY = "blackMageWeb2FeedbackReporter";
    const EDITOR_YOUTUBE_KEY = "blackMageEditorYoutubeUrl";
    const LEGACY_EDITOR_BASELINE_IDS = new Set(["-O4WH-sTv4w", "zeSCLSv7kxI", "eBPBE3YK_S4"]);
    const els = Object.fromEntries([...document.querySelectorAll("[id]")].map((node) => [node.id, node]));
    const state = {
      bossId: initialBossId,
      assets: null,
      baseTimeline: [],
      templatesByPhase: {},
      timelineByPhase: {},
      expectedIndex: 0,
      activePhase: "",
      phaseStartMs: 0,
      activeCues: [],
      cueIndex: 0,
      playedKeys: new Set(),
      pending: null,
      lastScanMs: 0,
      confirm: null,
      sourceMode: "",
      stream: null,
      running: false,
      raf: 0,
      audioContext: null,
      audioGain: null,
      audioBuffers: new Map(),
      fallbackAudios: [],
      playingSources: [],
      audioLoading: false,
      audioReady: false,
      audioLoaded: 0,
      audioTotal: 0,
      volume: 1,
      audioMuted: false,
      p1HasShia: true,
      extraLeadS: 0,
      threshold: 0.84,
      selfTesting: false,
      currentCue: null,
      currentCueUntilMs: 0,
      p1HudFallback: { hiddenSinceMs: 0, lastHiddenMs: 0, visibleCount: 0, firstVisibleMs: 0 },
      transitionFallback: {
        phase: "",
        hiddenSinceMs: 0,
        lastHiddenMs: 0,
        bestScore: 0,
        visibleCount: 0,
        firstVisibleMs: 0,
        whiteCount: 0,
      },
      visitedPhases: new Set(),
      serenDetection: {
        structureHiddenSinceMs: 0,
        structureHiddenLastMs: 0,
        visibleCount: 0,
        firstVisibleMs: 0,
        wheelCount: 0,
        firstWheelMs: 0,
        whiteCount: 0,
        firstWhiteMs: 0,
        whiteLastMs: 0,
        whiteLatched: false,
        lastTransitionMs: 0,
      },
      lastScanTelemetryMs: 0,
      contentRectLock: null,
      lastWideSearchMs: 0,
      sessionId: `web2-${Date.now().toString(36)}-${Math.random().toString(16).slice(2, 8)}`,
    };
    const editorState = {
      bossId: initialBossId,
      phase: PHASE_ORDER[0],
      p1HasShia: true,
      cues: [],
      originalByKey: new Map(),
      dirtyKeys: new Set(),
      selectedKey: "",
      selectedKeys: new Set(),
      hudTimes: {},
      sourceName: "",
      sourceMode: "",
      detectionToken: 0,
      detecting: false,
      phaseMethods: {},
      railWidth: 900,
      feedbackSubmitting: false,
      voiceEnabled: true,
      voiceLastVideoS: Number.NaN,
      voiceSeeking: false,
      voiceGeneration: 0,
      voicePlayedKeys: new Set(),
      voiceArmedKey: "",
      voiceArmedAtS: Number.NaN,
      playbackCueKey: "",
      playbackPhase: "",
      customSkillTexts: new Set(),
      youtubePlayer: null,
      youtubeReady: false,
      youtubeVideoId: "",
      youtubeUrl: "",
      youtubeApiPromise: null,
      youtubeState: -1,
      captureStream: null,
      captureEnded: false,
      pendingCaptureRequest: null,
      autoDetectAfterYoutubeReady: false,
      titleBeforeScan: "",
      railDrag: null,
      railSeekDrag: null,
      suppressRailClick: false,
    };

    function activeBossProfile() {
      return BOSS_PROFILES[state.bossId] || BOSS_PROFILES.black_mage;
    }

    function bossIdForPhase(phase) {
      return Object.values(BOSS_PROFILES).find((profile) => profile.phases.includes(phase))?.id || "black_mage";
    }

    function cueBossId(cue) {
      return String(cue?.boss_id || bossIdForPhase(String(cue?.phase || "")));
    }

    function activeBaselineReplay() {
      return activeBossProfile().baselineReplay || state.assets?.baseline_replay || null;
    }

    function defaultEditorYoutubeUrl() {
      return activeBossProfile().defaultEditorYoutubeUrl;
    }

    function editorYoutubeStorageKey(bossId = state.bossId) {
      return bossId === "black_mage" ? EDITOR_YOUTUBE_KEY : `${EDITOR_YOUTUBE_KEY}:${bossId}`;
    }

    function appTitle() {
      return `${activeBossProfile().name}招式提示機`;
    }

    function normalizeTimelineVariant(phase, value) {
      if (phase !== "P1") return DEFAULT_TIMELINE_VARIANT;
      return value === P1_VARIANT_NO_SHIA ? P1_VARIANT_NO_SHIA : P1_VARIANT_SHIA;
    }

    function cueTimelineVariant(cue) {
      return normalizeTimelineVariant(String(cue?.phase || ""), String(cue?.timeline_variant || ""));
    }

    function selectedP1Variant(hasShia) {
      return hasShia ? P1_VARIANT_SHIA : P1_VARIANT_NO_SHIA;
    }

    function liveTimelineVariant(phase) {
      return state.bossId === "black_mage" && phase === "P1"
        ? selectedP1Variant(state.p1HasShia)
        : DEFAULT_TIMELINE_VARIANT;
    }

    function editorTimelineVariant(phase = editorState.phase) {
      return editorState.bossId === "black_mage" && phase === "P1"
        ? selectedP1Variant(editorState.p1HasShia)
        : DEFAULT_TIMELINE_VARIANT;
    }

    function timelineVariantLabel(variant) {
      return variant === P1_VARIANT_NO_SHIA ? "無施雅" : "有施雅";
    }

    function phaseDisplayLabel(phase, variant = liveTimelineVariant(phase)) {
      const profile = Object.values(BOSS_PROFILES).find((item) => item.phases.includes(phase));
      const label = profile?.phaseLabels?.[phase] || phase;
      return profile?.id === "black_mage" && phase === "P1"
        ? `${label} ${timelineVariantLabel(variant)}`
        : label;
    }

    function timelineCueKey(cue) {
      return `${cue.phase}:${cueTimelineVariant(cue)}:${cue.cue_index}`;
    }

    function expandTimelineVariants(data) {
      if (!Array.isArray(data?.timeline)) return data;
      const expanded = [];
      for (const cue of data.timeline) {
        const phase = String(cue.phase || "");
        const rawVariant = String(cue.timeline_variant || "");
        const bossId = String(cue.boss_id || bossIdForPhase(phase));
        if (bossId === "black_mage" && phase === "P1"
            && rawVariant !== P1_VARIANT_SHIA && rawVariant !== P1_VARIANT_NO_SHIA) {
          expanded.push({ ...cue, boss_id: bossId, timeline_variant: P1_VARIANT_SHIA });
          expanded.push({ ...cue, boss_id: bossId, timeline_variant: P1_VARIANT_NO_SHIA });
          continue;
        }
        expanded.push({
          ...cue,
          boss_id: bossId,
          timeline_variant: normalizeTimelineVariant(phase, rawVariant),
        });
      }
      data.timeline = expanded;
      return data;
    }

    function publishedChangeVariants(change, phase) {
      const rawVariant = String(change?.timeline_variant || "");
      if (phase !== "P1") return [DEFAULT_TIMELINE_VARIANT];
      if (rawVariant === P1_VARIANT_SHIA || rawVariant === P1_VARIANT_NO_SHIA) return [rawVariant];
      return [P1_VARIANT_SHIA, P1_VARIANT_NO_SHIA];
    }

    function cueMatchesEditorVariant(cue) {
      return cueBossId(cue) === editorState.bossId
        && (cue.phase !== "P1" || cueTimelineVariant(cue) === editorTimelineVariant("P1"));
    }

    function rebuildTimelineByPhase() {
      if (!Array.isArray(state.assets?.timeline)) return;
      for (const phase of PHASE_ORDER) {
        const variant = liveTimelineVariant(phase);
        state.timelineByPhase[phase] = state.assets.timeline
          .filter((cue) => cue.enabled
            && !cue.deleted
            && cueBossId(cue) === state.bossId
            && cue.phase === phase
            && cueTimelineVariant(cue) === variant)
          .sort((a, b) => effectiveScheduledS(a) - effectiveScheduledS(b) || Number(a.cue_index || 0) - Number(b.cue_index || 0));
      }
    }

    function selectedTimelineCueCount() {
      return PHASE_ORDER.reduce((total, phase) => total + (state.timelineByPhase[phase] || []).length, 0);
    }

    function initialEditorUrlForBoss() {
      const key = editorYoutubeStorageKey();
      const stored = localStorage.getItem(key) || "";
      const storedId = parseYoutubeVideoId(stored);
      const currentDefaultId = parseYoutubeVideoId(defaultEditorYoutubeUrl());
      const belongsToAnotherBoss = Object.values(BOSS_PROFILES).some((profile) => (
        profile.id !== state.bossId
        && parseYoutubeVideoId(profile.defaultEditorYoutubeUrl) === storedId
      ));
      if (!storedId
          || belongsToAnotherBoss
          || (state.bossId === "black_mage" && LEGACY_EDITOR_BASELINE_IDS.has(storedId))) {
        localStorage.setItem(key, defaultEditorYoutubeUrl());
        return defaultEditorYoutubeUrl();
      }
      return storedId === currentDefaultId ? defaultEditorYoutubeUrl() : stored;
    }

    function setBossSidebarOpen(open) {
      const expanded = Boolean(open);
      document.body.classList.toggle("boss-sidebar-open", expanded);
      els.bossSidebar.setAttribute("aria-hidden", String(!expanded));
      els.bossMenuBtn.setAttribute("aria-expanded", String(expanded));
    }

    function renderBossChrome() {
      const profile = activeBossProfile();
      document.title = appTitle();
      els.bossTitle.textContent = profile.name;
      els.bossChoices.innerHTML = Object.values(BOSS_PROFILES).map((boss) => `
        <button class="bossChoice ${boss.id === state.bossId ? "active" : ""}"
          data-boss-id="${boss.id}" aria-current="${boss.id === state.bossId ? "true" : "false"}">
          ${boss.name}
        </button>
      `).join("");
      els.manualPhaseButtons.innerHTML = `<span class="muted">手動起算：</span>${PHASE_ORDER.map((phase) => `
        <button data-manual-phase="${phase}">${phaseDisplayLabel(phase)}</button>
      `).join("")}`;
      els.editorPhaseTabs.innerHTML = PHASE_ORDER.map((phase) => `
        <button data-editor-phase="${phase}">${phaseDisplayLabel(phase, editorTimelineVariant(phase))}</button>
      `).join("");
      const showP1Variant = Boolean(profile.p1Variant);
      els.liveP1VariantToggle.hidden = !showP1Variant;
      els.editorP1VariantRow.hidden = !showP1Variant || editorState.phase !== "P1";
    }

    async function selectBoss(bossId) {
      if (!BOSS_PROFILES[bossId] || bossId === state.bossId) {
        setBossSidebarOpen(false);
        return;
      }
      if (editorState.dirtyKeys.size) await saveEditorChanges();
      if (state.running || state.stream || state.activePhase || state.pending || els.video.currentSrc) {
        stopSource();
      }
      editorPause();
      state.bossId = bossId;
      editorState.bossId = bossId;
      PHASE_ORDER = [...BOSS_PROFILES[bossId].phases];
      localStorage.setItem(BOSS_STORAGE_KEY, bossId);
      state.timelineByPhase = {};
      editorState.phase = PHASE_ORDER[0];
      editorState.hudTimes = {};
      editorState.phaseMethods = {};
      renderBossChrome();
      rebuildTimelineByPhase();
      initializeEditorData(state.assets);
      resetRun();
      const editorUrl = defaultEditorYoutubeUrl();
      localStorage.setItem(editorYoutubeStorageKey(), editorUrl);
      els.editorYoutubeInput.value = editorUrl;
      loadEditorYoutube(editorUrl).catch((error) => {
        els.editorPhaseStatus.textContent = `YouTube 載入失敗：${error.message}`;
      });
      els.topStatus.textContent = `${activeBossProfile().name} · 語音 ${selectedTimelineCueCount()} 句`;
      setBossSidebarOpen(false);
    }

    function setText(id, text, cls = "") {
      const el = els[id];
      if (!el) return;
      el.textContent = text;
      el.className = `value ${cls}`.trim();
    }

    function log(message, cls = "") {
      const stamp = new Date().toLocaleTimeString("zh-TW", { hour12: false });
      const line = `${stamp} ${message}`;
      const div = document.createElement("div");
      if (cls) div.className = cls;
      div.textContent = line;
      els.log.appendChild(div);
      els.log.scrollTop = els.log.scrollHeight;
      console.log(line);
    }

    function postEvent(row) {
      if (STATIC_DEPLOYMENT) return;
      const payload = {
        row: {
          session_id: state.sessionId,
          boss_id: state.bossId,
          source: state.sourceMode,
          event_time: new Date().toISOString(),
          ...row,
        },
      };
      fetch("/api/web-live-event", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      }).catch(() => {});
    }

    function readStoredTimelineChanges() {
      try {
        return JSON.parse(localStorage.getItem(STATIC_TIMELINE_KEY) || "{}") || {};
      } catch (_) {
        return {};
      }
    }

    function clearStaleP4TimelineChanges(data, stored) {
      const revision = String(data?.p4_timeline_source?.revision || "");
      if (!revision || localStorage.getItem(P4_TIMELINE_REVISION_KEY) === revision) return stored;
      for (const key of Object.keys(stored)) {
        if (key.startsWith("P4:")) delete stored[key];
      }
      localStorage.setItem(STATIC_TIMELINE_KEY, JSON.stringify(stored));
      localStorage.setItem(P4_TIMELINE_REVISION_KEY, revision);
      return stored;
    }

    function readStoredCustomCues() {
      try {
        const value = JSON.parse(localStorage.getItem(CUSTOM_CUES_KEY) || "[]");
        return Array.isArray(value) ? value : [];
      } catch (_) {
        return [];
      }
    }

    function readStoredCustomSkills() {
      try {
        const value = JSON.parse(localStorage.getItem(CUSTOM_SKILLS_KEY) || "[]");
        return Array.isArray(value) ? value.map((text) => String(text || "").trim()).filter(Boolean) : [];
      } catch (_) {
        return [];
      }
    }

    function voiceCueForText(text) {
      const normalized = String(text || "").trim();
      const libraryMatch = state.assets?.voice_library?.[normalized];
      if (libraryMatch?.clip_url) return libraryMatch;
      return state.baseTimeline.find((cue) => String(cue.text || "").trim() === normalized && cue.clip_url) || null;
    }

    function applyCueVoice(cue) {
      const match = voiceCueForText(cue.text);
      cue.clip_url = match?.clip_url || "";
      cue.clip_path = match?.clip_path || "";
      cue.text = String(match?.display_text || cue.text || "").trim();
      cue.tts_text = String(match?.tts_text || "").trim()
        || (String(cue.text || "").trim() === "地刺" ? "第刺" : "");
      cue.duration_s = Number(match?.duration_s || cue.duration_s || Math.max(0.8, String(cue.text || "").length * 0.22));
    }

    async function loadPublishedTimelineChanges() {
      const response = await fetch(PUBLISHED_TIMELINE_API_URL, { cache: "no-store" });
      const payload = await response.json();
      if (!response.ok || payload.ok === false) {
        throw new Error(payload.error || response.statusText);
      }
      return Array.isArray(payload.changes) ? payload.changes : [];
    }

    function applyPublishedTimelineChanges(data, changes) {
      if (!Array.isArray(data?.timeline) || !Array.isArray(changes)) return 0;
      const byKey = new Map(data.timeline.map((cue) => [timelineCueKey(cue), cue]));
      let applied = 0;
      for (const change of changes) {
        const phase = String(change.phase || "");
        const cueIndex = Number(change.cue_index);
        const operation = String(change.operation || "update");
        const text = String(change.text || "").trim();
        const startS = Number(change.start_s);
        const leadS = Number(change.lead_s);
        if (!ALL_PHASES.has(phase)
            || !Number.isInteger(cueIndex)
            || cueIndex < 1
            || !text
            || !Number.isFinite(startS)
            || !Number.isFinite(leadS)) {
          continue;
        }
        for (const variant of publishedChangeVariants(change, phase)) {
          const key = `${phase}:${variant}:${cueIndex}`;
          let cue = byKey.get(key);
          if (!cue && operation === "delete") continue;
          if (!cue) {
            cue = {
              boss_id: bossIdForPhase(phase),
              phase,
              timeline_variant: variant,
              cue_index: cueIndex,
              text,
              start_s: Math.max(0, startS),
              end_s: Math.max(0, startS),
              lead_s: leadS,
              offset_s: 0,
              enabled: Boolean(change.enabled),
              deleted: false,
              custom: false,
              published: true,
              clip_url: "",
              clip_path: "",
              duration_s: Math.max(0.8, text.length * 0.22),
            };
            data.timeline.push(cue);
            byKey.set(key, cue);
          } else {
            const oldStartS = Number(cue.start_s || 0);
            const durationS = Math.max(0, Number(cue.end_s ?? oldStartS) - oldStartS);
            cue.text = text;
            cue.start_s = Math.max(0, startS);
            cue.end_s = cue.start_s + durationS;
            cue.lead_s = leadS;
            cue.enabled = Boolean(change.enabled);
            cue.custom = false;
            cue.published = true;
          }
          cue.deleted = operation === "delete";
          if (cue.deleted) cue.enabled = false;
          cue.scheduled_s = Math.max(0, Number(cue.start_s || 0) + Number(cue.offset_s || 0) - Number(cue.lead_s || 0));
          applyCueVoice(cue);
          applied += 1;
        }
      }
      data.timeline_enabled_count = data.timeline.filter((cue) => cue.enabled && !cue.deleted).length;
      return applied;
    }

    function nextAvailableCustomCueIndex(phase, variant, cues) {
      const used = new Set((cues || [])
        .filter((cue) => cueBossId(cue) === bossIdForPhase(phase)
          && cue.phase === phase
          && cueTimelineVariant(cue) === variant)
        .map((cue) => Number(cue.cue_index))
        .filter((cueIndex) => Number.isInteger(cueIndex) && cueIndex >= 1001));
      let candidate = 1001;
      while (used.has(candidate)) candidate += 1;
      return candidate;
    }

    function cuesHaveSameDefinition(left, right) {
      return String(left?.text || "").trim() === String(right?.text || "").trim()
        && Math.abs(Number(left?.start_s || 0) - Number(right?.start_s || 0)) <= 0.001
        && Math.abs(Number(left?.lead_s || 0) - Number(right?.lead_s || 0)) <= 0.001
        && Boolean(left?.enabled) === Boolean(right?.enabled);
    }

    function appendStoredCustomCues(data) {
      if (!STATIC_DEPLOYMENT || !Array.isArray(data?.timeline)) return data;
      const existing = new Map(data.timeline.map((cue) => [timelineCueKey(cue), cue]));
      const storedCues = readStoredCustomCues();
      const repairedCues = [];
      let reassigned = 0;
      let absorbed = 0;
      let changed = false;
      for (const raw of storedCues) {
        const phase = String(raw.phase || "");
        const bossId = String(raw.boss_id || bossIdForPhase(phase));
        const variant = normalizeTimelineVariant(phase, String(raw.timeline_variant || ""));
        let cueIndex = Number(raw.cue_index);
        const text = String(raw.text || "").trim();
        if (!ALL_PHASES.has(phase)
            || !BOSS_PROFILES[bossId]?.phases.includes(phase)
            || !Number.isInteger(cueIndex)
            || cueIndex < 1001
            || !text) {
          changed = true;
          continue;
        }
        let key = `${phase}:${variant}:${cueIndex}`;
        const occupiedCue = existing.get(key);
        if (occupiedCue && cuesHaveSameDefinition(raw, occupiedCue)) {
          absorbed += 1;
          changed = true;
          continue;
        }
        if (occupiedCue) {
          cueIndex = nextAvailableCustomCueIndex(phase, variant, data.timeline);
          key = `${phase}:${variant}:${cueIndex}`;
          reassigned += 1;
          changed = true;
        }
        const cue = {
          ...raw,
          boss_id: bossId,
          phase,
          timeline_variant: variant,
          cue_index: cueIndex,
          text,
          start_s: Math.max(0, Number(raw.start_s || 0)),
          end_s: Math.max(0, Number(raw.end_s ?? raw.start_s ?? 0)),
          lead_s: Number(raw.lead_s ?? 2),
          offset_s: Number(raw.offset_s || 0),
          enabled: raw.enabled !== false,
          custom: true,
          deleted: false,
        };
        cue.scheduled_s = Math.max(0, cue.start_s + cue.offset_s - cue.lead_s);
        applyCueVoice(cue);
        data.timeline.push(cue);
        existing.set(key, cue);
        repairedCues.push({ ...cue });
      }
      if (changed) {
        localStorage.setItem(CUSTOM_CUES_KEY, JSON.stringify(repairedCues));
      }
      if (reassigned) {
        log(`已修復 ${reassigned} 則新增招式的重複 ID`, "ok");
      }
      if (absorbed) {
        log(`已合併 ${absorbed} 則已採用的本機招式`, "ok");
      }
      return data;
    }

    function applyStoredTimelineChanges(data) {
      if (!STATIC_DEPLOYMENT || !Array.isArray(data?.timeline)) return data;
      const stored = clearStaleP4TimelineChanges(data, readStoredTimelineChanges());
      for (const cue of data.timeline) {
        cue.custom = false;
        cue.deleted = Boolean(cue.deleted);
        const legacyChange = cue.phase !== "P1" || cueTimelineVariant(cue) === P1_VARIANT_SHIA
          ? stored[`${cue.phase}:${cue.cue_index}`]
          : null;
        const change = stored[timelineCueKey(cue)] || legacyChange;
        if (!change) continue;
        cue.text = String(change.text ?? cue.text ?? "").trim() || cue.text;
        cue.start_s = Number(change.start_s ?? cue.start_s ?? 0);
        cue.lead_s = Number(change.lead_s ?? cue.lead_s ?? 0);
        cue.enabled = Boolean(change.enabled);
        cue.deleted = Boolean(change.deleted);
        cue.scheduled_s = Math.max(0, cue.start_s + Number(cue.offset_s || 0) - cue.lead_s);
        applyCueVoice(cue);
      }
      return data;
    }

    function fmt(seconds) {
      if (!Number.isFinite(seconds)) return "--:--.---";
      const totalMs = Math.max(0, Math.round(seconds * 1000));
      const ms = totalMs % 1000;
      const totalS = Math.floor(totalMs / 1000);
      const s = totalS % 60;
      const m = Math.floor(totalS / 60);
      return `${m.toString().padStart(2, "0")}:${s.toString().padStart(2, "0")}.${ms.toString().padStart(3, "0")}`;
    }

    function visibleCountdown(seconds) {
      if (!Number.isFinite(seconds)) return "--";
      if (seconds >= 10) return String(Math.ceil(seconds));
      return Math.max(0, seconds).toFixed(1);
    }

    function updatePrompter(now) {
      const panel = els.prompterPanel;
      if (!panel) return;
      if (state.pending) {
        const remain = Math.max(0, (state.pending.hudMs - now) / 1000);
        panel.dataset.urgency = "soon";
        els.prompterPhase.textContent = `${phaseDisplayLabel(state.pending.phase)} 過場已偵測`;
        els.prompterPhaseTime.textContent = "等待 HUD";
        els.prompterLabel.textContent = "階段即將開始";
        els.prompterMove.textContent = "等待 HUD";
        els.prompterSeconds.textContent = visibleCountdown(remain);
        els.prompterUnit.textContent = "秒";
        els.prompterFollowing.innerHTML = "";
        return;
      }
      if (!state.activePhase) {
        panel.dataset.urgency = "idle";
        const expectedLabel = phaseDisplayLabel(expectedPhase());
        els.prompterPhase.textContent = `等待 ${expectedLabel} 過場`;
        els.prompterPhaseTime.textContent = "--:--.---";
        els.prompterLabel.textContent = "下一階段";
        els.prompterMove.textContent = expectedPhase() === "-" ? "已停止" : `等待 ${expectedLabel}`;
        els.prompterSeconds.textContent = "--";
        els.prompterUnit.textContent = "秒";
        els.prompterFollowing.innerHTML = "";
        return;
      }

      const elapsed = Math.max(0, (now - state.phaseStartMs) / 1000);
      els.prompterPhase.textContent = `${phaseDisplayLabel(state.activePhase)} 進行中`;
      els.prompterPhaseTime.textContent = fmt(elapsed);
      if (state.currentCue && now < state.currentCueUntilMs) {
        panel.dataset.urgency = "now";
        els.prompterLabel.textContent = "現在";
        els.prompterMove.textContent = state.currentCue.text || "-";
        els.prompterSeconds.textContent = "現在";
        els.prompterUnit.textContent = "";
      } else {
        state.currentCue = null;
        const cue = state.activeCues[state.cueIndex];
        if (!cue) {
          panel.dataset.urgency = "idle";
          els.prompterLabel.textContent = "本階段";
          els.prompterMove.textContent = "提示已播完";
          els.prompterSeconds.textContent = "--";
          els.prompterUnit.textContent = "";
        } else {
          const remain = Math.max(0, effectiveScheduledS(cue) - elapsed);
          panel.dataset.urgency = remain <= 3 ? "critical" : remain <= 7 ? "soon" : "ready";
          els.prompterLabel.textContent = "下一招";
          els.prompterMove.textContent = cue.text || "-";
          els.prompterSeconds.textContent = visibleCountdown(remain);
          els.prompterUnit.textContent = "秒";
        }
      }

      const followingStart = panel.dataset.urgency === "now" ? state.cueIndex : state.cueIndex + 1;
      const following = state.activeCues.slice(followingStart, followingStart + 2);
      els.prompterFollowing.innerHTML = following.map((cue) => {
        const remain = Math.max(0, effectiveScheduledS(cue) - elapsed);
        return `<div class="followingCue"><strong>${visibleCountdown(remain)}s</strong><span>${escapeHtml(cue.text || "-")}</span></div>`;
      }).join("");
    }

    function effectiveScheduledS(cue) {
      return Math.max(0, Number(cue.scheduled_s || 0) - state.extraLeadS);
    }

    function cueKey(cue) {
      return `${timelineCueKey(cue)}:${cue.text}:${cue.scheduled_s}`;
    }

    function expectedPhase() {
      return PHASE_ORDER[state.expectedIndex] || "-";
    }

    function advanceExpectedPhase(phase) {
      const index = PHASE_ORDER.indexOf(phase);
      if (index < 0) return;
      if (state.bossId === "seren") {
        state.expectedIndex = phase === "S_P1"
          ? PHASE_ORDER.indexOf("S_NOON")
          : index === PHASE_ORDER.length - 1
            ? PHASE_ORDER.indexOf("S_NOON")
            : index + 1;
        return;
      }
      state.expectedIndex = Math.max(state.expectedIndex, index + 1);
    }

    function renderPhaseCards() {
      els.phaseCards.innerHTML = PHASE_ORDER.map((phase) => {
        const count = (state.timelineByPhase[phase] || []).length;
        const played = [...state.playedKeys].filter((key) => key.startsWith(`${phase}:`)).length;
        const active = phase === state.activePhase ? "active" : "";
        const detected = state.visitedPhases.has(phase) && phase !== state.activePhase ? "detected" : "";
        return `<div class="phaseCard ${active} ${detected}">
          <strong>${phaseDisplayLabel(phase)}</strong>
          <span>${played}/${count} 句</span>
          <span>${phase === state.activePhase ? fmt((performance.now() - state.phaseStartMs) / 1000) : detected ? "已經過" : "等待"}</span>
        </div>`;
      }).join("");
    }

    function renderTimeline() {
      if (!state.activePhase) {
        els.timeline.innerHTML = `<div class="cueRow"><span>-</span><span>-</span><span class="muted">等待階段開始</span></div>`;
        return;
      }
      els.timeline.innerHTML = state.activeCues.map((cue, index) => {
        const key = cueKey(cue);
        const played = state.playedKeys.has(key) ? "played" : "";
        const next = index === state.cueIndex ? "next" : "";
        return `<div class="cueRow ${played} ${next}">
          <span>${phaseDisplayLabel(cue.phase, cueTimelineVariant(cue))}#${cue.cue_index}</span>
          <span>${fmt(effectiveScheduledS(cue))}</span>
          <span>${escapeHtml(cue.text || "")}</span>
        </div>`;
      }).join("");
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, (ch) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;",
      }[ch]));
    }

    function resetRun() {
      stopAllAudio();
      state.expectedIndex = 0;
      state.activePhase = "";
      state.phaseStartMs = 0;
      state.activeCues = [];
      state.cueIndex = 0;
      state.playedKeys = new Set();
      state.visitedPhases = new Set();
      state.pending = null;
      state.confirm = null;
      state.currentCue = null;
      state.currentCueUntilMs = 0;
      resetP1HudFallback();
      resetTransitionFallback();
      resetSerenDetection();
      state.lastScanTelemetryMs = 0;
      state.contentRectLock = null;
      state.lastWideSearchMs = 0;
      setText("status", `等待 ${phaseDisplayLabel(PHASE_ORDER[0])} 過場`, "ok");
      setText("phase", "-");
      setText("phaseTime", "--:--.---");
      setText("expected", phaseDisplayLabel(PHASE_ORDER[0]));
      setText("score", "-");
      setText("hud", "-");
      els.calloutNow.textContent = "現在：-";
      els.calloutNext.textContent = "下一句：-";
      renderPhaseCards();
      renderTimeline();
      postEvent({ event_type: "reset", phase: "" });
      log(`重置：等待 ${phaseDisplayLabel(PHASE_ORDER[0])} 過場`, "warnText");
    }

    function stopAllAudio() {
      for (const source of state.playingSources) {
        try { source.stop(); } catch (_) {}
      }
      state.playingSources = [];
      for (const audio of state.fallbackAudios) {
        try {
          audio.pause();
          audio.currentTime = 0;
        } catch (_) {}
      }
      state.fallbackAudios = [];
      try { window.speechSynthesis?.cancel(); } catch (_) {}
    }

    function stopSource() {
      const hadSource = Boolean(state.running || state.stream || els.video.currentSrc || els.video.srcObject);
      const stoppedPhase = state.activePhase;
      stopAllAudio();
      if (state.stream) {
        for (const track of state.stream.getTracks()) track.stop();
        state.stream = null;
      }
      els.video.pause();
      els.video.removeAttribute("src");
      els.video.srcObject = null;
      els.video.load();
      els.video.controls = false;
      state.running = false;
      state.selfTesting = false;
      state.sourceMode = "";
      state.activePhase = "";
      state.phaseStartMs = 0;
      state.activeCues = [];
      state.cueIndex = 0;
      state.pending = null;
      state.confirm = null;
      state.currentCue = null;
      state.currentCueUntilMs = 0;
      state.visitedPhases = new Set();
      resetP1HudFallback();
      resetTransitionFallback();
      resetSerenDetection();
      state.contentRectLock = null;
      state.lastWideSearchMs = 0;
      state.expectedIndex = PHASE_ORDER.length;
      setText("status", "已停止", "warnText");
      setText("phase", "-");
      setText("phaseTime", "--:--.---");
      setText("expected", "-");
      setText("score", "-");
      setText("hud", "-");
      setText("capture", "-");
      els.calloutNow.textContent = "現在：-";
      els.calloutNext.textContent = "下一句：-";
      els.placeholder.style.display = "flex";
      renderPhaseCards();
      renderTimeline();
      if (hadSource) {
        postEvent({ event_type: "stop", phase: stoppedPhase || "" });
        log("停止來源與語音", "warnText");
      }
    }

    function uniqueAudioCues() {
      const seen = new Set();
      const cues = [];
      for (const cue of state.assets?.timeline || []) {
        if (!cue.enabled || cue.deleted || !cue.clip_url || seen.has(cue.clip_url)) continue;
        seen.add(cue.clip_url);
        cues.push(cue);
      }
      return cues;
    }

    function ensureAudioContext() {
      if (!state.audioContext) {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        state.audioContext = new AudioCtx();
        state.audioGain = state.audioContext.createGain();
        state.audioGain.gain.value = state.volume;
        state.audioGain.connect(state.audioContext.destination);
      }
      return state.audioContext;
    }

    async function unlockAudio(timeoutMs = 800) {
      const audioContext = ensureAudioContext();
      if (audioContext.state !== "running") {
        await Promise.race([
          audioContext.resume().catch(() => {}),
          new Promise((resolve) => window.setTimeout(resolve, timeoutMs)),
        ]);
      }
      if (audioContext.state !== "running") return false;
      const source = state.audioContext.createBufferSource();
      source.buffer = state.audioContext.createBuffer(1, 1, 22050);
      source.connect(state.audioGain);
      source.start();
      return true;
    }

    function updateAudioStatus() {
      if (!state.assets) {
        setText("audio", "-");
        return;
      }
      if (state.audioMuted) setText("audio", "靜音", "warnText");
      else if (state.audioReady) setText("audio", `${state.audioLoaded}/${state.audioTotal}`, "ok");
      else if (state.audioLoading) setText("audio", `${state.audioLoaded}/${state.audioTotal}`, "warnText");
      else setText("audio", "未載入", "warnText");
    }

    async function preloadAudio() {
      if (state.audioLoading || state.audioReady || !state.assets) return;
      ensureAudioContext();
      const cues = uniqueAudioCues();
      state.audioTotal = cues.length;
      state.audioLoaded = 0;
      state.audioLoading = true;
      updateAudioStatus();
      for (const cue of cues) {
        try {
          const response = await fetch(staticAssetUrl(cue.clip_url), { cache: "force-cache" });
          if (!response.ok) throw new Error(response.statusText);
          const bytes = await response.arrayBuffer();
          const buffer = await state.audioContext.decodeAudioData(bytes.slice(0));
          state.audioBuffers.set(cue.clip_url, buffer);
          state.audioLoaded += 1;
          updateAudioStatus();
        } catch (error) {
          log(`語音載入失敗 ${cue.text}: ${error.message}`, "badText");
        }
      }
      state.audioLoading = false;
      state.audioReady = state.audioLoaded > 0;
      updateAudioStatus();
      log(`語音載入完成 ${state.audioLoaded}/${state.audioTotal}`, state.audioReady ? "ok" : "badText");
      postEvent({ event_type: "audio_ready", audio_cache_ready: state.audioLoaded, audio_cache_total: state.audioTotal });
    }

    function preferredChineseVoice() {
      const voices = window.speechSynthesis?.getVoices?.() || [];
      const preferredName = /(HsiaoChen|HsiaoYu|Mei-Jia|Xiaoxiao|曉臻|曉雨|美佳|Google.*(國語|中文))/i;
      return voices.find((voice) => /^zh-TW$/i.test(voice.lang) && preferredName.test(voice.name))
        || voices.find((voice) => /^zh-TW$/i.test(voice.lang))
        || voices.find((voice) => /^zh/i.test(voice.lang) && preferredName.test(voice.name))
        || voices.find((voice) => /^zh/i.test(voice.lang))
        || null;
    }

    function cueSpeechText(cue) {
      const explicit = String(cue.tts_text || "").trim();
      if (explicit) return explicit;
      const displayText = String(cue.text || "").trim();
      return displayText === "地刺" ? "第刺" : displayText;
    }

    let nativeAudioBridgeSequence = 0;

    function sendAudioManifestToNativeBridge() {
      const bridge = window.chrome?.webview;
      if (!bridge || typeof bridge.postMessage !== "function") return false;
      bridge.postMessage({
        type: "msm-boss-audio-manifest",
        version: 1,
        clip_urls: uniqueAudioCues().map((cue) => staticAssetUrl(cue.clip_url)),
      });
      return true;
    }

    function sendCueToNativeAudioBridge(cue) {
      const bridge = window.chrome?.webview;
      if (!bridge || typeof bridge.postMessage !== "function" || !cue.clip_url) return false;
      bridge.postMessage({
        type: "msm-boss-audio-cue",
        version: 1,
        id: `${Date.now()}-${++nativeAudioBridgeSequence}`,
        text: String(cue.text || ""),
        tts_text: cueSpeechText(cue),
        clip_url: staticAssetUrl(cue.clip_url),
        volume: Number(state.volume || 1),
      });
      return true;
    }

    function speakCueText(cue, shouldStart) {
      if (!window.speechSynthesis || !window.SpeechSynthesisUtterance || !shouldStart()) return false;
      const utterance = new SpeechSynthesisUtterance(cueSpeechText(cue));
      const voice = preferredChineseVoice();
      if (voice) utterance.voice = voice;
      utterance.lang = voice?.lang || "zh-TW";
      utterance.rate = 1.06;
      utterance.pitch = 1.08;
      utterance.volume = state.volume;
      window.speechSynthesis.speak(utterance);
      return true;
    }

    async function playCueAudio(cue, { ignoreMuted = false, shouldStart = () => true } = {}) {
      if ((state.audioMuted && !ignoreMuted) || !shouldStart()) return false;
      if (!cue.clip_url) return speakCueText(cue, shouldStart);
      sendCueToNativeAudioBridge(cue);
      try {
        const webAudioReady = await unlockAudio();
        if ((state.audioMuted && !ignoreMuted) || !shouldStart()) return false;
        const buffer = state.audioBuffers.get(cue.clip_url);
        if (buffer && webAudioReady) {
          state.audioGain.gain.value = state.volume;
          const source = state.audioContext.createBufferSource();
          source.buffer = buffer;
          source.connect(state.audioGain);
          state.playingSources.push(source);
          source.onended = () => {
            state.playingSources = state.playingSources.filter((item) => item !== source);
          };
          source.start();
        } else {
          const audio = new Audio(staticAssetUrl(cue.clip_url));
          audio.volume = state.volume;
          state.fallbackAudios.push(audio);
          audio.onended = () => {
            state.fallbackAudios = state.fallbackAudios.filter((item) => item !== audio);
          };
          await audio.play();
        }
        return true;
      } catch (error) {
        log(`播放失敗 ${cue.text}: ${error.message}`, "badText");
        return false;
      }
    }

    async function playCue(cue, elapsed, late, force = false) {
      const key = cueKey(cue);
      if (!force && state.playedKeys.has(key)) return;
      if (!force) state.playedKeys.add(key);
      state.currentCue = cue;
      state.currentCueUntilMs = performance.now() + Math.max(1800, Number(cue.duration_s || 0) * 1000);
      els.calloutNow.textContent = `現在：${cue.text}`;
      log(`播報 ${cue.phase}#${cue.cue_index} ${cue.text} late=${late.toFixed(3)}s`, late > 0.35 ? "warnText" : "ok");
      postEvent({
        event_type: "callout_play",
        phase: cue.phase,
        cue_index: cue.cue_index,
        text: cue.text,
        scheduled_phase_s: Number(effectiveScheduledS(cue).toFixed(3)),
        base_scheduled_phase_s: Number(cue.scheduled_s || 0),
        elapsed_phase_s: Number(elapsed.toFixed(3)),
        late_s: Number(late.toFixed(3)),
        lead_s: Number(cue.lead_s || 0),
        extra_lead_s: Number(state.extraLeadS.toFixed(3)),
        clip_path: cue.clip_path || "",
      });
      if (state.audioMuted && !force) {
        renderPhaseCards();
        renderTimeline();
        return;
      }
      await playCueAudio(cue, { ignoreMuted: force });
      renderPhaseCards();
      renderTimeline();
    }

    async function testVoice() {
      const cue = state.assets?.timeline?.find((item) =>
        cueBossId(item) === state.bossId && item.enabled && !item.deleted);
      if (!cue) {
        log("沒有可用語音", "badText");
        return;
      }
      if (!state.audioReady) preloadAudio().catch((error) => log(`語音預載失敗：${error.message}`, "badText"));
      await playCue({ ...cue, phase: "TEST", cue_index: 0, scheduled_s: 0 }, 0, 0, true);
    }

    function fitProfileContentRect(video, locked = null) {
      const profile = state.assets?.profile || { width: 2880, height: 1440 };
      const vw = video.videoWidth || 0;
      const vh = video.videoHeight || 0;
      if (!vw || !vh) return { left: 0, top: 0, width: 0, height: 0 };
      if (locked && locked.sourceWidth === vw && locked.sourceHeight === vh) {
        return { left: locked.left, top: locked.top, width: locked.width, height: locked.height };
      }
      const expected = Number(profile.width || 2880) / Math.max(1, Number(profile.height || 1440));
      let width = vw;
      let height = Math.round(width / expected);
      if (height > vh) {
        height = vh;
        width = Math.round(height * expected);
      }
      return {
        left: Math.max(0, Math.round((vw - width) / 2)),
        top: Math.max(0, Math.round((vh - height) / 2)),
        width: Math.max(1, width),
        height: Math.max(1, height),
      };
    }

    function contentRectForProfile() {
      return fitProfileContentRect(els.video, state.contentRectLock);
    }

    function contentRectCandidates() {
      const centered = contentRectForProfile();
      const video = els.video;
      const vw = video.videoWidth || 0;
      const vh = video.videoHeight || 0;
      const lock = state.contentRectLock;
      const hasValidLock = lock && lock.sourceWidth === vw && lock.sourceHeight === vh;
      if (!vw || !vh || hasValidLock) return [centered];
      const excessX = Math.max(0, vw - centered.width);
      const excessY = Math.max(0, vh - centered.height);
      if (!excessX && !excessY) return [centered];

      const candidates = [];
      const seen = new Set();
      const add = (left, top) => {
        const rect = {
          left: Math.max(0, Math.min(excessX, Math.round(left))),
          top: Math.max(0, Math.min(excessY, Math.round(top))),
          width: centered.width,
          height: centered.height,
        };
        const key = `${rect.left}:${rect.top}`;
        if (!seen.has(key)) {
          seen.add(key);
          candidates.push(rect);
        }
      };
      add(centered.left, centered.top);
      if (excessX) {
        const step = Math.max(1, Math.ceil(Math.max(centered.width / 8, excessX / 24)));
        for (let left = 0; left < excessX; left += step) add(left, 0);
        add(excessX, 0);
      } else {
        const step = Math.max(1, Math.ceil(Math.max(centered.height / 8, excessY / 24)));
        for (let top = 0; top < excessY; top += step) add(0, top);
        add(0, excessY);
      }
      return candidates;
    }

    function cropRectForVideo(video, crop, base) {
      const profile = state.assets.profile;
      const left = Math.max(base.left, Math.min(base.left + base.width - 1, Math.round(base.left + base.width * Number(crop.left || 0) / profile.width)));
      const right = Math.max(left + 1, Math.min(base.left + base.width, Math.round(base.left + base.width * Number(crop.right || profile.width) / profile.width)));
      const top = Math.max(base.top, Math.min(base.top + base.height - 1, Math.round(base.top + base.height * Number(crop.top || 0) / profile.height)));
      const bottom = Math.max(top + 1, Math.min(base.top + base.height, Math.round(base.top + base.height * Number(crop.bottom || profile.height) / profile.height)));
      return { left, top, width: right - left, height: bottom - top };
    }

    function cropRect(crop, useContentRect = false, baseOverride = null) {
      const profile = state.assets.profile;
      const video = els.video;
      const base = baseOverride || (useContentRect
        ? contentRectForProfile()
        : { left: 0, top: 0, width: video.videoWidth || profile.width, height: video.videoHeight || profile.height });
      return cropRectForVideo(video, crop, base);
    }

    function standardizeImageData(imageData) {
      const data = imageData.data;
      const len = imageData.width * imageData.height;
      const gray = new Float32Array(len);
      let sum = 0;
      for (let i = 0, j = 0; i < data.length; i += 4, j += 1) {
        const value = 0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2];
        gray[j] = value;
        sum += value;
      }
      const mean = sum / Math.max(1, len);
      let norm = 0;
      for (let i = 0; i < len; i += 1) {
        gray[i] -= mean;
        norm += gray[i] * gray[i];
      }
      norm = Math.sqrt(norm);
      if (norm <= 1e-6) return null;
      for (let i = 0; i < len; i += 1) gray[i] /= norm;
      return gray;
    }

    function imageStats(imageData) {
      const data = imageData.data;
      const width = imageData.width;
      const height = imageData.height;
      const len = width * height;
      const gray = new Float32Array(len);
      let sum = 0;
      for (let i = 0, p = 0; i < data.length; i += 4, p += 1) {
        const value = 0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2];
        gray[p] = value;
        sum += value;
      }
      const mean = sum / Math.max(1, len);
      let variance = 0;
      for (let i = 0; i < len; i += 1) {
        const diff = gray[i] - mean;
        variance += diff * diff;
      }
      let edgeCount = 0;
      for (let y = 1; y < height; y += 1) {
        for (let x = 1; x < width; x += 1) {
          const p = y * width + x;
          const diff = Math.abs(gray[p] - gray[p - 1]) + Math.abs(gray[p] - gray[p - width]);
          if (diff > 55) edgeCount += 1;
        }
      }
      return { std: Math.sqrt(variance / Math.max(1, len)), edge: edgeCount / Math.max(1, len) };
    }

    function dot(a, b) {
      let total = 0;
      for (let i = 0; i < a.length; i += 1) total += a[i] * b[i];
      return total;
    }

    function prepareFrameVectorForVideo(video, baseRect = null) {
      const detector = state.assets.detector;
      const base = baseRect || fitProfileContentRect(video);
      const crop = cropRectForVideo(video, state.assets.profile.matching_crop, base);
      const canvas = els.matchCanvas;
      canvas.width = detector.match_width;
      canvas.height = detector.match_height;
      const ctx = canvas.getContext("2d", { willReadFrequently: true });
      ctx.drawImage(video, crop.left, crop.top, crop.width, crop.height, 0, 0, canvas.width, canvas.height);
      return standardizeImageData(ctx.getImageData(0, 0, canvas.width, canvas.height));
    }

    function prepareFrameVector(baseRect = null) {
      return prepareFrameVectorForVideo(els.video, baseRect || contentRectForProfile());
    }

    function editorTemplateMatches(phases = PHASE_ORDER) {
      const video = editorDetectionVideo();
      const vector = prepareFrameVectorForVideo(video, fitProfileContentRect(video));
      const matches = {};
      if (!vector) return matches;
      for (const phase of phases) {
        let best = null;
        for (const template of state.templatesByPhase[phase] || []) {
          const score = dot(template.vector, vector);
          if (!best || score > best.score) {
            best = { ...template, phase, score };
          }
        }
        if (best) matches[phase] = best;
      }
      return matches;
    }

    function matchExpectedPhase() {
      const phase = expectedPhase();
      const templates = state.templatesByPhase[phase] || [];
      if (!templates.length || phase === "-") return null;
      let best = null;
      const candidates = contentRectCandidates();
      const scoredRects = new Set();
      const scoreContentRect = (contentRect) => {
        const key = `${contentRect.left}:${contentRect.top}`;
        if (scoredRects.has(key)) return;
        scoredRects.add(key);
        const vector = prepareFrameVector(contentRect);
        if (!vector) return;
        for (const template of templates) {
          const score = dot(template.vector, vector);
          if (!best || score > best.score) best = { ...template, score, contentRect };
        }
      };
      for (const contentRect of candidates) scoreContentRect(contentRect);

      if (best && candidates.length > 1 && best.score >= 0.55) {
        const horizontal = els.video.videoWidth > best.contentRect.width;
        const maxOffset = horizontal
          ? els.video.videoWidth - best.contentRect.width
          : els.video.videoHeight - best.contentRect.height;
        const basePosition = horizontal ? best.contentRect.left : best.contentRect.top;
        const size = horizontal ? best.contentRect.width : best.contentRect.height;
        for (const divisor of [16, 32, 64]) {
          const delta = Math.max(1, Math.round(size / divisor));
          for (const direction of [-1, 1]) {
            const position = Math.max(0, Math.min(maxOffset, basePosition + direction * delta));
            scoreContentRect({
              left: horizontal ? position : best.contentRect.left,
              top: horizontal ? best.contentRect.top : position,
              width: best.contentRect.width,
              height: best.contentRect.height,
            });
          }
        }
      }
      if (best && candidates.length > 1 && best.score >= state.threshold) {
        state.contentRectLock = {
          ...best.contentRect,
          sourceWidth: els.video.videoWidth,
          sourceHeight: els.video.videoHeight,
        };
        log(`已定位遊戲畫面 ${best.contentRect.width}x${best.contentRect.height} @ ${best.contentRect.left},${best.contentRect.top}`, "ok");
        postEvent({
          event_type: "content_region_locked",
          phase,
          score: Number(best.score.toFixed(6)),
          template: best.name,
          capture_width: els.video.videoWidth,
          capture_height: els.video.videoHeight,
          content_left: best.contentRect.left,
          content_top: best.contentRect.top,
          content_width: best.contentRect.width,
          content_height: best.contentRect.height,
        });
      }
      return best;
    }

    function rgbToHsv(r, g, b) {
      r /= 255; g /= 255; b /= 255;
      const max = Math.max(r, g, b);
      const min = Math.min(r, g, b);
      const diff = max - min;
      let h = 0;
      if (diff !== 0) {
        if (max === r) h = ((g - b) / diff) % 6;
        else if (max === g) h = (b - r) / diff + 2;
        else h = (r - g) / diff + 4;
        h *= 60;
        if (h < 0) h += 360;
      }
      const s = max === 0 ? 0 : diff / max;
      return [h, s * 255, max * 255];
    }

    function regionMetricsForVideo(video, kind, baseRect) {
      const profile = state.assets.profile;
      const crops = {
        hud: { left: 1960, top: 1160, right: 2875, bottom: 1438 },
        player: { left: 0, top: 0, right: 760, bottom: 300 },
        boss: { left: profile.width * 0.28, top: 0, right: profile.width * 0.72, bottom: profile.height * 0.12 },
        timer: { left: 1430, top: 90, right: 1615, bottom: 190 },
        stage: { left: 700, top: 300, right: 2250, bottom: 1050 },
        serenBanner: {
          left: profile.width * 0.30,
          top: profile.height * 0.20,
          right: profile.width * 0.70,
          bottom: profile.height * 0.38,
        },
        serenWheel: {
          left: profile.width * 0.84,
          top: profile.height * 0.035,
          right: profile.width * 0.94,
          bottom: profile.height * 0.22,
        },
      };
      const crop = crops[kind] || crops.stage;
      const rect = cropRectForVideo(video, crop, baseRect);
      const width = 220;
      const height = Math.max(1, Math.round(width * rect.height / rect.width));
      const canvas = els.metricCanvas;
      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext("2d", { willReadFrequently: true });
      ctx.drawImage(video, rect.left, rect.top, rect.width, rect.height, 0, 0, width, height);
      const img = ctx.getImageData(0, 0, width, height);
      const data = img.data;
      const gray = new Float32Array(width * height);
      let colorCount = 0;
      let neutralCount = 0;
      let brightCount = 0;
      let pureWhiteCount = 0;
      let darkCount = 0;
      let redCount = 0;
      let goldCount = 0;
      let graySum = 0;
      for (let i = 0, p = 0; i < data.length; i += 4, p += 1) {
        const r = data[i], g = data[i + 1], b = data[i + 2];
        const [h, s, v] = rgbToHsv(r, g, b);
        if (kind === "boss") {
          if ((h <= 16 || h >= 340) && s >= 80 && v >= 80) colorCount += 1;
        } else if (s > 45 && v > 50) {
          colorCount += 1;
        }
        if (s < 70 && v > 145) neutralCount += 1;
        if (v > 155) brightCount += 1;
        if (s < 50 && v > 220) pureWhiteCount += 1;
        if (v < 110) darkCount += 1;
        if ((h <= 16 || h >= 340) && s >= 80 && v >= 80) redCount += 1;
        if (h >= 16 && h <= 75 && s >= 70 && v >= 100) goldCount += 1;
        gray[p] = 0.299 * r + 0.587 * g + 0.114 * b;
        graySum += gray[p];
      }
      let edgeCount = 0;
      const edgeThreshold = kind === "serenWheel" ? 14 : 55;
      for (let y = 1; y < height; y += 1) {
        for (let x = 1; x < width; x += 1) {
          const p = y * width + x;
          const diff = Math.abs(gray[p] - gray[p - 1]) + Math.abs(gray[p] - gray[p - width]);
          if (diff > edgeThreshold) edgeCount += 1;
        }
      }
      const count = Math.max(1, width * height);
      return {
        color: colorCount / count,
        neutral: neutralCount / count,
        bright: brightCount / count,
        pureWhite: pureWhiteCount / count,
        dark: darkCount / count,
        red: redCount / count,
        gold: goldCount / count,
        edge: edgeCount / count,
        mean: graySum / count,
      };
    }

    function regionMetrics(kind) {
      return regionMetricsForVideo(els.video, kind, contentRectForProfile());
    }

    function readHudVisible() {
      if (!state.assets || els.video.readyState < 2) return { visible: false, color: 0, edge: 0 };
      const metrics = regionMetrics("hud");
      const cfg = state.assets.detector.hud_visible || {};
      const visible = metrics.color >= Number(cfg.skill_color_threshold || 0.15)
        && metrics.edge >= Number(cfg.skill_edge_threshold || 0.05);
      setText("hud", `${visible ? "可見" : "等待"} ${metrics.color.toFixed(2)}/${metrics.edge.toFixed(2)}`, visible ? "ok" : "warnText");
      return { visible, ...metrics };
    }

    function readPlayerUiVisible() {
      if (!state.assets || els.video.readyState < 2) return { visible: false, color: 0, edge: 0 };
      const metrics = regionMetrics("player");
      const cfg = state.assets.detector.player_ui_visible || {};
      const visible = metrics.color >= Number(cfg.color_threshold || 0.10)
        && metrics.edge >= Number(cfg.edge_threshold || 0.045);
      return { visible, ...metrics };
    }

    function readCountdownVisible() {
      if (!state.assets || els.video.readyState < 2) return { visible: false, neutral: 0, edge: 0 };
      const metrics = regionMetrics("timer");
      const visible = metrics.neutral >= 0.05
        && metrics.neutral <= 0.65
        && metrics.mean >= 40
        && metrics.mean <= 170;
      return { visible, ...metrics };
    }

    function readStageState() {
      if (!state.assets || els.video.readyState < 2) return { dark: false, white: false, mean: 0, neutral: 0 };
      const metrics = regionMetrics("stage");
      return {
        ...metrics,
        dark: metrics.mean <= 25,
        white: metrics.mean >= 145 && metrics.neutral >= 0.45,
      };
    }

    function readBossHpVisible() {
      if (!state.assets || els.video.readyState < 2) return { visible: false, color: 0, edge: 0 };
      const metrics = regionMetrics("boss");
      const cfg = state.assets.detector.boss_hp_visible || {};
      const visible = metrics.color >= Number(cfg.red_threshold || 0.008)
        && metrics.edge >= Number(cfg.edge_threshold || 0.02);
