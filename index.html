      return { visible, ...metrics };
    }

    function readSerenWheelVisible() {
      if (!state.assets || els.video.readyState < 2) return { visible: false, edge: 0, red: 0 };
      const metrics = regionMetrics("serenWheel");
      return {
        ...metrics,
        visible: metrics.edge >= 0.058 && metrics.red >= 0.003,
      };
    }

    function readSerenFormTransition() {
      if (!state.assets || els.video.readyState < 2) {
        return { visible: false, pureWhite: 0, bannerDark: 0 };
      }
      const stage = regionMetrics("stage");
      const banner = regionMetrics("serenBanner");
      const hud = readHudVisible();
      return {
        visible: hud.edge >= 0.06
          && hud.color >= 0.10
          && stage.pureWhite >= 0.58
          && banner.dark >= 0.18,
        pureWhite: stage.pureWhite,
        bannerDark: banner.dark,
        hud,
        stage,
        banner,
      };
    }

    function resetP1HudFallback() {
      state.p1HudFallback = { hiddenSinceMs: 0, lastHiddenMs: 0, visibleCount: 0, firstVisibleMs: 0 };
    }

    function resetTransitionFallback(phase = "") {
      state.transitionFallback = {
        phase,
        hiddenSinceMs: 0,
        lastHiddenMs: 0,
        bestScore: 0,
        visibleCount: 0,
        firstVisibleMs: 0,
        whiteCount: 0,
      };
    }

    function resetSerenDetection() {
      state.serenDetection = {
        structureHiddenSinceMs: 0,
        structureHiddenLastMs: 0,
        visibleCount: 0,
        firstVisibleMs: 0,
        wheelCount: 0,
        firstWheelMs: 0,
        whiteCount: 0,
        firstWhiteMs: 0,
        whiteLastMs: 0,
        whiteLatched: false,
        lastTransitionMs: 0,
      };
    }

    function updateSerenDetection(now) {
      const detection = state.serenDetection;
      const hud = readHudVisible();
      const player = readPlayerUiVisible();
      const structureAbsent = hud.edge < 0.025 && player.edge < 0.035;

      if (!state.activePhase) {
        if (structureAbsent) {
          if (!detection.structureHiddenSinceMs) detection.structureHiddenSinceMs = now;
          detection.structureHiddenLastMs = now;
          detection.visibleCount = 0;
          detection.firstVisibleMs = 0;
        } else if (detection.structureHiddenSinceMs
            && detection.structureHiddenLastMs - detection.structureHiddenSinceMs >= 1500
            && hud.visible) {
          if (!detection.visibleCount) detection.firstVisibleMs = now;
          detection.visibleCount += 1;
          if (detection.visibleCount >= 3 && now - detection.firstVisibleMs >= 180) {
            const startMs = detection.firstVisibleMs;
            startPhase("S_P1", startMs, "auto_seren_hud_return");
            resetSerenDetection();
          }
        } else if (!hud.visible) {
          detection.visibleCount = 0;
          detection.firstVisibleMs = 0;
        }
        setText("score", `HUD ${hud.edge.toFixed(3)}`, hud.visible ? "ok" : "");
        return;
      }

      if (state.activePhase === "S_P1") {
        if (structureAbsent) {
          if (!detection.structureHiddenSinceMs) detection.structureHiddenSinceMs = now;
          detection.structureHiddenLastMs = now;
          detection.visibleCount = 0;
          detection.firstVisibleMs = 0;
          detection.wheelCount = 0;
          detection.firstWheelMs = 0;
        } else if (detection.structureHiddenSinceMs
            && detection.structureHiddenLastMs - detection.structureHiddenSinceMs >= 3000
            && hud.visible) {
          if (!detection.visibleCount) detection.firstVisibleMs = now;
          detection.visibleCount += 1;
          const wheel = readSerenWheelVisible();
          if (wheel.visible) {
            if (!detection.wheelCount) detection.firstWheelMs = now;
            detection.wheelCount += 1;
          } else {
            detection.wheelCount = 0;
            detection.firstWheelMs = 0;
          }
          const wheelConfirmed = detection.wheelCount >= 2 && now - detection.firstWheelMs >= 80;
          const wheelFallback = detection.visibleCount >= 20 && now - detection.firstVisibleMs >= 1900;
          setText(
            "score",
            `轉輪 ${wheel.edge.toFixed(3)}/${wheel.red.toFixed(3)}`,
            wheel.visible ? "ok" : "",
          );
          if (wheelConfirmed || wheelFallback) {
            const startMs = wheelConfirmed
              ? detection.firstWheelMs
              : detection.firstVisibleMs + 1500;
            startPhase("S_NOON", startMs, wheelConfirmed ? "auto_seren_wheel" : "auto_seren_wheel_fallback");
            resetSerenDetection();
          }
        }
        return;
      }

      const transition = readSerenFormTransition();
      if (transition.visible && now - detection.lastTransitionMs >= 8000) {
        if (!detection.whiteCount) detection.firstWhiteMs = now;
        detection.whiteCount += 1;
        detection.whiteLastMs = now;
        if (!detection.whiteLatched
            && detection.whiteCount >= 3
            && now - detection.firstWhiteMs >= 180) {
          const nextPhase = expectedPhase();
          if (nextPhase !== "-" && nextPhase !== "S_P1") {
            const startMs = detection.firstWhiteMs;
            detection.whiteLatched = true;
            detection.lastTransitionMs = now;
            startPhase(nextPhase, startMs, "auto_seren_white_transition");
          }
        }
      } else if (!transition.visible && now - detection.whiteLastMs >= 350) {
        detection.whiteCount = 0;
        detection.firstWhiteMs = 0;
        detection.whiteLatched = false;
      }
      setText(
        "score",
        `轉場 ${transition.pureWhite.toFixed(2)}/${transition.bannerDark.toFixed(2)}`,
        transition.visible ? "ok" : "",
      );
    }

    function updateP1HudFallback(now, best) {
      if (expectedPhase() !== "P1" || state.activePhase || state.pending) {
        resetP1HudFallback();
        return;
      }
      const hud = readHudVisible();
      const player = readPlayerUiVisible();
      const fallback = state.p1HudFallback;
      const uiStructureAbsent = hud.edge < 0.025 && player.edge < 0.035;
      if (uiStructureAbsent) {
        if (!fallback.hiddenSinceMs) fallback.hiddenSinceMs = now;
        fallback.lastHiddenMs = now;
        fallback.visibleCount = 0;
        fallback.firstVisibleMs = 0;
      } else if (fallback.hiddenSinceMs && fallback.lastHiddenMs
        && fallback.lastHiddenMs - fallback.hiddenSinceMs >= 2800
        && hud.visible) {
        if (!fallback.visibleCount) fallback.firstVisibleMs = now;
        fallback.visibleCount += 1;
        const visibleStableMs = now - fallback.firstVisibleMs;
        if (fallback.visibleCount >= 3 && visibleStableMs >= 280) {
          const startMs = fallback.firstVisibleMs || now;
          postEvent({
            event_type: "p1_hud_fallback",
            phase: "P1",
            best_score: Number(best?.score?.toFixed(6) || 0),
            hud_color: Number(hud.color.toFixed(4)),
            hud_edge: Number(hud.edge.toFixed(4)),
            player_ui_edge: Number(player.edge.toFixed(4)),
          });
          resetP1HudFallback();
          startPhase("P1", startMs, "auto_ui_structure_to_hud");
        }
      } else if (fallback.lastHiddenMs && now - fallback.lastHiddenMs > 1200) {
        resetP1HudFallback();
      } else if (!hud.visible) {
        fallback.visibleCount = 0;
        fallback.firstVisibleMs = 0;
      }

      if (now - state.lastScanTelemetryMs >= 5000) {
        state.lastScanTelemetryMs = now;
        postEvent({
          event_type: "scan_status",
          phase: "P1",
          expected_phase: expectedPhase(),
          best_score: Number(best?.score?.toFixed(6) || 0),
          template: best?.name || "",
          capture_width: els.video.videoWidth || 0,
          capture_height: els.video.videoHeight || 0,
          content_left: contentRectForProfile().left,
          content_top: contentRectForProfile().top,
          content_locked: Boolean(state.contentRectLock),
          hud_visible: hud.visible,
          player_ui_visible: player.visible,
          fallback_armed: Boolean(fallback.hiddenSinceMs
            && fallback.lastHiddenMs - fallback.hiddenSinceMs >= 2800),
        });
      }
    }

    function updatePhaseTransitionFallback(now, best) {
      const phase = expectedPhase();
      if (!state.activePhase || state.pending || !["P2", "P3", "P4"].includes(phase)) {
        resetTransitionFallback();
        return;
      }
      if (state.transitionFallback.phase !== phase) resetTransitionFallback(phase);

      const fallback = state.transitionFallback;
      const hud = readHudVisible();
      const player = readPlayerUiVisible();
      const timer = readCountdownVisible();
      const boss = readBossHpVisible();
      const stage = readStageState();
      fallback.bestScore = Math.max(fallback.bestScore, Number(best?.score || 0));

      const uiStructureAbsent = hud.edge < 0.025 && player.edge < 0.035;
      if (uiStructureAbsent) {
        if (!fallback.hiddenSinceMs) fallback.hiddenSinceMs = now;
        fallback.lastHiddenMs = now;
        fallback.visibleCount = 0;
        fallback.firstVisibleMs = 0;
        fallback.whiteCount = 0;
      } else if (fallback.hiddenSinceMs && fallback.lastHiddenMs) {
        const hiddenDurationMs = fallback.lastHiddenMs - fallback.hiddenSinceMs;
        const minimumHiddenMs = phase === "P4" ? 450 : 1800;
        if (hiddenDurationMs >= minimumHiddenMs && hud.visible) {
          if (!fallback.visibleCount) fallback.firstVisibleMs = now;
          fallback.visibleCount += 1;
          if (phase === "P4" && stage.white) fallback.whiteCount += 1;
          const visibleStableMs = now - fallback.firstVisibleMs;
          const confirmed = fallback.visibleCount >= 3
            && visibleStableMs >= 280
            && (phase !== "P4" || fallback.whiteCount >= 3);
          if (confirmed) {
            const startMs = fallback.firstVisibleMs || now;
            postEvent({
              event_type: "phase_multi_signal_fallback",
              phase,
              mode: phase === "P4" ? "ui_structure_to_white_hud" : "ui_structure_to_hud",
              best_score: Number(fallback.bestScore.toFixed(6)),
              hidden_duration_ms: Number(hiddenDurationMs.toFixed(1)),
              hud_visible: hud.visible,
              player_ui_visible: player.visible,
              timer_visible: timer.visible,
              boss_hp_visible: boss.visible,
              stage_mean: Number(stage.mean.toFixed(3)),
            });
            state.confirm = null;
            resetTransitionFallback();
            startPhase(phase, startMs, phase === "P4" ? "auto_white_hud_return" : "auto_hud_return");
            return;
          }
        } else if (now - fallback.lastHiddenMs > 1200) {
          resetTransitionFallback(phase);
        }
      } else {
        fallback.visibleCount = 0;
        fallback.firstVisibleMs = 0;
        fallback.whiteCount = 0;
      }

      if (now - state.lastScanTelemetryMs >= 5000) {
        state.lastScanTelemetryMs = now;
        postEvent({
          event_type: "scan_status",
          phase: state.activePhase,
          expected_phase: phase,
          best_score: Number(best?.score?.toFixed(6) || 0),
          template: best?.name || "",
          hud_visible: hud.visible,
          player_ui_visible: player.visible,
          timer_visible: timer.visible,
          boss_hp_visible: boss.visible,
          stage_dark: stage.dark,
          stage_white: stage.white,
          fallback_armed: Boolean(fallback.hiddenSinceMs && fallback.lastHiddenMs
            && fallback.lastHiddenMs - fallback.hiddenSinceMs >= (phase === "P4" ? 450 : 1800)),
        });
      }
    }

    function updateCaptureText() {
      const video = els.video;
      if (!video.videoWidth || !video.videoHeight) {
        setText("capture", "-");
        return;
      }
      const time = state.sourceMode === "baseline" || state.sourceMode === "selftest"
        ? ` @ ${fmt(video.currentTime)}`
        : "";
      const content = contentRectForProfile();
      const crop = content.width === video.videoWidth && content.height === video.videoHeight
        ? ""
        : ` -> ${content.width}x${content.height} @ ${content.left},${content.top}`;
      setText("capture", `${video.videoWidth}x${video.videoHeight}${crop}${time}`, "ok");
    }

    async function loadImage(url) {
      const img = new Image();
      img.decoding = "async";
      img.src = staticAssetUrl(url);
      await img.decode();
      return img;
    }

    function staticAssetUrl(path) {
      const value = String(path || "").trim();
      if (!value || /^(?:https?:|blob:|data:)/i.test(value)) return value;
      return new URL(value.replace(/^\/+/, ""), STATIC_ASSET_BASE_URL).href;
    }

    async function loadTemplates() {
      const detector = state.assets.detector;
      const canvas = els.templateCanvas;
      canvas.width = detector.match_width;
      canvas.height = detector.match_height;
      const ctx = canvas.getContext("2d", { willReadFrequently: true });
      let count = 0;
      for (const phase of BOSS_PROFILES.black_mage.phases) {
        state.templatesByPhase[phase] = [];
        for (const item of state.assets.phases[phase]?.templates || []) {
          if (item.usable === false) continue;
          const img = await loadImage(item.url);
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
          const stats = imageStats(imageData);
          const vector = standardizeImageData(imageData);
          if (!vector) continue;
          state.templatesByPhase[phase].push({ ...item, vector, browserStd: stats.std, browserEdge: stats.edge });
          count += 1;
        }
      }
      return count;
    }

    async function loadAssets() {
      setText("status", "載入資料");
      const response = await fetch(staticAssetUrl("web-live-assets.json"), { cache: "no-store" });
      const data = await response.json();
      if (!response.ok || data.ok === false) throw new Error(data.error || response.statusText);
      if (IS_GITHUB_PAGES && data.baseline_replay) {
        data.baseline_replay = { ...data.baseline_replay, available: false, url: "" };
      }
      expandTimelineVariants(data);
      state.assets = data;
      state.baseTimeline = (data.timeline || []).map((cue) => ({ ...cue }));
      try {
        const publishedChanges = await loadPublishedTimelineChanges();
        const publishedCount = applyPublishedTimelineChanges(data, publishedChanges);
        if (publishedCount) log(`已載入正式時間軸調整 ${publishedCount} 則`, "ok");
      } catch (error) {
        log(`正式時間軸同步失敗，使用內建版本：${error.message}`, "badText");
      }
      state.baseTimeline = (data.timeline || []).map((cue) => ({ ...cue }));
      applyStoredTimelineChanges(data);
      appendStoredCustomCues(data);
      sendAudioManifestToNativeBridge();
      editorState.customSkillTexts = new Set(readStoredCustomSkills());
      state.p1HasShia = localStorage.getItem(P1_VARIANT_KEY) !== "false";
      editorState.p1HasShia = state.p1HasShia;
      editorState.bossId = state.bossId;
      PHASE_ORDER = [...activeBossProfile().phases];
      renderBossChrome();
      const initialEditorYoutube = initialEditorUrlForBoss();
      els.editorYoutubeInput.value = initialEditorYoutube;
      initializeEditorData(data);
      loadEditorYoutube(els.editorYoutubeInput.value).catch((error) => {
        els.editorPhaseStatus.textContent = `YouTube 載入失敗：${error.message}`;
      });
      rebuildTimelineByPhase();
      const count = await loadTemplates();
      const thresholdOverride = Number(new URLSearchParams(location.search).get("threshold"));
      state.threshold = Number.isFinite(thresholdOverride) && thresholdOverride >= 0.7
        ? thresholdOverride
        : Number(localStorage.getItem("blackMageWeb2Threshold") || 0.84);
      state.extraLeadS = Number(localStorage.getItem("blackMageWeb2ExtraLeadS") || 0);
      state.volume = Number(localStorage.getItem("blackMageWeb2Volume") || 1);
      state.audioMuted = localStorage.getItem("blackMageWeb2Muted") === "true";
      editorState.voiceEnabled = localStorage.getItem("blackMageEditorVoiceEnabled") !== "false";
      els.thresholdInput.value = state.threshold.toFixed(2);
      els.leadInput.value = state.extraLeadS.toFixed(1);
      els.volumeInput.value = Math.round(state.volume * 100);
      els.muteInput.checked = state.audioMuted;
      els.p1ShiaInput.checked = state.p1HasShia;
      els.editorP1ShiaInput.checked = editorState.p1HasShia;
      els.editorVoiceInput.checked = editorState.voiceEnabled;
      els.volumeText.textContent = `${Math.round(state.volume * 100)}%`;
      setText("status", `等待 ${phaseDisplayLabel(PHASE_ORDER[0])} 過場`, "ok");
      els.topStatus.textContent = `${activeBossProfile().name} · 模板 ${count}，語音 ${selectedTimelineCueCount()} 句`;
      renderPhaseCards();
      renderTimeline();
      updateAudioStatus();
      startTicker();
      log(`載入完成：模板 ${count}，提示 ${selectedTimelineCueCount()} 句`, "ok");
    }

    function startTicker() {
      if (state.raf) cancelAnimationFrame(state.raf);
      const tick = (now) => {
        if (state.pending) updatePending(now);
        if (state.activePhase) updateScheduler(now);
        if (state.running) {
          if (now - state.lastScanMs >= 100) {
            state.lastScanMs = now;
            scan(now);
          }
          updateCaptureText();
        }
        updateTimerText(now);
        updatePrompter(now);
        updateEditorPlayback();
        renderPhaseCards();
        state.raf = requestAnimationFrame(tick);
      };
      state.raf = requestAnimationFrame(tick);
    }

    function videoReady() {
      return els.video.readyState >= 2 && els.video.videoWidth > 0 && els.video.videoHeight > 0;
    }

    function scan(now) {
      if (!state.assets || !videoReady()) return;
      if (activeBossProfile().detector === "seren") {
        updateSerenDetection(now);
        return;
      }
      if (state.pending || expectedPhase() === "-") return;
      if (!state.contentRectLock && contentRectCandidates().length > 1) {
        if (now - state.lastWideSearchMs < 200) return;
        state.lastWideSearchMs = now;
      }
      let best = null;
      try {
        best = matchExpectedPhase();
      } catch (error) {
        log(`畫面讀取失敗：${error.message}`, "badText");
        return;
      }
      if (best) {
        setText("score", `${best.phase} ${best.score.toFixed(3)}`, best.score >= state.threshold ? "ok" : "");
        const threshold = state.threshold;
        if (best.score >= threshold) {
          if (!state.confirm || state.confirm.phase !== best.phase) {
            state.confirm = { phase: best.phase, count: 1, best, bestMs: now };
          } else {
            state.confirm.count += 1;
            if (best.score > state.confirm.best.score) {
              state.confirm.best = best;
              state.confirm.bestMs = now;
            }
          }
          if (state.confirm.count >= 3) {
            const confirmed = state.confirm;
            state.confirm = null;
            handleDetection(confirmed.best, confirmed.bestMs);
          }
        } else {
          state.confirm = null;
        }
      } else {
        state.confirm = null;
      }
      updateP1HudFallback(now, best);
      updatePhaseTransitionFallback(now, best);
    }

    function handleDetection(best, detectedMs) {
      resetTransitionFallback();
      const phase = best.phase;
      const phaseConfig = state.assets.phases[phase] || {};
      const cutsceneStartMs = detectedMs - Number(best.offset_seconds || 0) * 1000;
      const hudMs = cutsceneStartMs + Number(phaseConfig.start_to_hud_visible_ms || 0);
      state.pending = {
        phase,
        hudMs,
        detectedMs,
        score: best.score,
        template: best.name,
        startedWaitMs: performance.now(),
      };
      state.expectedIndex = Math.max(state.expectedIndex, PHASE_ORDER.indexOf(phase) + 1);
      setText("status", `${phase} 過場已抓到`, "warnText");
      log(`${phase} 過場：${best.score.toFixed(3)}，等待 HUD 起算`, "ok");
      postEvent({
        event_type: "cutscene_detected",
        phase,
        score: Number(best.score.toFixed(6)),
        template: best.name,
        offset_seconds: Number(best.offset_seconds || 0),
        hud_starts_in: Number(((hudMs - performance.now()) / 1000).toFixed(3)),
      });
    }

    function updatePending(now) {
      const pending = state.pending;
      if (!pending) return;
      const remain = (pending.hudMs - now) / 1000;
      if (remain > 0) {
        setText("status", `${pending.phase} 過場 ${remain.toFixed(1)}s`, "warnText");
        return;
      }
      const hud = readHudVisible();
      if (hud.visible) {
        startPhase(pending.phase, now, "auto_hud");
        return;
      }
      const waited = now - pending.hudMs;
      if (waited >= 1200) {
        startPhase(pending.phase, now, "auto_estimate_after_wait");
      }
    }

    function startPhase(phase, startMs, reason = "manual") {
      resetP1HudFallback();
      resetTransitionFallback();
      for (const key of [...state.playedKeys]) {
        if (key.startsWith(`${phase}:`)) state.playedKeys.delete(key);
      }
      state.activePhase = phase;
      state.visitedPhases.add(phase);
      state.phaseStartMs = startMs;
      state.pending = null;
      state.activeCues = [...(state.timelineByPhase[phase] || [])]
        .sort((a, b) => effectiveScheduledS(a) - effectiveScheduledS(b) || Number(a.cue_index || 0) - Number(b.cue_index || 0));
      state.cueIndex = 0;
      advanceExpectedPhase(phase);
      state.currentCue = null;
      state.currentCueUntilMs = 0;
      const phaseLabel = phaseDisplayLabel(phase);
      setText("phase", phaseLabel, "ok");
      setText("status", `${phaseLabel} 計時中`, "ok");
      log(`${phaseLabel} 開始計時 (${reason})`, "ok");
      postEvent({
        event_type: "phase_start",
        phase,
        timeline_variant: liveTimelineVariant(phase),
        reason,
        enabled_cue_count: state.activeCues.length,
      });
      updateNextCallout(performance.now());
      renderTimeline();
    }

    function manualStart(phase) {
      startPhase(phase, performance.now(), "manual");
    }

    function updateScheduler(now) {
      if (!state.activePhase || !state.activeCues.length) return;
      const elapsed = (now - state.phaseStartMs) / 1000;
      const lateSkipS = Number(state.assets?.callouts?.late_skip_ms || 800) / 1000;
      while (state.cueIndex < state.activeCues.length) {
        const cue = state.activeCues[state.cueIndex];
        const scheduled = effectiveScheduledS(cue);
        if (elapsed + 0.03 < scheduled) break;
        const late = elapsed - scheduled;
        state.cueIndex += 1;
        if (late <= lateSkipS || scheduled === 0) {
          playCue(cue, elapsed, late);
        } else {
          log(`略過過期提示 ${cue.phase}#${cue.cue_index} ${cue.text} late=${late.toFixed(3)}s`, "warnText");
          postEvent({
            event_type: "callout_skip_late",
            phase: cue.phase,
            cue_index: cue.cue_index,
            text: cue.text,
            scheduled_phase_s: Number(scheduled.toFixed(3)),
            elapsed_phase_s: Number(elapsed.toFixed(3)),
            late_s: Number(late.toFixed(3)),
          });
        }
      }
      updateNextCallout(now);
    }

    function updateNextCallout(now) {
      if (!state.activePhase) {
        els.calloutNext.textContent = "下一句：-";
        return;
      }
      const cue = state.activeCues[state.cueIndex];
      if (!cue) {
        els.calloutNext.textContent = "下一句：本階段提示已播完";
        return;
      }
      const elapsed = (now - state.phaseStartMs) / 1000;
      const remain = Math.max(0, effectiveScheduledS(cue) - elapsed);
      els.calloutNext.textContent = `下一句：${remain.toFixed(1)}s ${cue.phase}#${cue.cue_index} ${cue.text}`;
    }

    function updateTimerText(now) {
      if (state.activePhase) {
        setText("phaseTime", fmt((now - state.phaseStartMs) / 1000), "ok");
        updateNextCallout(now);
      }
      setText("expected", expectedPhase() === "-" ? "-" : phaseDisplayLabel(expectedPhase()));
    }

    async function waitForVideoReady() {
      if (videoReady()) return;
      await new Promise((resolve, reject) => {
        const timer = window.setTimeout(() => reject(new Error("影片來源沒有畫面")), 6000);
        const finish = () => {
          window.clearTimeout(timer);
          resolve();
        };
        const fail = () => {
          window.clearTimeout(timer);
          reject(new Error("影片來源載入失敗"));
        };
        els.video.addEventListener("loadeddata", finish, { once: true });
        els.video.addEventListener("error", fail, { once: true });
      });
    }

    function startAudioLoading() {
      unlockAudio().catch((error) => log(`語音初始化失敗：${error.message}`, "badText"));
      preloadAudio().catch((error) => log(`語音預載失敗：${error.message}`, "badText"));
    }

    function primeAudioFromGesture() {
      try {
        const audioContext = ensureAudioContext();
        if (audioContext.state !== "running") audioContext.resume().catch(() => {});
      } catch (_) {}
    }

    async function startShare() {
      try {
        stopSource();
        startAudioLoading();
        const streamPromise = navigator.mediaDevices.getDisplayMedia({
          video: { frameRate: { ideal: 30, max: 60 } },
          audio: false,
        });
        const stream = await streamPromise;
        state.stream = stream;
        state.sourceMode = "screen";
        els.video.srcObject = stream;
        els.video.muted = true;
        els.video.controls = false;
        els.video.autoplay = true;
        await waitForVideoReady();
        await els.video.play();
        state.running = true;
        els.placeholder.style.display = "none";
        resetRun();
        setText("status", `等待 ${phaseDisplayLabel(PHASE_ORDER[0])} 過場`, "ok");
        log("畫面分享已開始", "ok");
        postEvent({ event_type: "screen_share_start", phase: "" });
        stream.getVideoTracks()[0]?.addEventListener("ended", () => {
          stopSource();
        });
      } catch (error) {
        setText("status", "分享失敗", "badText");
        log(`分享畫面失敗：${error.message}`, "badText");
      }
    }

    async function startBaseline() {
      try {
        const replay = activeBaselineReplay();
        if (!replay?.available || !replay.url) throw new Error("這個王沒有本機基準影片");
        stopSource();
        startAudioLoading();
        state.sourceMode = "baseline";
        els.video.srcObject = null;
        els.video.src = replay.url;
        els.video.muted = false;
        els.video.controls = true;
        els.video.autoplay = true;
        els.video.load();
        await waitForVideoReady();
        resetRun();
        state.running = true;
        els.placeholder.style.display = "none";
        try {
          await els.video.play();
        } catch (_) {
          els.video.muted = true;
          await els.video.play();
          log("瀏覽器阻擋影片原音，已改為靜音播放；提示語音仍會播放", "warnText");
        }
        log("基準影片測試開始", "ok");
        postEvent({ event_type: "baseline_start", phase: "" });
      } catch (error) {
        setText("status", "影片失敗", "badText");
        log(`基準影片失敗：${error.message}`, "badText");
      }
    }

    async function seekVideo(seconds) {
      const target = Math.max(0, Math.min(Number(seconds || 0), Math.max(0, els.video.duration - 0.05)));
      if (Math.abs(els.video.currentTime - target) < 0.002) return;
      await new Promise((resolve, reject) => {
        const timer = window.setTimeout(() => reject(new Error(`跳轉影片逾時 ${target.toFixed(3)}s`)), 5000);
        const done = () => {
          window.clearTimeout(timer);
          resolve();
        };
        els.video.addEventListener("seeked", done, { once: true });
        els.video.currentTime = target;
      });
      await new Promise((resolve) => requestAnimationFrame(() => requestAnimationFrame(resolve)));
    }

    async function runSelfTest() {
      try {
        if (state.bossId !== "black_mage") throw new Error("此自測僅供黑魔法師使用");
        const replay = activeBaselineReplay();
        stopSource();
        state.sourceMode = "selftest";
        state.selfTesting = true;
        els.video.srcObject = null;
        els.video.src = replay.url;
        els.video.muted = true;
        els.video.controls = false;
        els.video.load();
        await waitForVideoReady();
        els.placeholder.style.display = "none";
        setText("status", "快速自測中", "warnText");
        const results = [];
        for (let index = 0; index < PHASE_ORDER.length; index += 1) {
          const phase = PHASE_ORDER[index];
          const hint = replay?.phase_hints?.[phase] || {};
          const probeS = Number(hint.matched_video_s || (Number(hint.cutscene_start_s || 0) + 2));
          state.expectedIndex = index;
          await seekVideo(probeS);
          const best = matchExpectedPhase();
          const hudProbeS = Number(hint.gate_start_s || hint.estimated_hud_s || probeS);
          await seekVideo(hudProbeS);
          const hud = readHudVisible();
          const passed = Boolean(best && best.phase === phase && best.score >= state.threshold && hud.visible);
          const result = {
            phase,
            probeS,
            hudProbeS,
            score: best?.score || -1,
            template: best?.name || "-",
            hudVisible: hud.visible,
            hudColor: hud.color,
            hudEdge: hud.edge,
            passed,
          };
          results.push(result);
          setText("score", `${phase} ${result.score.toFixed(3)}`, passed ? "ok" : "badText");
          log(
            `自測 ${phase}：過場 ${result.score.toFixed(3)}，HUD ${hud.visible ? "通過" : "失敗"} ${hud.color.toFixed(2)}/${hud.edge.toFixed(2)}`,
            passed ? "ok" : "badText",
          );
        }
        const passedCount = results.filter((item) => item.passed).length;
        state.expectedIndex = 0;
        state.selfTesting = false;
        await seekVideo(0.001);
        setText("expected", "P1");
        setText("status", `自測 ${passedCount}/4 ${passedCount === 4 ? "通過" : "失敗"}`, passedCount === 4 ? "ok" : "badText");
        els.topStatus.textContent = results.map((item) => `${item.phase} ${item.score.toFixed(3)}`).join(" | ");
        postEvent({ event_type: "browser_self_test", phase: "", passed: passedCount, results });
      } catch (error) {
        state.selfTesting = false;
        setText("status", "自測失敗", "badText");
        log(`快速自測失敗：${error.message}`, "badText");
      }
    }

    function editorCueKey(cue) {
      return timelineCueKey(cue);
    }

    function editorCueByKey(key) {
      return editorState.cues.find((cue) => editorCueKey(cue) === key) || null;
    }

    function replaceEditorSelection(key = "") {
      editorState.selectedKey = key;
      editorState.selectedKeys = new Set(key ? [key] : []);
    }

    function normalizeEditorSelection() {
      const validKeys = new Set(editorPhaseCues().map((cue) => editorCueKey(cue)));
      editorState.selectedKeys = new Set(
        [...editorState.selectedKeys].filter((key) => validKeys.has(key)),
      );
      if (!editorState.selectedKeys.has(editorState.selectedKey)) {
        editorState.selectedKey = [...editorState.selectedKeys][0] || "";
      }
      if (editorState.selectedKey && !editorState.selectedKeys.size) {
        editorState.selectedKeys.add(editorState.selectedKey);
      }
    }

    function selectedEditorCues() {
      normalizeEditorSelection();
      return editorPhaseCues().filter((cue) => editorState.selectedKeys.has(editorCueKey(cue)));
    }

    function toggleEditorCueSelection(key) {
      const cue = editorCueByKey(key);
      if (!cue
          || cueBossId(cue) !== editorState.bossId
          || cue.phase !== editorState.phase
          || cueTimelineVariant(cue) !== editorTimelineVariant()) return;
      if (editorState.selectedKeys.has(key)) {
        editorState.selectedKeys.delete(key);
        if (editorState.selectedKey === key) {
          const next = editorPhaseCues().find((item) => editorState.selectedKeys.has(editorCueKey(item)));
          editorState.selectedKey = next ? editorCueKey(next) : "";
        }
      } else {
        editorState.selectedKeys.add(key);
        editorState.selectedKey = key;
      }
    }

    function multiSelectModifier(event) {
      return Boolean(event.ctrlKey || event.metaKey);
    }

    function editorPhaseCues() {
      return editorState.cues
        .filter((cue) => cueBossId(cue) === editorState.bossId
          && cue.phase === editorState.phase
          && cueTimelineVariant(cue) === editorTimelineVariant()
          && !cue.deleted)
        .sort((a, b) => Number(a.start_s || 0) - Number(b.start_s || 0) || Number(a.cue_index || 0) - Number(b.cue_index || 0));
    }

    function editorScheduledS(cue) {
      return Math.max(0, Number(cue.start_s || 0) + Number(cue.offset_s || 0) - Number(cue.lead_s || 0));
    }

    function initializeEditorData(data, preserveAlignment = false) {
      const previousPhase = editorState.phase;
      const previousSelected = editorState.selectedKey;
      const previousHudTimes = { ...editorState.hudTimes };
      editorState.cues = (data.timeline || []).map((cue) => ({ ...cue }));
      editorState.originalByKey = new Map(editorState.cues.map((cue) => [editorCueKey(cue), {
        text: String(cue.text || ""),
        start_s: Number(cue.start_s || 0),
        lead_s: Number(cue.lead_s || 0),
        enabled: Boolean(cue.enabled),
        deleted: Boolean(cue.deleted),
        custom: Boolean(cue.custom),
      }]));
      editorState.dirtyKeys = new Set();
      editorState.voicePlayedKeys = new Set();
      editorState.voiceArmedKey = "";
      editorState.voiceArmedAtS = Number.NaN;
      editorState.playbackCueKey = "";
      editorState.playbackPhase = "";
      editorState.phase = PHASE_ORDER.includes(previousPhase) ? previousPhase : PHASE_ORDER[0];
      editorState.hudTimes = {};
      for (const phase of PHASE_ORDER) {
        if (preserveAlignment && Number.isFinite(previousHudTimes[phase])) {
          editorState.hudTimes[phase] = previousHudTimes[phase];
        }
      }
      const previousCue = editorCueByKey(previousSelected);
      const selectedKey = previousCue
          && cueBossId(previousCue) === editorState.bossId
          && previousCue.phase === editorState.phase
          && cueTimelineVariant(previousCue) === editorTimelineVariant()
        ? previousSelected
        : editorCueKey(editorPhaseCues()[0] || {
          phase: editorState.phase,
          timeline_variant: editorTimelineVariant(),
          cue_index: 0,
        });
      replaceEditorSelection(selectedKey);
      renderEditor();
    }

    function setAppMode(mode) {
      const editing = mode === "editor";
      document.body.classList.toggle("editor-mode", editing);
      document.body.classList.remove("focus-prompter");
      els.prompterFocusBtn.textContent = "專注提詞";
      els.liveModeBtn.classList.toggle("active", !editing);
      els.editorModeBtn.classList.toggle("active", editing);
      els.liveModeBtn.setAttribute("aria-selected", String(!editing));
      els.editorModeBtn.setAttribute("aria-selected", String(editing));
      if (editing) {
        if (state.running || state.stream || state.activePhase || state.pending || els.video.currentSrc) stopSource();
        if (!editorHasSource()) {
          loadEditorYoutube(els.editorYoutubeInput.value).catch((error) => {
            els.editorPhaseStatus.textContent = `YouTube 載入失敗：${error.message}`;
          });
        } else if (editorUsesYoutube() && !editorUsesBaselineYoutube()
          && Object.keys(editorState.hudTimes).length !== PHASE_ORDER.length) {
          editorState.autoDetectAfterYoutubeReady = true;
          requestEditorYoutubeCapture();
          if (editorState.youtubeReady) {
            autoDetectEditorPhases().catch((error) => {
              els.editorPhaseStatus.textContent = `偵測失敗：${error.message}`;
            });
          }
        }
        if (editorState.voiceEnabled) startAudioLoading();
        renderEditor();
      } else {
        editorPause();
        if (!state.running && !state.activePhase) resetRun();
      }
    }

    function togglePrompterFocus() {
      const focused = document.body.classList.toggle("focus-prompter");
      els.prompterFocusBtn.textContent = focused ? "退出專注" : "專注提詞";
    }

    function parseYoutubeVideoId(value) {
      let raw = String(value || "").trim();
      if (!raw) return "";
      const iframeSource = raw.match(/\bsrc=["']([^"']+)["']/i);
      if (iframeSource) raw = iframeSource[1];
      if (/^[A-Za-z0-9_-]{11}$/.test(raw)) return raw;
      if (!/^[a-z][a-z0-9+.-]*:\/\//i.test(raw)) raw = `https://${raw}`;
      try {
        const url = new URL(raw);
        const host = url.hostname.toLowerCase().replace(/^www\./, "");
        let id = "";
        if (host === "youtu.be") {
          id = url.pathname.split("/").filter(Boolean)[0] || "";
        } else if (host === "youtube.com" || host.endsWith(".youtube.com") || host === "youtube-nocookie.com") {
          if (url.pathname === "/watch") id = url.searchParams.get("v") || "";
          if (!id) {
            const match = url.pathname.match(/^\/(?:embed|live|shorts|v)\/([A-Za-z0-9_-]{11})(?:\/|$)/);
            id = match?.[1] || "";
          }
        }
        return /^[A-Za-z0-9_-]{11}$/.test(id) ? id : "";
      } catch (_) {
        return "";
      }
    }

    function loadYoutubeIframeApi() {
      if (window.YT?.Player) return Promise.resolve(window.YT);
      if (editorState.youtubeApiPromise) return editorState.youtubeApiPromise;
      editorState.youtubeApiPromise = new Promise((resolve, reject) => {
        const previousReady = window.onYouTubeIframeAPIReady;
        const timeoutId = window.setTimeout(() => {
          editorState.youtubeApiPromise = null;
          reject(new Error("YouTube 播放器載入逾時"));
        }, 15000);
        window.onYouTubeIframeAPIReady = () => {
          window.clearTimeout(timeoutId);
          if (typeof previousReady === "function") previousReady();
          resolve(window.YT);
        };
        let script = document.querySelector('script[src="https://www.youtube.com/iframe_api"]');
        if (!script) {
          script = document.createElement("script");
          script.src = "https://www.youtube.com/iframe_api";
          script.async = true;
          script.onerror = () => {
            window.clearTimeout(timeoutId);
            editorState.youtubeApiPromise = null;
            reject(new Error("無法載入 YouTube 播放器"));
          };
          document.head.appendChild(script);
        }
      });
      return editorState.youtubeApiPromise;
    }

    function editorUsesYoutube() {
      return editorState.sourceMode === "youtube";
    }

    function editorUsesBaselineYoutube() {
      return editorUsesYoutube()
        && editorState.youtubeVideoId === parseYoutubeVideoId(defaultEditorYoutubeUrl());
    }

    function editorHasSource() {
      if (editorUsesYoutube()) return Boolean(editorState.youtubeVideoId);
      return Boolean(els.editorVideo.currentSrc);
    }

    function editorCurrentTime() {
      if (editorUsesYoutube() && editorState.youtubeReady) {
        try { return Number(editorState.youtubePlayer.getCurrentTime() || 0); } catch (_) { return 0; }
      }
      return Number(els.editorVideo.currentTime || 0);
    }

    function editorDuration() {
      if (editorUsesYoutube() && editorState.youtubeReady) {
        try { return Number(editorState.youtubePlayer.getDuration() || 0); } catch (_) { return 0; }
      }
      return Number(els.editorVideo.duration || 0);
    }

    function editorPaused() {
      if (editorUsesYoutube()) return editorState.youtubeState !== 1;
      return els.editorVideo.paused;
    }

    function editorMuted() {
      if (editorUsesYoutube() && editorState.youtubeReady) {
        try { return Boolean(editorState.youtubePlayer.isMuted()); } catch (_) { return false; }
      }
      return Boolean(els.editorVideo.muted);
    }

    function editorPlaybackRate() {
      if (editorUsesYoutube() && editorState.youtubeReady) {
        try { return Number(editorState.youtubePlayer.getPlaybackRate() || 1); } catch (_) { return 1; }
      }
      return Number(els.editorVideo.playbackRate || 1);
    }

    function editorSetMuted(muted) {
      if (editorUsesYoutube() && editorState.youtubeReady) {
        try {
          if (muted) editorState.youtubePlayer.mute();
          else editorState.youtubePlayer.unMute();
        } catch (_) {}
        return;
      }
      els.editorVideo.muted = Boolean(muted);
    }

    function editorSetPlaybackRate(rate) {
      if (!Number.isFinite(Number(rate))) return;
      if (editorUsesYoutube() && editorState.youtubeReady) {
        try { editorState.youtubePlayer.setPlaybackRate(Number(rate)); } catch (_) {}
        return;
      }
      els.editorVideo.playbackRate = Number(rate);
    }

    function editorPause() {
      if (editorUsesYoutube() && editorState.youtubeReady) {
        try { editorState.youtubePlayer.pauseVideo(); } catch (_) {}
        return;
      }
      els.editorVideo.pause();
    }

    function editorPlay() {
      if (editorUsesYoutube()) {
        if (!editorState.youtubeReady) return Promise.reject(new Error("YouTube 播放器尚未就緒"));
        try {
          editorState.youtubePlayer.playVideo();
          return Promise.resolve();
        } catch (error) {
          return Promise.reject(error);
        }
      }
      return els.editorVideo.play();
    }

    function setEditorSourceSurface(mode) {
      const youtube = mode === "youtube";
      els.editorVideo.hidden = youtube;
      els.editorYoutubeWrap.hidden = !youtube;
    }

    function destroyEditorYoutubePlayer() {
      const player = editorState.youtubePlayer;
      editorState.youtubePlayer = null;
      editorState.youtubeReady = false;
      editorState.youtubeState = -1;
      if (player) {
        try { player.destroy(); } catch (_) {}
      }
      const host = document.createElement("div");
      host.id = "editorYoutubePlayer";
      els.editorYoutubeWrap.replaceChildren(host);
    }

    function stopPendingEditorCapture(except = null) {
      const request = editorState.pendingCaptureRequest;
      if (!request || request === except) return;
      editorState.pendingCaptureRequest = null;
      request.then(({ stream }) => {
        if (stream) for (const track of stream.getTracks()) track.stop();
      });
    }

    function requestEditorDisplayMedia() {
      return navigator.mediaDevices.getDisplayMedia({
        video: { frameRate: { ideal: 30, max: 60 } },
        audio: false,
        preferCurrentTab: true,
        selfBrowserSurface: "include",
        surfaceSwitching: "exclude",
      }).then((stream) => ({ stream, error: null }), (error) => ({ stream: null, error }));
    }

    function requestEditorYoutubeCapture() {
      if (!navigator.mediaDevices?.getDisplayMedia) return null;
      if (editorState.pendingCaptureRequest) return editorState.pendingCaptureRequest;
      els.editorPhaseStatus.textContent = "請選擇分享這個分頁，選取後會自動校正";
      editorState.pendingCaptureRequest = requestEditorDisplayMedia();
      return editorState.pendingCaptureRequest;
    }

    function clearEditorPhaseAnchors(message = "等待偵測階段") {
      editorState.detectionToken += 1;
      editorState.detecting = false;
      editorState.hudTimes = {};
      editorState.phaseMethods = {};
      editorState.voiceArmedKey = "";
      editorState.voiceArmedAtS = Number.NaN;
      editorState.playbackCueKey = "";
      editorState.playbackPhase = "";
      els.editorDetectPhasesBtn.disabled = false;
      els.editorPhaseStatus.textContent = message;
      renderEditor();
    }

    function loadEditorBaseline() {
      const editorUrl = defaultEditorYoutubeUrl();
      localStorage.setItem(editorYoutubeStorageKey(), editorUrl);
      els.editorYoutubeInput.value = editorUrl;
      return loadEditorYoutube(editorUrl).catch((error) => {
        els.editorPhaseStatus.textContent = `YouTube 載入失敗：${error.message}`;
      });
    }

    async function loadEditorYoutube(rawUrl, { autoDetect = false, captureRequest = null } = {}) {
      const videoId = parseYoutubeVideoId(rawUrl);
      if (!videoId) {
        setEditorStatus("YouTube 網址格式不正確", "dirty");
        els.editorPhaseStatus.textContent = "無法辨識 YouTube 影片";
        return;
      }
      stopPendingEditorCapture(captureRequest);
      editorState.pendingCaptureRequest = captureRequest;
      editorState.autoDetectAfterYoutubeReady = Boolean(autoDetect);
      editorPause();
      editorState.sourceMode = "youtube";
      destroyEditorYoutubePlayer();
      els.editorVideo.removeAttribute("src");
      els.editorVideo.load();
      setEditorSourceSurface("youtube");
      editorState.youtubeVideoId = videoId;
      editorState.youtubeUrl = `https://youtu.be/${videoId}`;
      editorState.sourceName = videoId === parseYoutubeVideoId(defaultEditorYoutubeUrl())
        ? activeBaselineReplay()?.name || `YouTube · ${videoId}`
        : `YouTube · ${videoId}`;
      localStorage.setItem(editorYoutubeStorageKey(), editorState.youtubeUrl);
      els.editorYoutubeInput.value = editorState.youtubeUrl;
      els.editorVideoName.textContent = editorState.sourceName;
      clearEditorPhaseAnchors("正在載入 YouTube 播放器");
      els.editorDetectPhasesBtn.disabled = true;
      try {
        const YT = await loadYoutubeIframeApi();
        if (!editorUsesYoutube() || editorState.youtubeVideoId !== videoId) return;
        editorState.youtubePlayer = new YT.Player("editorYoutubePlayer", {
          width: "100%",
          height: "100%",
          videoId,
          playerVars: {
            controls: 1,
            enablejsapi: 1,
            playsinline: 1,
            rel: 0,
            origin: location.origin,
          },
          events: {
            onReady: (event) => {
              if (!editorUsesYoutube() || editorState.youtubeVideoId !== videoId) return;
              editorState.youtubeReady = true;
              editorState.youtubeState = Number(event.target.getPlayerState());
              els.editorDetectPhasesBtn.disabled = false;
              resetEditorVoicePlayback({ stopAudio: true, clearPlayed: true });
              if (editorUsesBaselineYoutube()) {
                editorState.autoDetectAfterYoutubeReady = false;
                applyEditorPhaseAnchors(
                  activeBaselineReplay()?.phase_hints || {},
                  {},
                  "已套用基準 YouTube 校正",
                );
              } else if (editorState.autoDetectAfterYoutubeReady && editorState.pendingCaptureRequest) {
                els.editorPhaseStatus.textContent = "YouTube 已載入，正在自動校正階段";
                autoDetectEditorPhases().catch((error) => {
                  els.editorPhaseStatus.textContent = `偵測失敗：${error.message}`;
                });
              } else {
                els.editorPhaseStatus.textContent = "YouTube 已載入；貼上連結後會自動校正";
                renderEditor();
              }
            },
            onStateChange: (event) => {
              if (!editorUsesYoutube() || editorState.youtubeVideoId !== videoId) return;
              editorState.youtubeState = Number(event.data);
              if (editorState.detecting) return;
              if (event.data === 1) handleEditorVoicePlay();
              else if (event.data === 3) handleEditorVoiceSeeking();
              else if (event.data === 2) handleEditorVoicePause();
              else if (event.data === 0) handleEditorVoiceEnded();
            },
            onError: (event) => {
              if (!editorUsesYoutube() || editorState.youtubeVideoId !== videoId) return;
              els.editorDetectPhasesBtn.disabled = false;
              els.editorPhaseStatus.textContent = `YouTube 播放器錯誤 ${event.data}`;
            },
          },
        });
      } catch (error) {
        if (!editorUsesYoutube() || editorState.youtubeVideoId !== videoId) return;
        els.editorDetectPhasesBtn.disabled = false;
        els.editorPhaseStatus.textContent = error.message;
        setEditorStatus(error.message, "dirty");
      }
    }

    function loadEditorYoutubeFromUserAction(rawUrl) {
      const videoId = parseYoutubeVideoId(rawUrl);
      const baselineId = parseYoutubeVideoId(defaultEditorYoutubeUrl());
      if (videoId && videoId === editorState.youtubeVideoId) {
        if (videoId === baselineId || editorState.detecting
          || Object.keys(editorState.hudTimes).length === PHASE_ORDER.length) {
          return Promise.resolve();
        }
        editorState.autoDetectAfterYoutubeReady = true;
        requestEditorYoutubeCapture();
        return editorState.youtubeReady ? autoDetectEditorPhases() : Promise.resolve();
      }
      const captureRequest = videoId && videoId !== baselineId
        ? requestEditorYoutubeCapture()
        : null;
      return loadEditorYoutube(rawUrl, { autoDetect: true, captureRequest });
    }

    function delay(ms) {
      return new Promise((resolve) => window.setTimeout(resolve, ms));
    }

    function editorDetectionVideo() {
      return editorUsesYoutube() ? els.editorCaptureVideo : els.editorVideo;
    }

    function updateEditorScanProgress(phase, seconds, duration) {
      const text = `畫面偵測 ${phase} · ${fmt(seconds)} / ${fmt(duration)}`;
      els.editorPhaseStatus.textContent = text;
      if (editorUsesYoutube()) document.title = `${phase} ${fmt(seconds)} · 自動校正`;
    }

    async function beginEditorYoutubeCapture(token) {
      if (!navigator.mediaDevices?.getDisplayMedia) {
        throw new Error("此瀏覽器不支援分頁畫面分享");
      }
      editorState.captureEnded = false;
      editorState.titleBeforeScan = document.title;
      document.body.classList.add("youtube-scan-active");
      document.title = `請分享目前分頁 · ${activeBossProfile().name}自動校正`;
      const pendingRequest = editorState.pendingCaptureRequest;
      editorState.pendingCaptureRequest = null;
      const { stream, error } = await (pendingRequest || requestEditorDisplayMedia());
      if (error || !stream) {
        document.body.classList.remove("youtube-scan-active");
        document.title = editorState.titleBeforeScan || appTitle();
        throw new Error(error?.name === "NotAllowedError" ? "未分享目前分頁，無法自動校正" : (error?.message || "無法取得分頁畫面"));
      }
      if (token !== editorState.detectionToken) {
        for (const track of stream.getTracks()) track.stop();
        throw new Error("階段偵測已取消");
      }
      editorState.captureStream = stream;
      const [track] = stream.getVideoTracks();
      if (!track) throw new Error("沒有取得分頁畫面");
      const displaySurface = String(track.getSettings?.().displaySurface || "");
      if (displaySurface && displaySurface !== "browser") {
        throw new Error("請選擇分享「這個分頁」，不要分享整個螢幕或視窗");
      }
      track.addEventListener("ended", () => { editorState.captureEnded = true; }, { once: true });
      els.editorCaptureVideo.srcObject = stream;
      await els.editorCaptureVideo.play();
      const started = performance.now();
      while (els.editorCaptureVideo.readyState < 2 || !els.editorCaptureVideo.videoWidth) {
        if (editorState.captureEnded || token !== editorState.detectionToken) throw new Error("分頁畫面分享已停止");
        if (performance.now() - started > 5000) throw new Error("分頁畫面載入逾時");
        await delay(50);
      }
      await delay(250);
    }

    function endEditorYoutubeCapture() {
      if (editorState.captureStream) {
        for (const track of editorState.captureStream.getTracks()) track.stop();
      }
      editorState.captureStream = null;
      editorState.captureEnded = false;
      els.editorCaptureVideo.pause();
      els.editorCaptureVideo.srcObject = null;
      document.body.classList.remove("youtube-scan-active");
      document.title = editorState.titleBeforeScan || appTitle();
      editorState.titleBeforeScan = "";
    }

    async function waitForEditorYoutubeDuration(token) {
      const started = performance.now();
      while (token === editorState.detectionToken && editorDuration() <= 0) {
        try {
          editorState.youtubePlayer.mute();
          editorState.youtubePlayer.playVideo();
        } catch (_) {}
        if (performance.now() - started > 8000) throw new Error("無法取得 YouTube 影片長度");
        await delay(100);
      }
      editorPause();
      return token === editorState.detectionToken;
    }

    async function primeEditorYoutubeForScan(token) {
      const initialS = editorCurrentTime();
      const started = performance.now();
      try {
        editorState.youtubePlayer.mute();
        editorState.youtubePlayer.playVideo();
      } catch (_) { return; }
      while (token === editorState.detectionToken && performance.now() - started < 3500) {
        if (editorState.captureEnded) return;
        if (editorState.youtubeState === 1 && editorCurrentTime() >= initialS + 0.18) break;
        await delay(50);
      }
      editorPause();
      await delay(180);
    }

    function editorFrameSignals() {
      const video = editorDetectionVideo();
      const base = fitProfileContentRect(video);
      const hud = regionMetricsForVideo(video, "hud", base);
      const player = regionMetricsForVideo(video, "player", base);
      const timer = regionMetricsForVideo(video, "timer", base);
      const boss = regionMetricsForVideo(video, "boss", base);
      const stage = regionMetricsForVideo(video, "stage", base);
      const serenBanner = regionMetricsForVideo(video, "serenBanner", base);
      const serenWheel = regionMetricsForVideo(video, "serenWheel", base);
      const hudCfg = state.assets.detector.hud_visible || {};
      const bossCfg = state.assets.detector.boss_hp_visible || {};
      const hudVisible = hud.color >= Number(hudCfg.skill_color_threshold || 0.15)
        && hud.edge >= Number(hudCfg.skill_edge_threshold || 0.05);
      const timerVisible = timer.neutral >= 0.05
        && timer.neutral <= 0.65
        && timer.mean >= 40
        && timer.mean <= 170;
      const bossVisible = boss.color >= Number(bossCfg.red_threshold || 0.008)
        && boss.edge >= Number(bossCfg.edge_threshold || 0.02);
      const structureAbsent = editorUsesYoutube()
        ? !hudVisible && hud.edge < 0.055
        : hud.edge < 0.025 && player.edge < 0.035;
      return {
        hudVisible,
        timerVisible,
        bossVisible,
        structureAbsent,
        stageWhite: stage.mean >= 145 && stage.neutral >= 0.45,
        serenTransition: hud.edge >= 0.06
          && hud.color >= 0.10
          && stage.pureWhite >= 0.58
          && serenBanner.dark >= 0.18,
        serenWheelVisible: serenWheel.edge >= 0.058 && serenWheel.red >= 0.003,
        hud,
        player,
        timer,
        boss,
        stage,
        serenBanner,
        serenWheel,
      };
    }

    async function seekEditorDetectionFrame(seconds, token) {
      if (token !== editorState.detectionToken) return false;
      if (editorUsesYoutube()) {
        if (!editorState.youtubeReady || editorState.captureEnded) return false;
        const duration = editorDuration();
        const target = Math.max(0, Math.min(Number(seconds || 0), Math.max(0, duration - 0.05)));
        editorPause();
        try { editorState.youtubePlayer.seekTo(target, true); } catch (_) { return false; }
        const started = performance.now();
        let nearSince = 0;
        while (performance.now() - started <= 3000) {
          if (token !== editorState.detectionToken || editorState.captureEnded) return false;
          const current = editorCurrentTime();
          if (Math.abs(current - target) <= 0.8) {
            if (!nearSince) nearSince = performance.now();
            if (performance.now() - nearSince >= 170 && els.editorCaptureVideo.readyState >= 2) return true;
          } else {
            nearSince = 0;
          }
          await delay(35);
        }
        return false;
      }
      const video = els.editorVideo;
      const duration = Number(video.duration || 0);
      const target = Math.max(0, Math.min(Number(seconds || 0), Math.max(0, duration - 0.01)));
      if (video.readyState >= 2 && Math.abs(Number(video.currentTime || 0) - target) < 0.006) {
        await new Promise((resolve) => requestAnimationFrame(resolve));
        return token === editorState.detectionToken;
      }
      return new Promise((resolve) => {
        let timerId = 0;
        const finish = (ok) => {
          window.clearTimeout(timerId);
          video.removeEventListener("seeked", onSeeked);
          video.removeEventListener("error", onError);
          resolve(Boolean(ok && token === editorState.detectionToken));
        };
        const onSeeked = () => finish(true);
        const onError = () => finish(false);
        timerId = window.setTimeout(() => finish(false), 2500);
        video.addEventListener("seeked", onSeeked, { once: true });
        video.addEventListener("error", onError, { once: true });
        video.currentTime = target;
      });
    }

    async function refineEditorYoutubePhaseAnchor(phase, startS, endS, token) {
      const start = Math.max(0, Number(startS || 0));
      const end = Math.max(start, Number(endS || start));
      if (!await seekEditorDetectionFrame(start, token)) return null;
      let sawStructureAbsent = false;
      let firstStructureReturnS = null;
      let firstHudS = null;
      let firstWhiteS = null;
      let lastSampleS = Number.NaN;
      let lastProgressAt = performance.now();
      editorSetPlaybackRate(1);
      try { editorState.youtubePlayer.playVideo(); } catch (_) { return null; }
      try {
        const deadline = performance.now() + Math.max(7000, (end - start + 4) * 1400);
        while (performance.now() < deadline) {
          if (token !== editorState.detectionToken || editorState.captureEnded) return null;
          await delay(32);
          const seconds = editorCurrentTime();
          if (!Number.isFinite(seconds)) continue;
          if (!Number.isFinite(lastSampleS) || seconds > lastSampleS + 0.012) {
            lastProgressAt = performance.now();
          } else if (performance.now() - lastProgressAt > 2500) {
            return null;
          }
          if (Number.isFinite(lastSampleS) && Math.abs(seconds - lastSampleS) < 0.025) continue;
          lastSampleS = seconds;
          if (seconds < start - 0.2) continue;
          if (seconds > end + 0.08) return null;
          const signals = editorFrameSignals();
          if (signals.structureAbsent) {
            sawStructureAbsent = true;
            firstStructureReturnS = null;
            firstHudS = null;
            firstWhiteS = null;
            continue;
          }
          if (sawStructureAbsent && firstStructureReturnS === null) firstStructureReturnS = seconds;
          if (sawStructureAbsent && signals.hudVisible) {
            if (firstHudS === null) firstHudS = seconds;
            if (phase === "P4" && signals.stageWhite && firstWhiteS === null) firstWhiteS = seconds;
            if (phase === "P4" && !signals.stageWhite) firstWhiteS = null;
            const hudStable = seconds - firstHudS >= 0.24;
            const phaseConfirmed = phase !== "P4"
              || (firstWhiteS !== null && seconds - firstWhiteS >= 0.12);
            if (hudStable && phaseConfirmed) {
              return Number(firstHudS.toFixed(3));
            }
          } else if (sawStructureAbsent) {
            firstHudS = null;
            firstWhiteS = null;
          }
        }
      } finally {
        editorPause();
      }
      return null;
    }

    async function refineEditorPhaseAnchor(phase, startS, endS, token) {
      if (editorUsesYoutube()) {
        return refineEditorYoutubePhaseAnchor(phase, startS, endS, token);
      }
      let sawStructureAbsent = false;
      let firstStructureReturnS = null;
      let firstHudS = null;
      let hudCount = 0;
      let whiteCount = 0;
      for (let seconds = Math.max(0, startS); seconds <= endS + 0.0001; seconds += 0.04) {
        if (!await seekEditorDetectionFrame(seconds, token)) return null;
        const signals = editorFrameSignals();
        if (signals.structureAbsent) {
          sawStructureAbsent = true;
          firstStructureReturnS = null;
          firstHudS = null;
          hudCount = 0;
          whiteCount = 0;
          continue;
        }
        if (sawStructureAbsent && firstStructureReturnS === null) {
          firstStructureReturnS = seconds;
        }
        if (sawStructureAbsent && signals.hudVisible) {
          if (firstHudS === null) firstHudS = seconds;
          hudCount += 1;
          if (phase === "P4" && signals.stageWhite) whiteCount += 1;
          const phaseConfirmed = phase !== "P4" || whiteCount >= 3;
          if (hudCount >= 3 && seconds - firstHudS >= 0.28 && phaseConfirmed) {
            return Number(firstHudS.toFixed(3));
          }
        } else if (sawStructureAbsent && !signals.hudVisible) {
          firstHudS = null;
          hudCount = 0;
          whiteCount = 0;
        }
      }
      return null;
    }

    async function refineEditorSerenAnchor(kind, startS, endS, token) {
      const start = Math.max(0, Number(startS || 0));
      const end = Math.max(start, Number(endS || start));
      let sawStructureAbsent = false;
      let firstMatchS = null;
      let matchCount = 0;
      const consume = (seconds, signals) => {
        if (signals.structureAbsent) sawStructureAbsent = true;
        const matched = kind === "hud"
          ? sawStructureAbsent && signals.hudVisible
          : kind === "wheel"
            ? sawStructureAbsent && signals.hudVisible && signals.serenWheelVisible
            : signals.serenTransition;
        if (!matched) {
          firstMatchS = null;
          matchCount = 0;
          return null;
        }
        if (firstMatchS === null) firstMatchS = seconds;
        matchCount += 1;
        const stableS = kind === "form" ? 0.18 : 0.10;
        return matchCount >= 3 && seconds - firstMatchS >= stableS
          ? Number(firstMatchS.toFixed(3))
          : null;
      };

      if (editorUsesYoutube()) {
        if (!await seekEditorDetectionFrame(start, token)) return null;
        let lastSampleS = Number.NaN;
        let lastProgressAt = performance.now();
        editorSetPlaybackRate(1);
        try { editorState.youtubePlayer.playVideo(); } catch (_) { return null; }
        try {
          const deadline = performance.now() + Math.max(7000, (end - start + 4) * 1400);
          while (performance.now() < deadline) {
            if (token !== editorState.detectionToken || editorState.captureEnded) return null;
            await delay(32);
            const seconds = editorCurrentTime();
            if (!Number.isFinite(seconds)) continue;
            if (!Number.isFinite(lastSampleS) || seconds > lastSampleS + 0.012) {
              lastProgressAt = performance.now();
            } else if (performance.now() - lastProgressAt > 2500) {
              return null;
            }
            if (Number.isFinite(lastSampleS) && Math.abs(seconds - lastSampleS) < 0.025) continue;
            lastSampleS = seconds;
            if (seconds < start - 0.2) continue;
            if (seconds > end + 0.08) return null;
            const result = consume(seconds, editorFrameSignals());
            if (result !== null) return result;
          }
        } finally {
          editorPause();
        }
        return null;
      }

      for (let seconds = start; seconds <= end + 0.0001; seconds += 0.04) {
        if (!await seekEditorDetectionFrame(seconds, token)) return null;
        const result = consume(seconds, editorFrameSignals());
        if (result !== null) return result;
      }
      return null;
    }

    async function scanEditorSerenAnchors(token) {
      const duration = editorDuration();
      if (!Number.isFinite(duration) || duration <= 0) throw new Error("影片長度無效");
      const anchors = {};
      const methods = {};
      const coarseStepS = 2;
      let hiddenStartS = null;
      let hiddenLastS = null;
      let consecutiveSeekFailures = 0;

      for (let seconds = 0; seconds < duration && !anchors.S_NOON; seconds += coarseStepS) {
        if (!await seekEditorDetectionFrame(seconds, token)) {
          if (token !== editorState.detectionToken || editorState.captureEnded) {
            throw new Error("階段偵測已取消");
          }
          consecutiveSeekFailures += 1;
          if (consecutiveSeekFailures >= 3) throw new Error("YouTube 連續跳轉失敗，請確認網路後再試一次");
          continue;
        }
        consecutiveSeekFailures = 0;
        const signals = editorFrameSignals();
        if (!anchors.S_P1 && seconds <= coarseStepS && signals.hudVisible
            && (signals.timerVisible || signals.bossVisible)) {
          anchors.S_P1 = 0;
          methods.S_P1 = "影片從 P1 開始";
        }
        if (signals.structureAbsent) {
          if (hiddenStartS === null) hiddenStartS = seconds;
          hiddenLastS = seconds;
        } else if (hiddenStartS !== null && signals.hudVisible) {
          const hiddenDurationS = Number(hiddenLastS || hiddenStartS) - hiddenStartS;
          if (!anchors.S_P1 && hiddenDurationS >= 2) {
            const refined = await refineEditorSerenAnchor(
              "hud",
              Math.max(0, hiddenStartS - coarseStepS),
              Math.min(duration, seconds + coarseStepS),
              token,
            );
            if (refined !== null) {
              anchors.S_P1 = refined;
              methods.S_P1 = "HUD 出現";
            }
          } else if (anchors.S_P1 && hiddenDurationS >= 4) {
            const refined = await refineEditorSerenAnchor(
              "wheel",
              Math.max(0, hiddenStartS - coarseStepS),
              Math.min(duration, seconds + 5),
              token,
            );
            if (refined !== null) {
              anchors.S_NOON = refined;
              methods.S_NOON = "正午轉輪啟動";
              break;
            }
          }
          hiddenStartS = null;
          hiddenLastS = null;
        } else if (!signals.structureAbsent) {
          hiddenStartS = null;
          hiddenLastS = null;
        }
        if (Math.round(seconds / coarseStepS) % 10 === 0) {
          updateEditorScanProgress(anchors.S_P1 ? "尋找 P2 正午" : "尋找 P1", seconds, duration);
          await new Promise((resolve) => requestAnimationFrame(resolve));
        }
      }

      if (!anchors.S_NOON) return { anchors, methods };
      const formPhases = ["S_SUNSET", "S_MIDNIGHT", "S_DAWN"];
      const minimumDelays = [20, 20, 8];
      let lastAnchorS = anchors.S_NOON;
      let lastCandidateS = -100;
      consecutiveSeekFailures = 0;

      for (let seconds = lastAnchorS + minimumDelays[0];
          seconds < duration && Object.keys(anchors).length < PHASE_ORDER.length;
          seconds += 1) {
        if (!await seekEditorDetectionFrame(seconds, token)) {
          if (token !== editorState.detectionToken || editorState.captureEnded) {
            throw new Error("階段偵測已取消");
          }
          consecutiveSeekFailures += 1;
          if (consecutiveSeekFailures >= 3) throw new Error("YouTube 連續跳轉失敗，請確認網路後再試一次");
          continue;
        }
        consecutiveSeekFailures = 0;
        const nextIndex = formPhases.findIndex((phase) => !Number.isFinite(anchors[phase]));
        if (nextIndex < 0) break;
        const minimumS = lastAnchorS + minimumDelays[nextIndex];
        if (seconds < minimumS) continue;
        const signals = editorFrameSignals();
        if (signals.serenTransition && seconds - lastCandidateS >= 5) {
          lastCandidateS = seconds;
          const refined = await refineEditorSerenAnchor(
            "form",
            Math.max(0, seconds - 1.4),
            Math.min(duration, seconds + 2.4),
            token,
          );
          if (refined !== null && refined >= minimumS) {
            const phase = formPhases[nextIndex];
            anchors[phase] = refined;
            methods[phase] = "HUD 保留全白轉場";
            lastAnchorS = refined;
            seconds = refined + minimumDelays[Math.min(nextIndex + 1, minimumDelays.length - 1)] - 1;
          }
        }
        if (Math.round(seconds) % 12 === 0) {
          updateEditorScanProgress(phaseDisplayLabel(formPhases[nextIndex]), seconds, duration);
          await new Promise((resolve) => requestAnimationFrame(resolve));
        }
      }
      return { anchors, methods };
    }

    async function scanEditorPhaseAnchors(token) {
      const duration = editorDuration();
      if (!Number.isFinite(duration) || duration <= 0) throw new Error("影片長度無效");
      const coarseStepS = duration >= 300 ? 4 : 2;
      const transitions = [];
      const whiteCandidates = [];
      const testedWhiteCandidates = new Set();
      let hiddenRun = null;
      let whiteRun = null;
      let directP1Candidate = false;
      let selectedChain = null;
      let p4Anchor = null;
      let consecutiveSeekFailures = 0;

      const seekCoarseFrame = async (seconds) => {
        const attempts = editorUsesYoutube() ? 2 : 1;
        for (let attempt = 0; attempt < attempts; attempt += 1) {
          if (await seekEditorDetectionFrame(seconds, token)) return true;
          if (token !== editorState.detectionToken || editorState.captureEnded) return false;
          await delay(120);
        }
        return false;
      };

      const updateHiddenMatches = (run, seconds) => {
        const matches = editorTemplateMatches();
        for (const phase of PHASE_ORDER) {
          const match = matches[phase];
          if (!match) continue;
          const previous = run.bestMatches[phase];
          if (!previous || match.score > previous.score) {
            run.bestMatches[phase] = { ...match, seconds };
          }
        }
      };

      const phaseMatch = (candidate, phase) => candidate?.bestMatches?.[phase] || null;
      const phaseTime = (candidate, phase) => {
        if (candidate.direct) return 0;
        const match = phaseMatch(candidate, phase);
        let value = Number(candidate.visibleS || 0);
        if (match) {
          const hudDelayS = Number(state.assets.phases?.[phase]?.start_to_hud_visible_ms || 0) / 1000;
          value = Number(match.seconds || 0) - Number(match.offset_seconds || 0) + hudDelayS;
        }
        return Math.max(candidate.startS, Math.min(candidate.endS, value));
      };

      const affinity = (value, target, spread) => Math.max(0, 1 - Math.abs(value - target) / spread);
      const selectChain = (relaxed = false) => {
        const p1Minimum = relaxed ? 0.16 : 0.28;
        const p2Minimum = relaxed ? 0.14 : 0.30;
        const p3Minimum = relaxed ? 0.28 : 0.44;
        const p1Candidates = transitions.filter((candidate) => Number(phaseMatch(candidate, "P1")?.score || 0) >= p1Minimum);
        if (directP1Candidate) {
          p1Candidates.unshift({ direct: true, startS: 0, endS: 0, visibleS: 0, bestMatches: {} });
        }
        const p2Candidates = transitions.filter((candidate) => Number(phaseMatch(candidate, "P2")?.score || 0) >= p2Minimum);
        const p3Candidates = transitions.filter((candidate) => Number(phaseMatch(candidate, "P3")?.score || 0) >= p3Minimum);
        let best = null;
        for (const p1 of p1Candidates) {
          const p1S = phaseTime(p1, "P1");
          for (const p2 of p2Candidates) {
            if (p2 === p1) continue;
            const p2S = phaseTime(p2, "P2");
            const p1DurationS = p2S - p1S;
            if (p1DurationS < 35 || p1DurationS > 330) continue;
            for (const p3 of p3Candidates) {
              if (p3 === p1 || p3 === p2) continue;
              const p3S = phaseTime(p3, "P3");
              const p2DurationS = p3S - p2S;
              if (p2DurationS < 150 || p2DurationS > 720) continue;
              const score = Number(phaseMatch(p1, "P1")?.score || (p1.direct ? 0.45 : 0))
                + Number(phaseMatch(p2, "P2")?.score || 0) * 1.2
                + Number(phaseMatch(p3, "P3")?.score || 0) * 1.4
                + affinity(p1DurationS, 165, 165) * 2
                + affinity(p2DurationS, 400, 320) * 2.4;
              if (!best || score > best.score) {
                best = { p1, p2, p3, p1S, p2S, p3S, score };
              }
            }
          }
        }
        return best;
      };

      const tryWhiteCandidate = async (candidate, chain) => {
        if (!candidate || !chain || candidate.firstS < chain.p3S + 120) return null;
        const key = candidate.firstS.toFixed(3);
        if (testedWhiteCandidates.has(key)) return null;
        testedWhiteCandidates.add(key);
        const refined = await refineEditorPhaseAnchor(
          "P4",
          Math.max(0, candidate.firstS - coarseStepS - 1),
          Math.min(duration, candidate.lastS + 1),
          token,
        );
        return refined === null ? null : Number(refined.toFixed(3));
      };

      for (let seconds = 0; seconds < duration; seconds += coarseStepS) {
        if (!await seekCoarseFrame(seconds)) {
          if (token !== editorState.detectionToken || editorState.captureEnded) {
            throw new Error("階段偵測已取消");
          }
          consecutiveSeekFailures += 1;
          if (consecutiveSeekFailures >= 3) throw new Error("YouTube 連續跳轉失敗，請確認網路後再試一次");
          continue;
        }
        consecutiveSeekFailures = 0;
        const signals = editorFrameSignals();
        let newWhiteCandidate = null;
        if (seconds <= 12 && signals.hudVisible && (signals.timerVisible || signals.bossVisible)) {
          directP1Candidate = true;
        }

        if (signals.structureAbsent) {
          if (!hiddenRun) {
            hiddenRun = { startS: seconds, lastS: seconds, bestMatches: {} };
          }
          hiddenRun.lastS = seconds;
          updateHiddenMatches(hiddenRun, seconds);
        } else if (hiddenRun) {
          if (signals.hudVisible) {
            transitions.push({
              startS: Math.max(0, hiddenRun.startS - coarseStepS),
              hiddenStartS: hiddenRun.startS,
              hiddenLastS: hiddenRun.lastS,
              visibleS: seconds,
              endS: Math.min(duration, seconds + coarseStepS),
              bestMatches: hiddenRun.bestMatches,
            });
            selectedChain = selectChain(false) || selectedChain;
          }
          hiddenRun = null;
        }

        if (signals.hudVisible && signals.stageWhite) {
          if (!whiteRun || seconds - whiteRun.lastS > coarseStepS * 1.5) {
            whiteRun = { firstS: seconds, lastS: seconds, count: 1, recorded: false };
          } else {
            whiteRun.lastS = seconds;
            whiteRun.count += 1;
          }
          if (whiteRun.count >= 2 && !whiteRun.recorded) {
            whiteRun.recorded = true;
            newWhiteCandidate = { firstS: whiteRun.firstS, lastS: whiteRun.lastS };
            whiteCandidates.push(newWhiteCandidate);
          }
        } else {
          whiteRun = null;
        }

        if (selectedChain && newWhiteCandidate) {
          p4Anchor = await tryWhiteCandidate(newWhiteCandidate, selectedChain);
          if (p4Anchor !== null) break;
          await seekEditorDetectionFrame(seconds, token);
        }

        if (Math.round(seconds / coarseStepS) % (editorUsesYoutube() ? 8 : 20) === 0) {
          updateEditorScanProgress(selectedChain ? "P4" : "P1-P3", seconds, duration);
          await new Promise((resolve) => requestAnimationFrame(resolve));
        }
      }

      selectedChain = selectedChain || selectChain(true);
      if (!selectedChain) return { anchors: {}, methods: {} };

      if (p4Anchor === null) {
        for (const candidate of whiteCandidates) {
          p4Anchor = await tryWhiteCandidate(candidate, selectedChain);
          if (p4Anchor !== null) break;
        }
      }
      if (p4Anchor === null) {
        const fallbackP4 = transitions
          .filter((candidate) => phaseTime(candidate, "P4") >= selectedChain.p3S + 120)
          .filter((candidate) => Number(phaseMatch(candidate, "P4")?.score || 0) >= 0.4)
          .sort((a, b) => Number(phaseMatch(b, "P4")?.score || 0) - Number(phaseMatch(a, "P4")?.score || 0))[0];
        if (fallbackP4) {
          p4Anchor = await refineEditorPhaseAnchor("P4", fallbackP4.startS, fallbackP4.endS, token);
        }
      }

      const anchors = {};
      const methods = {};
      for (const [phase, candidate] of [["P1", selectedChain.p1], ["P2", selectedChain.p2], ["P3", selectedChain.p3]]) {
        if (candidate.direct) {
          anchors[phase] = 0;
          methods[phase] = "video_starts_in_phase";
          continue;
        }
        const estimate = phaseTime(candidate, phase);
        const refined = await refineEditorPhaseAnchor(
          phase,
          Math.max(candidate.startS, estimate - 3),
          Math.min(candidate.endS, estimate + 3),
          token,
        );
        anchors[phase] = Number((refined === null ? estimate : refined).toFixed(3));
        methods[phase] = refined === null ? "cutscene_template_estimate" : "cutscene_to_hud_refined";
      }
      if (p4Anchor !== null) {
        anchors.P4 = Number(p4Anchor.toFixed(3));
        methods.P4 = "short_transition_to_white_hud";
      }
      return { anchors, methods };
    }

    function applyEditorPhaseAnchors(rawAnchors, rawMethods = {}, label = "畫面偵測") {
      const anchors = {};
      const methods = {};
      for (const phase of PHASE_ORDER) {
        const raw = rawAnchors?.[phase];
        const value = typeof raw === "object"
          ? Number(raw?.gate_start_s ?? raw?.estimated_hud_s)
          : Number(raw);
        if (!Number.isFinite(value) || value < 0) continue;
        anchors[phase] = value;
        methods[phase] = rawMethods?.[phase]
          || (typeof raw === "object" ? String(raw?.template || label) : label);
      }
      editorState.hudTimes = anchors;
      editorState.phaseMethods = methods;
      const count = Object.keys(anchors).length;
      els.editorPhaseStatus.textContent = `${label} ${count}/${PHASE_ORDER.length}`;
      renderEditor();
      return count;
    }

    async function autoDetectEditorPhases() {
      if (!state.assets || !editorHasSource() || editorState.detecting) return;
      if (editorState.sourceMode === "baseline" || editorUsesBaselineYoutube()) {
        const count = applyEditorPhaseAnchors(
          activeBaselineReplay()?.phase_hints || {},
          {},
          editorUsesBaselineYoutube() ? "已套用基準 YouTube 校正" : "已由基準影片畫面偵測",
        );
        if (count === PHASE_ORDER.length) return;
      }
      if (editorUsesYoutube() && !editorState.youtubeReady) {
        els.editorPhaseStatus.textContent = "YouTube 播放器尚未就緒";
        return;
      }

      const scanUsesYoutube = editorUsesYoutube();
      const token = editorState.detectionToken + 1;
      editorState.detectionToken = token;
      editorState.detecting = true;
      editorState.hudTimes = {};
      editorState.phaseMethods = {};
      els.editorDetectPhasesBtn.disabled = true;
      els.editorPhaseStatus.textContent = scanUsesYoutube ? "請分享目前分頁" : "正在掃描影片畫面";
      const restoreTime = editorCurrentTime();
      const restoreMuted = editorMuted();
      const restoreRate = editorPlaybackRate();
      const resume = !editorPaused();
      editorPause();
      editorSetMuted(true);
      renderEditor();
      try {
        if (scanUsesYoutube) {
